<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大電視 · 後台</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root{--bg:#0b0e14;--panel:#141a24;--panel2:#1b2330;--line:#28313f;--txt:#eef3fa;--dim:#8b98ab;
        --ok:#25c26e;--accent:#5b8cff;--danger:#e8564a;--warn:#f2b53c}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0e131c}
  ::-webkit-scrollbar-thumb{background:#2d3746;border-radius:6px;border:2px solid #0e131c}
  ::-webkit-scrollbar-thumb:hover{background:#3b475a}
  *{scrollbar-color:#2d3746 #0e131c;scrollbar-width:thin}
  body{margin:0;background:radial-gradient(1200px 700px at 70% -10%, #17233a 0%, var(--bg) 60%);
       color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
       min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--txt);background:var(--panel2)}
  button:active{transform:translateY(1px)}
  input,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--bg);border:1px solid var(--line);
                 border-radius:9px;padding:8px 11px;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  header{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:19px;margin:0}
  .pill{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .pill.on{border-color:var(--ok);color:#8ff0bd}
  .pill.off{border-color:#5a3540;color:#f09a9a}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{padding:10px 18px;font-size:14px;background:var(--panel2);color:var(--dim)}
  .tabs button.on{background:#1b2740;color:var(--txt);box-shadow:0 0 0 1px var(--accent) inset}
  .pane{display:none}.pane.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .cols{display:grid;grid-template-columns:260px 1fr;gap:14px}
  @media (max-width:780px){.cols{grid-template-columns:1fr}}
  .deck{display:flex;flex-direction:column;gap:6px}
  .deck button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:13.5px;text-align:left}
  .deck button.on{background:#1b2740;box-shadow:0 0 0 1px var(--accent) inset}
  .deck button i{font-style:normal;color:var(--dim);font-size:12px}
  h2{font-size:13px;color:var(--dim);margin:0 0 10px;letter-spacing:1px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:5px 8px;border-bottom:1px solid #1c2431;vertical-align:middle}
  td input{padding:6px 9px;font-size:13.5px}
  .del{background:transparent;color:#8d97a7;font-size:16px;padding:4px 8px;border-radius:8px}
  .del:hover{background:#2a1b1e;color:var(--danger)}
  .del:hover{color:var(--danger)}
  .items{max-height:min(46vh,460px);overflow:auto}
  .items td{border-bottom:1px solid #1a222e}
  .btn-primary{padding:12px 20px;background:linear-gradient(180deg,#3f74ff,#2c5ce0)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:9px 14px;font-size:13px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#20304a;border:1px solid var(--accent);
         padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .toast.err{border-color:var(--danger)}
  .gate{max-width:340px;margin:12vh auto;text-align:center}
  .lbrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #1c2431}
  .lbrow .no{width:28px;font-weight:900;color:var(--dim)}
  .lbrow .nm{flex:1;font-weight:700}
  .lbrow .pts{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
  .sub{color:var(--dim);font-size:12px}
  .stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .stat div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <h1>大電視 · 後台</h1>
      <span class="pill" id="status">檢查連線…</span>
    </div>
    <div class="row">
      <button class="btn-ghost" id="btnPlay">去主持台 →</button>
      <button class="btn-ghost" id="btnLogout">登出</button>
    </div>
  </header>

  <!-- 登入 -->
  <div class="card gate" id="gate">
    <h2 style="font-size:15px;color:var(--txt)">後台密碼</h2>
    <input id="pin" type="password" placeholder="PIN" autocomplete="current-password" style="margin:12px 0">
    <button class="btn-primary" id="btnLogin" style="width:100%">登入</button>
    <p class="sub" style="margin-top:10px">PIN 由 server 環境變數 BIGTV_PIN 設定</p>
  </div>

  <div id="main" style="display:none">
    <div class="tabs">
      <button data-tab="bank" class="on">題庫</button>
      <button data-tab="lb">排行榜</button>
    </div>

    <!-- ===== 題庫 ===== -->
    <section class="pane on" id="pane-bank">
      <div class="cols">
        <div class="card">
          <h2>類別</h2>
          <div class="deck" id="deckList"></div>
          <div class="row" style="margin-top:12px">
            <input id="newDeck" placeholder="新類別" class="grow">
            <button class="btn-ghost" id="btnAddDeck">＋</button>
          </div>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <h2 style="margin:0" id="deckTitle">題目</h2>
            <div class="row">
              <button class="btn-ghost" id="btnImport">匯入 JSON</button>
              <button class="btn-ghost" id="btnExport">匯出 JSON</button>
              <button class="btn-ghost" id="btnDelDeck" style="color:#e08a8a">刪除類別</button>
            </div>
          </div>
          <div class="items">
            <table>
              <thead><tr><th>題目</th><th style="width:56px"></th></tr></thead>
              <tbody id="itemRows"></tbody>
            </table>
          </div>
          <div style="margin-top:14px">
            <h2>批量新增（每行一題）</h2>
            <textarea id="bulk" rows="3" placeholder="雞蛋仔&#10;菠蘿包&#10;開會"></textarea>
            <div class="row" style="margin-top:8px"><button class="btn-ghost" id="btnBulk">加入題目</button></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 排行榜 ===== -->
    <section class="pane" id="pane-lb">
      <div class="stat" id="lbStat"></div>
      <div class="cols" style="grid-template-columns:1fr 1fr">
        <div class="card">
          <h2>累計榜（全部場次）</h2>
          <div id="lbPlayers"></div>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:8px">
            <h2 style="margin:0">最近場次</h2>
            <button class="btn-ghost" id="btnClearSessions" style="color:#e08a8a">清空全部成績</button>
          </div>
          <div id="lbSessions" style="max-height:56vh;overflow:auto"></div>
        </div>
      </div>
    </section>
  </div>
</div>
<input type="file" id="file" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let TOKEN = localStorage.getItem("bigtv.token") || "";
let BANK = null, CUR = null, LB = null;
let BUSY = false;      // 有 request 未返時，唔准再撳（避免加錯類別）

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let tt=null;
function toast(msg, err){ const el=$("#toast"); el.textContent=msg; el.className="toast on"+(err?" err":"");
  clearTimeout(tt); tt=setTimeout(()=>el.className="toast",1800); }

async function api(path, {method="GET", body=null, auth=false}={}){
  const opt={method, headers:{}};
  if(body) { opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  if(auth) opt.headers["X-Admin-Token"]=TOKEN;
  const r = await fetch(path, opt);
  let data={}; try{ data = await r.json(); }catch(e){}
  if(r.status===401){ TOKEN=""; localStorage.removeItem("bigtv.token"); gateShow(); throw new Error("需要登入"); }
  if(!r.ok) throw new Error(data.error || ("HTTP "+r.status));
  return data;
}

/* ---------- 連線狀態 ---------- */
async function ping(){
  try{ await api("/api/ping"); $("#status").textContent="已連線"; $("#status").className="pill on"; return true; }
  catch(e){ $("#status").textContent="未連線（server 冇開？）"; $("#status").className="pill off"; return false; }
}

/* ---------- 登入 ---------- */
function gateShow(){ $("#gate").style.display="block"; $("#main").style.display="none"; }
function gateHide(){ $("#gate").style.display="none"; $("#main").style.display="block"; }
$("#btnLogin").onclick = async ()=>{
  const pin=$("#pin").value;
  try{
    const d = await api("/api/login",{method:"POST",body:{pin}});
    TOKEN = d.token; localStorage.setItem("bigtv.token", TOKEN);
    gateHide(); boot();
  }catch(e){ toast("密碼唔對", true); }
};
$("#pin").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#btnLogin").click(); });
$("#btnLogout").onclick = async ()=>{ try{ await api("/api/logout",{method:"POST",auth:true}); }catch(e){}
  TOKEN=""; localStorage.removeItem("bigtv.token"); gateShow(); };
$("#btnPlay").onclick = ()=> window.open("/", "_blank");

/* ---------- tab ---------- */
$$(".tabs button").forEach(b=>b.onclick=()=>{
  $$(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
  $$(".pane").forEach(p=>p.classList.remove("on"));
  $("#pane-"+b.dataset.tab).classList.add("on");
  if(b.dataset.tab==="lb") loadLb();
});

/* ---------- 題庫 ---------- */
async function loadBank(){
  BANK = await api("/api/bank");
  if(!CUR || !BANK.decks.some(d=>d.id===CUR)) CUR = BANK.decks[0] ? BANK.decks[0].id : null;
  renderDecks(); renderItems();
}
function renderDecks(){
  $("#deckList").innerHTML = BANK.decks.map(d=>`
    <button class="${d.id===CUR?"on":""}" data-id="${esc(d.id)}">
      <span>${esc(d.name)}</span><i>${d.items.length}</i></button>`).join("")
    || `<p class="sub">未有類別</p>`;
  $$("#deckList button").forEach(b=>b.onclick=()=>{ CUR=b.dataset.id; renderDecks(); renderItems(); });
}
function renderItems(){
  const deck = BANK.decks.find(d=>d.id===CUR);
  $("#deckTitle").textContent = deck ? `${deck.name}（${deck.items.length}）` : "題目";
  $("#itemRows").innerHTML = deck ? deck.items.map(it=>`
    <tr data-id="${it.id}">
      <td><input data-k="t" value="${esc(it.t)}"></td>
      <td><button class="del" data-del="${it.id}">✕</button></td>
    </tr>`).join("") : "";
  $$("#itemRows input").forEach(inp=>{
    inp.onchange = async ()=>{
      const id = +inp.closest("tr").dataset.id;
      const t = inp.value.trim();
      if(!t){ toast("題目唔可以空",true); loadBank().catch(()=>{}); return; }
      try{
        await api("/api/items/"+id,{method:"PATCH",body:{t},auth:true});
        toast("已儲存");
      }catch(e){ toast(e.message,true); }
      loadBank().catch(()=>{});
    };
  });
  $$("#itemRows .del").forEach(b=>b.onclick=async()=>{
    try{ await api("/api/items/"+b.dataset.del,{method:"DELETE",auth:true}); await loadBank(); toast("已刪除"); }
    catch(e){ toast(e.message,true); }
  });
}
$("#btnAddDeck").onclick = async ()=>{
  const n=$("#newDeck").value.trim(); if(!n) return;
  if(BUSY){ toast("處理中，等一等"); return; }
  BUSY=true;
  try{ const d = await api("/api/decks",{method:"POST",body:{name:n},auth:true});
    $("#newDeck").value=""; CUR=d.id; await loadBank(); toast("已新增類別"); }
  catch(e){ toast(e.message,true); }
  finally{ BUSY=false; }
};
$("#btnDelDeck").onclick = async ()=>{
  const deck = BANK.decks.find(d=>d.id===CUR); if(!deck) return;
  if(!confirm(`刪除「${deck.name}」同 ${deck.items.length} 題？`)) return;
  try{ await api("/api/decks/"+CUR,{method:"DELETE",auth:true}); CUR=null; await loadBank(); toast("已刪除類別"); }
  catch(e){ toast(e.message,true); }
};
$("#btnBulk").onclick = async ()=>{
  if(BUSY){ toast("處理中，等一等"); return; }
  if(!CUR){ toast("先揀類別",true); return; }
  const lines = $("#bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return;
  const items = lines.map(l=>l.split("|")[0].trim()).filter(Boolean).map(t=>({t}));
  BUSY=true;
  try{ const d = await api(`/api/decks/${CUR}/items`,{method:"POST",body:{items},auth:true});
    $("#bulk").value=""; await loadBank(); toast(`已加入 ${d.added} 題（重覆已跳過）`); }
  catch(e){ toast(e.message,true); }
  finally{ BUSY=false; }
};
$("#btnImport").onclick = ()=> $("#file").click();
$("#file").onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  const txt = await f.text();
  try{
    const inc = JSON.parse(txt);
    const decks = Array.isArray(inc) ? inc : (inc.decks||[]);
    let addedDeck=0, addedItem=0;
    for(const d of decks){
      const name = String(d.name||"匯入").slice(0,40);
      let target = BANK.decks.find(x=>x.name===name);
      if(!target){
        target = await api("/api/decks",{method:"POST",body:{name},auth:true});
        addedDeck++;
      }
      const items = (d.items||[]).map(it=> typeof it==="string" ? it : (it&&it.t)||"").map(s=>String(s).trim()).filter(Boolean).map(t=>({t}));
      if(items.length){
        const r = await api(`/api/decks/${target.id}/items`,{method:"POST",body:{items},auth:true});
        addedItem += r.added;
      }
    }
    await loadBank();
    toast(`匯入完成：${addedDeck} 個新類別、${addedItem} 題`);
  }catch(err){ toast("JSON 有問題或匯入失敗", true); }
  e.target.value="";
};
$("#btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify(BANK,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`bigtv-bank-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast("已匯出");
};

/* ---------- 排行榜 ---------- */
async function loadLb(){
  try{ LB = await api("/api/leaderboard?limit=20"); }catch(e){ return; }
  const played = LB.players.reduce((s,p)=>s+p.games,0);
  $("#lbStat").innerHTML = `
    <div><b>${LB.sessions_total}</b><span>總場次</span></div>
    <div><b>${LB.players.length}</b><span>玩過嘅人</span></div>
    <div><b>${played}</b><span>人次</span></div>
    <div><b>${LB.players.reduce((s,p)=>s+p.ok,0)}</b><span>累計答對</span></div>`;
  $("#lbPlayers").innerHTML = LB.players.map((p,i)=>`
    <div class="lbrow">
      <div class="no">${i+1}</div>
      <div class="nm">${esc(p.name)}<div class="sub">${p.games} 場 · 最佳 ${p.best} · 對 ${p.ok}／跳 ${p.skips}</div></div>
      <div class="pts">${p.total}</div>
    </div>`).join("") || `<p class="sub" style="padding:12px">未有紀錄</p>`;
  $("#lbSessions").innerHTML = LB.recent.map(s=>`
    <div class="lbrow" style="align-items:flex-start">
      <div class="nm">
        <b>#${s.id}</b> ${esc(s.mode||"")}
        <div class="sub">${esc((s.finished_at||"").replace("T"," ").slice(0,16))} · ${s.players} 人 · 冠軍 ${esc(s.winner||"—")}（${s.winner_score??0}）</div>
      </div>
      <button class="del" data-s="${s.id}" title="刪除">✕</button>
    </div>`).join("") || `<p class="sub" style="padding:12px">未有場次</p>`;
  $$("#lbSessions .del").forEach(b=>b.onclick=async()=>{
    if(!confirm("刪除呢場紀錄？")) return;
    try{ await api("/api/sessions/"+b.dataset.s,{method:"DELETE",auth:true}); await loadLb(); toast("已刪除"); }
    catch(e){ toast(e.message,true); }
  });
}
$("#btnClearSessions").onclick = async ()=>{
  if(!confirm("清空全部場次同排行榜？不可復原。")) return;
  try{ await api("/api/reset",{method:"POST",body:{what:"sessions"},auth:true}); await loadLb(); toast("已清空"); }
  catch(e){ toast(e.message,true); }
};

/* ---------- 啟動 ---------- */
async function boot(){
  if(!await ping()) return;
  try{ await loadBank(); }catch(e){ toast(e.message,true); return; }
  loadLb();
}
(async ()=>{
  await ping();
  if(TOKEN){
    try{ await loadBank(); gateHide(); loadLb(); }catch(e){ gateShow(); }
  } else gateShow();
})();
</script>
</body>
</html>
