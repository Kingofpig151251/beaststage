<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>遙控 · 百獸台</title>
<style>
  /* Hallmark · remote console · theme: bright system · scope: app
     一件事：三粒掣，按完即走。 */
  :root{
    color-scheme:light;
    --bg:#F2F2F7; --surface:#FFFFFF;
    --ink:#000000; --ink-2:rgba(60,60,67,.72); --ink-3:rgba(60,60,67,.40);
    --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.20);
    --blue:#0071E3; --green:#34C759; --red:#FF3B30;
    --on-accent:#FFFFFF; --on-accent-2:rgba(255,255,255,.70); --focus:rgba(0,113,227,.85);
    --r:22px; --pill:999px;
    --ease:cubic-bezier(.32,.72,0,1);
    --font:-apple-system,BlinkMacSystemFont,system-ui,"PingFang HK","Noto Sans HK",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0; overflow:clip}
  body{background:var(--bg); color:var(--ink); font-family:var(--font);
    display:flex; flex-direction:column; gap:10px;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}

  .hud{display:flex; align-items:center; gap:10px; flex:none}
  .badge{width:44px; height:44px; border-radius:14px; background:var(--surface); flex:none;
    display:grid; place-items:center; box-shadow:inset 0 0 0 1px var(--sep)}
  .badge img{width:28px; height:28px; display:block}
  .who{display:flex; flex-direction:column; min-width:0; flex:1}
  .name{font-weight:700; font-size:20px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sub{font-size:13px; color:var(--ink-2)}
  .clock{font-variant-numeric:tabular-nums; font-weight:700; font-size:26px; min-width:2ch; text-align:right}
  .clock.warn{color:var(--red)}

  .grid{flex:1; display:grid; gap:10px; min-height:0}
  .grid.judge{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
  .btn{border:0; border-radius:var(--r); font:inherit; font-weight:700; color:var(--ink);
    background:var(--surface); box-shadow:inset 0 0 0 1px var(--sep);
    display:grid; place-content:center; justify-items:center; gap:6px; padding:8px; touch-action:manipulation;
    transition:transform .12s var(--ease), background-color .12s}
  .btn small{font-size:12px; font-weight:500; color:var(--ink-3)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
  .btn.span2{grid-column:span 2}
  .btn.ok{grid-column:span 2; background:var(--blue); color:var(--on-accent); box-shadow:none}
  .btn.ok small{color:var(--on-accent-2)}
  .btn.foul{color:var(--red)}
  .btn[disabled]{opacity:.38; pointer-events:none}
  .big{font-size:clamp(26px,7vw,40px); letter-spacing:.02em}

  .state{flex:none; text-align:center; font-size:13px; color:var(--ink-3); min-height:18px}
  .splash{position:fixed; inset:0; display:none; place-items:center; background:var(--bg);
    text-align:center; padding:24px; font-size:16px; color:var(--ink-2); line-height:1.7}
  .splash.on{display:grid}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <div class="hud">
    <span class="badge" id="mark"></span>
    <span class="who">
      <span class="name" id="team">連線中…</span>
      <span class="sub" id="score"></span>
    </span>
    <span class="clock" id="clock"></span>
  </div>

  <div class="grid judge" id="pad"></div>
  <div class="state" id="state"></div>

  <div class="splash on" id="splash">正在連接主持台…<br><small>請確認主持台已開始遊戲</small></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const SID = new URLSearchParams(location.search).get("s") || "";
const ICONS = {
  turtle:"/art/team/turtle.webp", fox:"/art/team/fox.webp", whale:"/art/team/whale.webp",
  octopus:"/art/team/octopus.webp", bee:"/art/team/bee.webp", flamingo:"/art/team/flamingo.webp",
  dolphin:"/art/team/dolphin.webp", bear:"/art/team/bear.webp"
};
let last = null, seq = 0, busy = 0, fail = 0;

function paint(st){
  if(!st){ return; }
  $("#splash").classList.remove("on");
  const t = st.team || {};
  $("#mark").innerHTML = t.id && ICONS[t.id] ? `<img src="${ICONS[t.id]}" alt="">` : "";
  $("#team").textContent = t.name || "·";
  const pts = t.score == null ? "" : `${t.score} 分`;
  const bits = st.phase === "running"
    ? [pts, `第 ${(st.turn||0)+1} 隊`]
    : [st.label, pts];
  if(st.allowSkip === false) bits.push("跳過已關閉");
  else if(st.phase === "running") bits.push(`跳過剩 ${skips}`);
  $("#score").textContent = bits.filter(Boolean).join(" · ");
  const sec = Number(st.remaining);
  $("#clock").textContent = st.phase === "running" && isFinite(sec) ? Math.max(0, Math.ceil(sec)) : "";
  $("#clock").classList.toggle("warn", st.phase === "running" && sec <= 10);

  const pad = $("#pad");
  const skips = st.skipLeft == null ? 3 : Math.max(0, st.skipLeft);
  const key = st.phase + "|" + skips;
  if(pad.dataset.key === key) return;
  pad.dataset.key = key;

  if(st.phase === "running"){
    pad.className = "grid judge";
    pad.innerHTML = `
      <button class="btn foul" data-k="foul"><span class="big">犯規</span><small>← 向左</small></button>
      <button class="btn" data-k="skip" ${skips <= 0 ? "disabled" : ""}><span class="big">跳過</span><small>剩 ${skips} 次</small></button>
      <button class="btn ok" data-k="ok"><span class="big">正確</span><small>→ 向右</small></button>`;
  }else if(st.phase === "ready"){
    pad.className = "grid";
    pad.style.gridTemplateColumns = "1fr";
    pad.innerHTML = `<button class="btn ok span2" data-k="ready"><span class="big">準備好</span><small>開始倒數</small></button>`;
  }else if(st.phase === "interstitial"){
    pad.className = "grid";
    pad.style.gridTemplateColumns = "1fr";
    pad.innerHTML = `<button class="btn ok span2" data-k="next"><span class="big">繼續</span><small>下一隊</small></button>`;
  }else{
    pad.className = "grid";
    pad.style.gridTemplateColumns = "1fr";
    pad.innerHTML = `<button class="btn span2" disabled><span class="big">已完場</span></button>`;
  }
}

async function send(kind){
  if(!SID || Date.now() < busy) return;
  busy = Date.now() + 220;
  if(navigator.vibrate) navigator.vibrate(12);
  try{
    await fetch("/api/cmd", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id: SID, kind})
    });
  }catch(e){}
}

$("#pad").addEventListener("click", e=>{
  const b = e.target.closest("[data-k]");
  if(b && !b.disabled) send(b.dataset.k);
});

async function tick(){
  if(!SID){ $("#splash").textContent = "缺少連線代碼，請重新掃描主持台的 QR 條碼"; return; }
  try{
    const r = await fetch(`/api/session?id=${SID}&since=${seq}`, {cache:"no-store"});
    if(!r.ok) throw new Error("bad");
    const d = await r.json();
    fail = 0;
    last = d.state; paint(last);
    $("#state").textContent = "";
  }catch(e){
    fail++;
    if(fail > 3) $("#state").textContent = "連線中斷，正在重試…";
  }finally{
    setTimeout(tick, 260);
  }
}
paint(null);
tick();
</script>
</body>
</html>
