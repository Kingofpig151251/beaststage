<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="大電視題目：一段文字，一行一題。任何人改得，改完自動儲存。">
<title>題目 · 大電視</title>
<style>
  /* Hallmark · redesign: utility screen · genre: functional · theme: Arcade (ember / grille) · scope: app · v2.0.0
     critique · one textarea, one idea: the text IS the game. Nothing else to learn, nothing else to break.
     waive type · no webfonts: the page must load instantly on a party iPad */
  :root{
    --paper:#000000; --paper-2:#1C1C1E;
    --ink:#FFFFFF; --ink-2:rgba(235,235,245,.60); --muted:rgba(235,235,245,.30);
    --rule:rgba(84,84,88,.65); --accent:#0A84FF;
    --accent-2:#30D158; --focus:#0A84FF;
    --bar:1px; --radius:16px;
    --font-body:-apple-system,BlinkMacSystemFont,system-ui,"PingFang HK","Noto Sans HK",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; overflow-x:clip}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px;
    display:flex; flex-direction:column; gap:10px; padding:14px 16px}
  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  h1{margin:0; font-size:28px; line-height:1; text-wrap:balance}
  .kv{font-size:12px; color:var(--muted)}
  .dot{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
  .dot::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted)}
  .dot.ok{color:var(--accent-2)} .dot.ok::before{background:var(--accent-2)}
  .dot.bad{color:var(--accent)} .dot.bad::before{background:var(--accent)}
  .grow{margin-left:auto}
  a{text-decoration:none}
  button{font-family:inherit; font-size:17px; font-weight:500; min-height:44px; padding:0 18px; cursor:pointer;
    background:var(--paper-2); color:var(--ink); border:0; border-radius:12px}
  button:active{background:var(--rule)}
  button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  textarea{flex:1; width:100%; min-height:0; resize:none; padding:14px 16px;
    background:var(--paper-2); color:var(--ink); border:var(--bar) solid var(--rule);
    border-radius:var(--radius); font-family:var(--font-mono); font-size:15px; line-height:1.7}
  textarea:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
</style>
</head>
<body>
  <header>
    <a href="/"><button>← 返回主持台</button></a>
    <h1>題目</h1>
    <span class="kv" id="meta">正在載入…</span>
    <span class="dot" id="state">正在載入…</span>
  </header>

  <textarea id="text" spellcheck="false" autocomplete="off" autocapitalize="off"
    placeholder="請貼上題目，一行一題&#10;雞蛋仔&#10;菠蘿包&#10;絲襪奶茶" aria-label="題目"></textarea>

<script>
"use strict";
const $ = s => document.querySelector(s);
let saveTimer = null, lastSaved = "";

function setState(kind, text){
  const el = $("#state");
  el.className = "dot " + (kind || "");
  el.textContent = text;
}
function countLines(t){
  return String(t || "").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).length;
}
function paintMeta(){
  const n = countLines($("#text").value);
  $("#meta").textContent = n ? `${n} 題` : "未有題目";
}

async function load(){
  setState("", "正在載入…");
  try{
    const r = await fetch("/api/text", { cache:"no-store" });
    if(!r.ok) throw new Error("bad");
    const d = await r.json();
    $("#text").value = d.text || "";
    lastSaved = $("#text").value;
    paintMeta();
    setState("ok", "已連接");
  }catch(e){
    setState("bad", "未連接，正在自動重試…");
  }
}

async function save(){
  clearTimeout(saveTimer);
  const text = $("#text").value;
  if(text === lastSaved) return;
  setState("", "正在儲存…");
  try{
    const r = await fetch("/api/text", {
      method:"PUT", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text })
    });
    if(!r.ok) throw new Error("put");
    lastSaved = text;
    setState("ok", "已儲存");
  }catch(e){
    setState("bad", "儲存失敗，稍後將自動重試");
  }
}
function scheduleSave(){
  setState("", "尚未儲存…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
}

$("#text").oninput = ()=>{ paintMeta(); scheduleSave(); };
document.addEventListener("keydown", e=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); }
});
window.addEventListener("beforeunload", e=>{
  if($("#text").value !== lastSaved){ e.preventDefault(); e.returnValue = ""; }
});

/* 斷線時自動重試；同時取得其他使用者的修改（若有未儲存內容則不覆蓋） */
async function poll(){
  if($("#text").value !== lastSaved) return;
  try{
    const r = await fetch("/api/text", { cache:"no-store" });
    if(!r.ok) throw new Error("bad");
    const d = await r.json();
    setState("ok", "已連接");
    if((d.text || "") === lastSaved) return;
    $("#text").value = d.text || "";
    lastSaved = $("#text").value;
    paintMeta();
    setState("ok", "已更新");
  }catch(e){
    setState("bad", "未連接，正在自動重試…");
  }
}
setInterval(poll, 15000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) poll(); });
window.addEventListener("focus", poll);

load();
</script>
</body>
</html>
