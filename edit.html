<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Leung Tung Lam">
<meta name="copyright" content="© 2026 Leung Tung Lam. MIT License.">
<meta name="description" content="百獸台設定：標題、副標題與題目。改完自動儲存。">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="百獸台">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>設定 · 百獸台</title>
<style>
  /* Hallmark · utility screen · theme: bright system · scope: app
     One textarea, one idea: the text IS the game. */
  :root{
    color-scheme:light;
    --bg:#F2F2F7; --surface:#FFFFFF;
    --ink:#000000; --ink-2:rgba(60,60,67,.72); --ink-3:rgba(60,60,67,.40);
    --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.20);
    --blue:#0071E3; --green:#34C759; --red:#FF3B30;
    --r-xl:22px; --r-lg:16px; --r-md:12px; --pill:999px;
    --focus-ring:rgba(0,113,227,.85); --vs-shadow:rgba(0,0,0,.18);
    --thumb:rgba(60,60,67,.26); --thumb-2:rgba(60,60,67,.42);
    --dur:.22s; --ease:cubic-bezier(.32,.72,0,1);
    --font:-apple-system,BlinkMacSystemFont,system-ui,"PingFang HK","Noto Sans HK",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; overflow-x:clip}
  body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
    padding:22px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));
    gap:clamp(14px,2.4vh,22px)}

  .wrap{flex:1; min-height:0; width:min(760px,100%); margin:0 auto;
    display:flex; flex-direction:column; gap:clamp(14px,2.4vh,22px)}

  /* ---------- 頂欄 ---------- */
  .top{display:flex; align-items:center; gap:14px; flex:none}
  .back{display:grid; place-items:center; width:44px; height:44px; border-radius:50%;
    background:var(--fill); color:var(--ink); text-decoration:none; flex:none;
    transition:background-color var(--dur) var(--ease)}
  .back:hover{background:var(--fill-2)}
  .back:active{transform:scale(.96)}
  .back:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px}
  .back svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round}
  .titles{display:flex; flex-direction:column; min-width:0}
  h1{margin:0; font-size:clamp(24px,3.4vh,30px); font-weight:700; letter-spacing:-.02em; line-height:1.15; text-wrap:balance}
  .sub{margin:2px 0 0; font-size:14px; color:var(--ink-2)}

  .state{margin-left:auto; display:inline-flex; align-items:center; gap:7px; flex:none;
    opacity:0; transition:opacity .18s var(--ease);
    height:32px; padding:0 13px; border-radius:var(--pill); background:var(--fill);
    font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap}
  .state::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--ink-3)}
  .state.on{opacity:1}
  .state.ok{color:var(--green)} .state.ok::before{background:var(--green)}
  .state.busy{color:var(--blue)} .state.busy::before{background:var(--blue); animation:pulse 1s ease-in-out infinite}
  .state.bad{color:var(--red)} .state.bad::before{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:.35} 50%{opacity:1}}

  /* ---------- 品牌卡 ---------- */
  .brand{flex:none; display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;
    background:var(--surface); border-radius:var(--r-lg); padding:12px 14px;
    box-shadow:inset 0 0 0 1px var(--sep)}
  .field span{font-size:13px; color:var(--ink-2)}
  .field input{border:0; outline:0; background:transparent; color:var(--ink);
    font-family:var(--font); font-size:17px; font-weight:600; padding:0; min-width:0}
  .field input::placeholder{color:var(--ink-3); font-weight:400}
  .field:focus-within{box-shadow:inset 0 0 0 2px var(--focus-ring)}
  @media (max-width:520px){ .brand{grid-template-columns:1fr} }

  /* ---------- 編輯卡 ---------- */
  .sheet{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;
    background:var(--surface); border-radius:var(--r-xl);
    box-shadow:inset 0 0 0 1px var(--sep)}
  textarea{flex:1; min-height:0; width:100%; resize:none; border:0; outline:0; background:transparent;
    color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.8;
    margin:0 6px; border-radius:calc(var(--r-xl) - 6px);
    padding:10px clamp(8px,1.4vw,10px) clamp(16px,2.4vh,22px) clamp(18px,2.6vw,22px);
    scrollbar-width:thin; scrollbar-color:var(--thumb) transparent}
  textarea::-webkit-scrollbar{width:11px}
  textarea::-webkit-scrollbar-track{background:transparent}
  textarea::-webkit-scrollbar-thumb{background-color:var(--thumb); border-radius:999px;
    border:3px solid transparent; background-clip:content-box}
  textarea::-webkit-scrollbar-thumb:hover{background-color:var(--thumb-2)}
  textarea::placeholder{color:var(--ink-3)}
  .sheet:focus-within{box-shadow:inset 0 0 0 2px var(--focus-ring)}

  .sheet-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:clamp(14px,2.2vh,18px) clamp(18px,2.6vw,22px) 0}
  .sheet-label{font-size:13px; color:var(--ink-2)}
  .count{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .count:empty{display:none}

  .credit{margin:0; text-align:center; font-size:12px; color:var(--ink-3); flex:none}

  @media (max-width:520px){
    .sub{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
  }

  /* 密碼閘：只係擋誤闖，真正保護在 API（PUT 要 x-edit-key） */
  .gate{position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:22px; background:var(--bg)}
  .gate.on{display:grid}
  .gate-card{width:min(360px,100%); background:var(--surface); border-radius:var(--r-xl);
    box-shadow:inset 0 0 0 1px var(--sep), 0 18px 48px var(--vs-shadow);
    padding:26px 22px 20px; display:flex; flex-direction:column; gap:8px}
  .gate-card h2{margin:0; font-size:22px; letter-spacing:-.01em}
  .gate-card p{margin:0; color:var(--ink-2); font-size:14px}
  .gate-card input{font:inherit; font-size:17px; padding:12px 14px; border-radius:var(--r-md);
    border:0; background:var(--fill); color:var(--ink); margin-top:6px}
  .gate-card input:focus{outline:0; box-shadow:inset 0 0 0 2px var(--focus-ring)}
  .lang-btn{margin-left:auto; align-self:flex-start; min-height:34px; padding:0 12px; border:0;
    border-radius:999px; background:var(--fill); color:var(--ink-2); font:inherit; font-size:12.5px; font-weight:600}
  .lang-btn:active{background:var(--fill-2)}
  .lang-btn:focus-visible{outline:0; box-shadow:0 0 0 3px var(--focus-ring)}
  .gate-alt{margin-top:2px; padding:8px 0; background:none; border:0; font:inherit; font-size:13.5px;
    color:var(--blue); min-height:0}
  .gate-alt:focus-visible{outline:0; box-shadow:0 0 0 3px var(--focus-ring); border-radius:8px}
  .done-lb{font-size:12.5px; color:var(--ink-2); margin-top:10px; display:block}
  .copy-row{display:flex; gap:8px; align-items:center}
  .copy-row input{flex:1; min-width:0; font-size:14px; color:var(--ink-2)}
  .copy-btn{flex:none; height:42px; padding:0 14px; border:0; border-radius:var(--r-md);
    background:var(--fill); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600;
    touch-action:manipulation}
  .copy-btn:active{background:var(--fill-2)}
  .copy-btn:focus-visible{outline:0; box-shadow:0 0 0 3px var(--focus-ring)}
  .copy-btn.ok{color:var(--blue)}
  .gate-go{margin-top:10px; min-height:48px; border:0; border-radius:var(--r-lg);
    background:var(--blue); color:var(--surface); font:inherit; font-size:17px; font-weight:600; cursor:pointer}
  .gate-err{color:var(--red); font-size:14px; min-height:20px; margin-top:2px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="authForm">
    <h2 id="authTitle">登入</h2>
    <p id="authSub">用你嘅帳號，題庫只屬於你，同其他人分開。</p>
    <input id="authUser" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" aria-label="用戶名" placeholder="用戶名">
    <input id="authPass" type="password" autocomplete="current-password" aria-label="密碼" placeholder="密碼">
    <button type="submit" class="gate-go" id="authGo">登入</button>
    <p class="gate-err" id="authErr"></p>
    <button type="button" class="gate-alt" id="authSwap">未有帳號？註冊一個</button>
  </form>
</div>

  <div class="wrap">
  <div class="top">
    <a class="back" href="/" id="backHome" aria-label="返回主持台" title="返回主持台">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>
    </a>
    <div class="titles">
      <h1>設定</h1>
      <button type="button" id="btnLang" class="lang-btn" aria-label="切換語言">EN</button>
      <p class="sub">改完自動儲存</p>
    </div>
    <span class="state" id="state"></span>
  </div>

  <div class="brand">
    <label class="field">
      <span>標題</span>
      <input id="brandTitle" type="text" maxlength="24" placeholder="百獸台"
        autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>副標題</span>
      <input id="brandSub" type="text" maxlength="36" placeholder="派對猜詞主持台"
        autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div class="sheet">
    <div class="sheet-head">
      <span class="sheet-label" id="textLabel">題目</span>
      <span class="count" id="meta">未有題目</span>
    </div>
    <textarea id="text" spellcheck="false" autocomplete="off" autocapitalize="off"
      aria-labelledby="textLabel"
      placeholder="雞蛋仔&#10;菠蘿包&#10;絲襪奶茶"></textarea>
  </div>

  <p class="credit">© 2026 Leung Tung Lam · MIT License</p>
  </div>

<script>
const LANG_KEY = "beasttv.lang";
let LANG = (()=>{ try{ return localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh"; }catch(_){ return "zh"; } })();
const EN = {
  "設定": "Settings",
  "題目": "Questions",
  "品牌": "Brand",
  "已儲存": "Saved",
  "儲存中…": "Saving…",
  "未連接，自動重試中": "Not connected — retrying",
  "儲存失敗，稍後重試": "Save failed — will retry",
  "登入": "Log in",
  "註冊": "Sign up",
  "用戶名": "Username",
  "密碼": "Password",
  "用你嘅帳號，題庫只屬於你，同其他人分開。": "Sign in — your question bank is yours alone.",
  "開一個帳號，即刻有你專屬嘅題庫。": "Create an account and get your own question bank.",
  "未有帳號？註冊一個": "No account? Sign up",
  "已有帳號？返回登入": "Already have an account? Log in",
  "返回主持台": "Back to the console",
  "返回": "Back",
  "兩樣都要填": "Fill in both fields",
  "網絡問題，請再試": "Network problem — try again",
  "失敗，請再試": "Failed — try again",
  "登入已失效，請重新登入": "Session expired — please sign in again",
  "題庫名稱": "Bank name",
  "開庫碼": "Invite code",
  "自訂密碼（至少 4 個字）": "Your password (min 4 chars)",
  "一行一題": "One question per line",
  "題": "questions",
  "未有題目": "No questions yet",
  "設定頁": "Settings",
  "密碼已失效，請重新輸入": "Password expired — enter again"
};
const T = (zh)=> LANG === "en" ? (EN[zh] || zh) : zh;
function translateTree(root){
  if(!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    if(n.parentElement && n.parentElement.closest("textarea,script,style")) continue;
    if(n.__zh === undefined) n.__zh = n.nodeValue;
    const k = n.__zh.trim(); if(!k) continue;
    const en = EN[k];
    n.nodeValue = (LANG === "en" && en) ? n.__zh.replace(k, en) : n.__zh;
  }
  root.querySelectorAll?.("[title],[aria-label],[placeholder]").forEach(el=>{
    for(const a of ["title","aria-label","placeholder"]){
      if(!el.hasAttribute(a)) continue;
      const st = "__zh_" + a;
      if(el[st] === undefined) el[st] = el.getAttribute(a);
      const en = EN[String(el[st]).trim()];
      el.setAttribute(a, (LANG === "en" && en) ? en : el[st]);
    }
  });
}

"use strict";
const $ = s => document.querySelector(s);
let saveTimer = null, lastSaved = "";
const KEYNAME = "editkey";
/* 題庫 slug：/edit?b=<slug>；默認 default */
let BANK = (()=>{
  const m = location.pathname.match(/^\/edit\/b\/([a-z0-9][a-z0-9-]{1,31})\/?$/i);
  const q = new URLSearchParams(location.search).get("b");
  const v = (m ? m[1] : q || "default").toLowerCase();
  return /^[a-z0-9][a-z0-9-]{1,31}$/.test(v) ? v : "default";
})();
const apiUrl = (p)=> p + (p.includes("?") ? "&" : "?") + "b=" + encodeURIComponent(BANK);

const editKey = () => sessionStorage.getItem(KEYNAME) || "";
function syncBack(){
  const bh = document.getElementById("backHome");
  if(bh) bh.setAttribute("href", BANK === "default" ? "/" : "/b/" + encodeURIComponent(BANK));
}
syncBack();

const btnLang = document.getElementById("btnLang");
if(btnLang){
  btnLang.textContent = LANG === "en" ? "中文" : "EN";
  document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant-HK";
  btnLang.addEventListener("click", ()=>{
    LANG = LANG === "en" ? "zh" : "en";
    try{ localStorage.setItem(LANG_KEY, LANG); }catch(_){}
    btnLang.textContent = LANG === "en" ? "中文" : "EN";
    document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant-HK";
    translateTree(document.body);
    paintAuth();
    paintMeta();
  });
  translateTree(document.body);
}
const withKey = (h) => { const o = Object.assign({}, h || {}); const k = editKey(); if(k) o["x-edit-key"] = k;
  const t = TOKEN(); if(t) o["authorization"] = "Bearer " + t; return o; };

/* ---------- 帳號：登入 / 註冊 ---------- */
const TOKEN = ()=> localStorage.getItem("beasttv.token") || "";
let AUTH_MODE = "login";                      // login | signup

function paintAuth(){
  const login = AUTH_MODE === "login";
  $("#authTitle").textContent = T(login ? "登入" : "註冊");
  $("#authSub").textContent = T(login ? "用你嘅帳號，題庫只屬於你，同其他人分開。"
                                       : "開一個帳號，即刻有你專屬嘅題庫。");
  $("#authGo").textContent = T(login ? "登入" : "註冊");
  $("#authSwap").textContent = T(login ? "未有帳號？註冊一個" : "已有帳號？返回登入");
  $("#authPass").setAttribute("autocomplete", login ? "current-password" : "new-password");
  $("#authErr").textContent = "";
}
function showGate(msg){
  $("#gate").classList.add("on");
  $("#authErr").textContent = msg || "";
  setTimeout(()=>$("#authUser").focus(), 60);
}
function hideGate(){ $("#gate").classList.remove("on"); }

$("#authSwap").onclick = ()=>{ AUTH_MODE = AUTH_MODE === "login" ? "signup" : "login"; paintAuth(); };
paintAuth();

$("#authForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const username = $("#authUser").value.trim().toLowerCase();
  const password = $("#authPass").value;
  const err = $("#authErr");
  if(!username || !password){ err.textContent = "兩樣都要填"; return; }
  err.textContent = "";
  $("#authGo").disabled = true;
  try{
    const path = AUTH_MODE === "login" ? "/api/login" : "/api/signup";
    const r = await fetch(path, { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ username, password }) });
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ err.textContent = d.error || "失敗，請再試"; return; }
    localStorage.setItem("beasttv.token", d.token);
    localStorage.removeItem("beasttv.mybank");
    location.href = "/edit";                   // reload：由 /api/me 取自己題庫
  }catch(_){
    err.textContent = "網絡問題，請再試";
  }finally{
    $("#authGo").disabled = false;
  }
});

const sig = () => [$("#text").value, $("#brandTitle").value.trim(), $("#brandSub").value.trim()].join("\u0000");

let stateTimer = null;
function setState(kind, text, autoHide){
  const el = $("#state");
  clearTimeout(stateTimer);
  el.className = "state" + (kind ? " " + kind : "") + (text ? " on" : "");
  el.textContent = text || "";
  if(autoHide) stateTimer = setTimeout(()=>{ el.className = "state"; el.textContent = ""; }, 1400);
  translateTree(document.body);
}
function countLines(t){
  return String(t || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean).length;
}
function paintMeta(){
  const n = countLines($("#text").value);
  $("#meta").textContent = n ? (LANG === "en" ? `${n} questions` : `${n} 題`) : T("未有題目");
}

async function load(){
  setState("busy", "正在載入…");
  try{
    const r = await fetch(apiUrl("/api/text"), { cache: "no-store" });
    if(!r.ok) throw new Error("bad");
    const d = await r.json();
    $("#text").value = d.text || "";
    $("#brandTitle").value = d.title || "";
    $("#brandSub").value = d.subtitle || "";
    lastSaved = sig();
    paintMeta();
    setState("", "");                       // 連上就唔顯示任何狀態
  }catch(e){
    setState("bad", "未連接，自動重試中");
  }
}

async function save(){
  clearTimeout(saveTimer);
  if(sig() === lastSaved){ setState("", ""); return; }   // 改完又改返一樣 → 唔使存，狀態亦要收走
  setState("busy", "儲存中…");
  try{
    const r = await fetch(apiUrl("/api/text"), {
      method: "PUT", headers: withKey({ "Content-Type": "application/json" }),
      body: JSON.stringify({
        text: $("#text").value,
        title: $("#brandTitle").value.trim(),
        subtitle: $("#brandSub").value.trim()
      })
    });
    if(r.status === 401){ localStorage.removeItem("beasttv.token"); showGate("登入已失效，請重新登入"); throw new Error("401"); }
    if(!r.ok) throw new Error("put");
    lastSaved = sig();
    setState("ok", "已儲存", true);          // 顯示 1.4 秒後自動消失
  }catch(e){
    setState("bad", "儲存失敗，稍後重試");
  }
}
function scheduleSave(){
  setState("busy", "儲存中…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
}

$("#text").oninput = () => { paintMeta(); scheduleSave(); };
$("#brandTitle").oninput = scheduleSave;
$("#brandSub").oninput = scheduleSave;
window.addEventListener("beforeunload", e => {
  if(sig() !== lastSaved){ e.preventDefault(); e.returnValue = ""; }
});

/* 斷線自動重試；同時接收其他人的修改（有未儲存內容時不覆蓋） */
async function poll(){
  if(sig() !== lastSaved) return;
  try{
    const r = await fetch(apiUrl("/api/text"), { cache: "no-store" });
    if(!r.ok) throw new Error("bad");
    const d = await r.json();
    if((d.text || "") === $("#text").value && (d.title || "") === $("#brandTitle").value
       && (d.subtitle || "") === $("#brandSub").value){ setState("", ""); return; }
    $("#text").value = d.text || "";
    $("#brandTitle").value = d.title || "";
    $("#brandSub").value = d.subtitle || "";
    lastSaved = sig();
    paintMeta();
    setState("ok", "已更新", true);
  }catch(e){
    setState("bad", "未連接，自動重試中");
  }
}
setInterval(()=>{ if(!document.hidden) poll(); }, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) poll(); });
window.addEventListener("focus", poll);

/* 開頁：有 token 就入自己題庫，冇就顯示登入 */
(async ()=>{
  const tok = TOKEN();
  if(!tok){ showGate(); return; }
  try{
    const r = await fetch("/api/me", { cache:"no-store", headers:{ authorization:"Bearer " + tok } });
    if(!r.ok){ localStorage.removeItem("beasttv.token"); showGate("登入已失效，請重新登入"); return; }
    const d = await r.json();
    if(d.bank && d.bank.slug){ BANK = d.bank.slug; document.title = `設定 · ${d.bank.name || ""}`; }
    hideGate();
    load();
  }catch(_){
    showGate("網絡問題，請再試");
  }
})();
</script>
