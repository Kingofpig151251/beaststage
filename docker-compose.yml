services:
  bigtv:
    build: .
    container_name: bigtv
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 正式用一定要改
      BIGTV_PIN: "2468"
      BIGTV_PORT: "8080"
      BIGTV_DB: "/app/data/bigtv.db"
    volumes:
      - ./data:/app/data
    # 黑群暉等舊 Docker 環境如出事，可加：
    # network_mode: bridge
