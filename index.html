<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大電視">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="大電視破冰主持台：一部機控場，一人背向屏幕猜，全隊描述，主持按對或跳過，題庫同排行榜可以自訂。">
<title>大電視 · 破冰主持台</title>
<style>
  /* Hallmark · redesign: Apple (iPadOS dark) · scope: app · v3.0.0
     critique · host console as a system app: black ground, one blue action, content over chrome
     waive type · SF Pro is not embeddable: system-ui resolves to SF on iPadOS, PingFang carries CJK */

  :root{
    /* ground */
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24);
    --fill-2:rgba(118,118,128,.36);
    /* ink */
    --ink:#FFFFFF; --ink-2:rgba(235,235,245,.60); --ink-3:rgba(235,235,245,.30);
    --sep:rgba(84,84,88,.65);
    /* system colours */
    --blue:#0A84FF; --blue-press:#0A6FDB; --green:#30D158; --red:#FF453A; --amber:#FFD60A;
    --on-accent:#F5F9FF; --focus-ring:rgba(10,132,255,.6);
    --bar-bg:rgba(0,0,0,.72); --flash-ok:rgba(48,209,88,.16); --toast-bg:rgba(44,44,46,.92);
    /* geometry */
    --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:8px; --pill:999px;
    --hair:1px;
    /* motion */
    --dur:.28s; --ease:cubic-bezier(.32,.72,0,1);
    /* legacy aliases（舊規則仍然引用） */
    --paper:var(--bg); --paper-2:var(--surface); --paper-3:var(--surface-2);
    --muted:var(--ink-2); --rule:var(--sep); --accent:var(--blue); --accent-2:var(--green);
    --accent-ink:#FFFFFF; --focus:var(--blue); --bar:1px; --radius:var(--r-lg);
    --shadow:none; --shade:#000;
    --font-display:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Display","PingFang HK","Noto Sans HK",sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","PingFang HK","Noto Sans HK",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%; background:var(--bg); overflow-x:clip}
  body{color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}

  /* ---------- layout ---------- */
  .wrap{max-width:1024px; margin:0 auto;
    padding:22px max(20px,env(safe-area-inset-right)) 28px max(20px,env(safe-area-inset-left))}

  .view{display:none}
  .view.active{display:block}

  h1{margin:0; font-family:var(--font-display); font-weight:700; font-size:34px;
    letter-spacing:-.02em; line-height:1.12; text-wrap:balance}
  h2{margin:0; font-size:22px; font-weight:600; color:var(--ink); letter-spacing:-.01em}
  .sub{margin:8px 0 0; font-size:15px; color:var(--ink-2); max-width:60ch}
  .kv{font-size:15px; color:var(--ink-2)}
  .kbd{font-family:var(--font-mono); font-size:12px; padding:2px 7px; border-radius:6px;
    background:var(--fill); color:var(--ink-2)}

  /* ---------- home ---------- */
  #v-home .top{display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px; flex-wrap:wrap; margin-bottom:24px}
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:stretch}
  @media (min-width:900px){ .setup{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .stack{display:flex; flex-direction:column; gap:20px}
  .stack > .well{flex:1}

  .well{background:var(--surface); border-radius:var(--r-xl); padding:24px}
  .well h2{margin-bottom:16px}
  .well.teams{display:flex; flex-direction:column}

  .row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:48px}
  .row > label{font-size:15px; color:var(--ink-2)}

  /* stepper：capsule */
  .stepper{display:flex; align-items:center; background:var(--fill); border-radius:var(--pill);
    padding:2px; gap:2px}
  .step-btn{width:40px; height:40px; padding:0; display:grid; place-items:center;
    border:0; border-radius:50%; background:transparent; color:var(--ink)}
  .step-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round}
  .step-btn:active{background:var(--fill-2)}
  .step-btn:disabled{opacity:.3; background:transparent; color:var(--ink-3); cursor:not-allowed}
  #teamInput{width:52px; min-height:40px; padding:0; text-align:center; border:0; background:transparent;
    color:var(--ink); font-family:var(--font-display); font-size:20px; font-weight:600;
    -moz-appearance:textfield}
  #teamInput::-webkit-outer-spin-button,#teamInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

  .names{display:flex; flex-direction:column; gap:12px; margin-top:20px; max-height:46vh; overflow-y:auto}
  .name-row{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; align-items:center}
  .name-row span{display:flex; align-items:center; justify-content:center; width:26px; height:26px;
    font-size:13px; font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums}

  /* inputs */
  input,textarea,select{font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--fill); border:0; border-radius:var(--r-md); padding:11px 14px; min-height:44px; width:100%}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
    outline:3px solid var(--focus-ring); outline-offset:2px}

  #secInput{width:88px; min-height:48px; text-align:center; font-family:var(--font-display);
    font-size:20px; font-weight:600; background:var(--fill); -moz-appearance:textfield}
  #secInput::-webkit-outer-spin-button,#secInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

  .qhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:20px}
  .qhead h2{margin:0}
  .qcount{display:inline-flex; align-items:baseline; gap:6px; font-family:var(--font-display);
    font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--ink)}
  .qcount .unit{font-size:15px; font-weight:500; color:var(--ink-2); letter-spacing:0}
  .qedit{display:flex; align-items:center; justify-content:center; margin-top:auto; min-height:46px;
    border-radius:var(--r-md); background:var(--fill); color:var(--ink); text-decoration:none;
    font-size:17px; font-weight:500}
  .qedit:active{background:var(--fill-2)}

  /* ---------- buttons ---------- */
  button{font-family:inherit; font-size:17px; font-weight:500; color:var(--ink); background:transparent;
    border:0; border-radius:var(--r-md); padding:12px 18px; min-height:44px; cursor:pointer;
    transition:background-color var(--dur) var(--ease), transform var(--dur) var(--ease), opacity var(--dur)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.35; cursor:not-allowed; transform:none}
  .btn-primary{background:var(--blue); color:var(--on-accent); font-weight:600}
  .btn-primary:active{background:var(--blue-press)}
  .btn-quiet{background:var(--fill); color:var(--ink)}
  .btn-quiet:active{background:var(--fill-2)}
  .btn-big{width:100%; padding:17px 18px; font-size:19px; font-weight:600}

  .startbar{display:none; position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--bar-bg); -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px); border-top:var(--hair) solid var(--sep)}
  body[data-view="home"] .startbar{display:block}
  .startbar > div{max-width:1024px; margin:0 auto; display:flex; align-items:center; gap:10px;
    padding:12px max(20px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  .startbar #btnStart{flex:1; min-height:52px; font-size:19px; border-radius:var(--r-lg)}
  .startbar .rail{display:flex; gap:8px; margin-left:auto}

  /* ---------- play ---------- */
  body[data-view="play"]{background:var(--bg)}
  #v-play{position:relative; height:100dvh; overflow:hidden; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 0 0}
  body[data-view="play"]{overflow:hidden}
  body[data-view="play"] .wrap{padding:0; max-width:none}
  #v-play.active{display:flex}
  body[data-view="play"] .startbar{display:none}

  .flash-top{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left))}
  .icon-btn{width:44px; height:44px; padding:0; display:grid; place-items:center; border-radius:50%;
    background:var(--fill); color:var(--ink)}
  .icon-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .icon-btn:active{background:var(--fill-2)}

  .ring{position:relative; width:64px; height:64px; padding:0; display:grid; place-items:center;
    border:0; border-radius:50%; background:transparent; color:var(--ink)}
  .ring svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
  .ring-track{fill:none; stroke:var(--fill-2); stroke-width:3}
  .ring-prog{fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:100.5; stroke-dashoffset:0; transition:stroke-dashoffset .25s linear}
  .ring.warn .ring-prog{stroke:var(--amber)}
  .ring.dead .ring-prog{stroke:var(--red)}
  .ring.paused .ring-prog{stroke:var(--ink-3)}
  .clock{font-family:var(--font-display); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;
    letter-spacing:-.01em}
  .clock.warn{color:var(--amber)}
  .clock.dead{color:var(--red)}

  #stage{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;
    padding:0 max(40px,env(safe-area-inset-right)) 0 max(40px,env(safe-area-inset-left))}
  .card-word{font-family:var(--font-display); font-weight:700; letter-spacing:-.03em; line-height:1.02;
    text-align:center; text-wrap:balance; word-break:break-word; max-width:100%;
    font-size:clamp(64px,21vh,200px); animation:wordIn var(--dur) var(--ease)}
  @keyframes wordIn{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}
  .question.fx-ok{animation:fxOk .32s var(--ease)}
  .question.fx-skip{animation:fxSkip .28s var(--ease)}
  @keyframes fxOk{0%{background:transparent} 40%{background:var(--flash-ok)} 100%{background:transparent}}
  @keyframes fxSkip{0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
  .fx-plus{position:absolute; left:50%; top:38%; transform:translateX(-50%);
    font-family:var(--font-display); font-size:34px; font-weight:700; color:var(--green);
    pointer-events:none; animation:fxPlus .8s var(--ease) forwards}
  @keyframes fxPlus{from{opacity:1; translate:0 0} to{opacity:0; translate:0 -60px}}

  .flash-hud{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:center;
    padding:12px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  .flash-hud .j-skip{justify-self:start; min-height:64px; width:clamp(140px,20vw,220px);
    background:var(--fill); color:var(--ink); font-size:19px; border-radius:var(--r-lg);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px)}
  .flash-hud .j-ok{justify-self:end; min-height:64px; width:clamp(160px,24vw,260px);
    background:var(--blue); color:var(--on-accent); font-size:22px; font-weight:600; border-radius:var(--r-lg)}
  .flash-hud .j-ok:active{background:var(--blue-press)}

  .sidenum{display:none}

  /* ---------- ready ---------- */
  .ready{position:fixed; inset:0; z-index:60; display:none; background:var(--bg)}
  .ready[style*="flex"]{display:flex}
  .readyCard{width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:clamp(24px,6vh,56px) clamp(20px,4vw,48px); gap:6px}
  .readyRound{font-size:15px; color:var(--ink-2); letter-spacing:.02em}
  .readyTeam{font-family:var(--font-display); font-weight:700; font-size:clamp(52px,13vh,140px);
    letter-spacing:-.03em; line-height:1.02; margin:10px 0 16px}
  .readyHint{font-size:17px; color:var(--ink-2); line-height:1.6; max-width:34ch; text-wrap:balance}
  .readyHint span{display:block}
  .readyScores{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:clamp(20px,3.4vh,32px)}
  .readyScores span{display:inline-flex; align-items:baseline; gap:8px; padding:9px 16px;
    border-radius:var(--pill); background:var(--fill); font-size:15px; color:var(--ink-2)}
  .readyScores b{font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums}
  .readyScores .cur{background:var(--blue); color:var(--on-accent)}
  .readyScores .cur b{color:var(--on-accent)}
  .readyCard button{margin-top:clamp(24px,4vh,36px); min-height:56px; padding:0 40px;
    background:var(--blue); color:var(--on-accent); font-size:19px; font-weight:600; border-radius:var(--r-lg)}
  .readyKbd{margin-top:14px; font-size:13px; color:var(--ink-3)}
  .readyCount{display:none; font-family:var(--font-display); font-size:clamp(72px,15vw,132px);
    font-weight:700; color:var(--ink)}
  .readyCount.on{display:block; margin-top:16px}
  .readyCount.pop{animation:fxPop .5s var(--ease)}
  @keyframes fxPop{0%{transform:scale(.8); opacity:0} 60%{transform:scale(1.06); opacity:1} 100%{transform:scale(1)}}

  /* ---------- result ---------- */
  #v-result h1{margin-bottom:4px}
  #rSub{margin:0 0 20px}
  .champ{background:var(--surface); border-radius:var(--r-xl); padding:24px 24px 22px;
    display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:4px 16px}
  .champ.tied{background:var(--surface-2)}
  .champ-label{grid-column:1; font-size:15px; font-weight:600; color:var(--blue); letter-spacing:.01em}
  .champ-name{grid-column:1; font-family:var(--font-display); font-size:clamp(30px,5vh,46px);
    font-weight:700; letter-spacing:-.02em; line-height:1.05}
  .champ-meta{grid-column:1; font-size:15px; color:var(--ink-2); margin-top:4px}
  .champ-score{grid-column:2; grid-row:1 / span 3; align-self:center; font-family:var(--font-display);
    font-size:clamp(40px,7vh,64px); font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .champ-score em{display:block; font-size:13px; font-style:normal; font-weight:500; color:var(--ink-2);
    letter-spacing:0; text-align:right; margin-bottom:4px}
  .champ-score span{font-size:20px; font-weight:600; color:var(--ink-2); margin-left:4px}

  .rank{margin-top:24px; padding:0 24px}
  .rank-h{font-size:15px; font-weight:600; color:var(--ink-2); margin:0 0 4px}
  .rk{position:relative; display:grid; grid-template-columns:34px minmax(0,1fr) auto; align-items:center;
    gap:12px; padding:14px 0}
  .rk::after{content:""; position:absolute; left:46px; right:0; bottom:0; height:var(--hair);
    background:var(--sep)}
  .rk:last-child::after{display:none}
  .rk .no{font-size:15px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .rk .nm{font-size:17px; font-weight:500}
  .rk .st{font-size:15px; color:var(--ink-2); margin-top:4px}
  .rk .pt{font-family:var(--font-display); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
  .rk.first .pt{color:var(--blue)}

  .result-actions{display:flex; gap:12px; margin-top:32px; flex-wrap:wrap}
  .result-actions .btn-big{flex:2 1 240px; max-width:none; min-height:52px; padding:0 22px; font-size:17px}
  .result-actions .btn-quiet{flex:1 1 120px; min-height:52px; padding:0 22px}

  /* ---------- toast ---------- */
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:90;
    transform:translate(-50%,10px); opacity:0; pointer-events:none;
    background:var(--toast-bg); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    color:var(--ink); font-size:15px; padding:12px 18px; border-radius:var(--pill);
    transition:opacity var(--dur), transform var(--dur)}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  /* ---------- iPad / 分段 ---------- */
  @media (max-height:900px){
    #v-home .top{margin-bottom:16px}
    h1{font-size:30px}
    .well{padding:16px}
  }
  @media (max-width:700px){
    .setup{gap:12px}
    .result-actions .btn-big{flex:1 1 100%}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 主頁 ========== -->
  <section class="view active" id="v-home">
    <header class="top">
      <div>
        <h1>大電視</h1>
        <p class="sub">一人背向屏幕猜詞，全隊負責描述。主持人按「對」或「跳過」判定結果。</p>
      </div>
    </header>

    <div class="setup">
      <section class="well teams">
        <h2>隊伍名單</h2>
        <div class="row" style="margin-bottom:10px">
          <span class="kv">隊伍數量</span>
          <div class="stepper">
            <button class="step-btn" id="teamMinus" aria-label="減少一隊">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
            </button>
            <input id="teamInput" type="number" inputmode="numeric" min="2" max="8" step="1" value="2" aria-label="隊伍數量">
            <button class="step-btn" id="teamPlus" aria-label="增加一隊">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/><path d="M12 6v12"/></svg>
            </button>
          </div>
          <span class="kv">隊</span>
        </div>
        <div class="names" id="nameList"></div>
      </section>

      <div class="stack">
      <section class="well">
        <h2>計時</h2>
        <div class="row" style="margin-bottom:12px">
          <label>每回合時間</label>
          <input id="secInput" type="number" min="5" max="600" step="5" style="width:88px">
          <span class="kv">秒</span>
        </div>
      </section>

      <section class="well">
        <div class="qhead">
          <h2>題目</h2>
          <b class="qcount" id="qCount">正在載入…</b>
        </div>
        <a class="btn-quiet qedit" href="/edit">編輯題目</a>
      </div>
    </div>
  </section>

  <!-- ========== 遊戲 ========== -->
  <section class="view" id="v-play">
    <div class="sidenum" id="sideNum" aria-hidden="true">01</div>
    <div class="flash-top">
      <button class="icon-btn stroke" id="btnExit" aria-label="退出遊戲" title="退出遊戲">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3.2A1.8 1.8 0 0 1 20 5.8v12.4A1.8 1.8 0 0 1 18.2 20H15"/><path d="M10.5 8.2 6.7 12l3.8 3.8"/><path d="M6.9 12h8.3"/></svg>
      </button>
      <button class="ring" id="btnPause" aria-label="暫停" title="暫停（Esc）">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-track" cx="22" cy="22" r="16"/>
          <circle class="ring-prog" id="ringProg" cx="22" cy="22" r="16"/>
        </svg>
        <b class="clock" id="pClock">60</b>
      </button>
    </div>

    <main class="card question" id="stage">
      <div class="card-word" id="pText"></div>
    </main>

    <div class="flash-hud">
      <button class="j-skip" data-judge="skip">跳過</button>
      <button class="j-ok" data-judge="ok">對</button>
    </div>

    <div class="ready" id="readyOverlay" style="display:none">
      <div class="readyCard">
        <div class="readyRound" id="rdRound"></div>
        <div class="readyTeam" id="rdTeam"></div>
        <div class="readyHint" id="rdHint"><span>請派一名隊員背向屏幕，</span><span>其餘隊友準備完成後即可開始</span></div>
        <div class="readyScores" id="rdScores"></div>
        <button id="btnReady">開始</button>
        <div class="readyKbd">或按 <span class="kbd">空白鍵</span></div>
        <div class="readyCount" id="rdCount"></div>
      </div>
    </div>
  </section>

  

  <!-- ========== 結果 ========== -->
  <section class="view" id="v-result">
    <h1>結果</h1>
    <p class="kv" id="rSub" style="margin:6px 0 0"></p>
    <div id="champBox"></div>
    <div class="rank" id="rankList"></div>
    <div class="result-actions">
      <button class="btn-primary btn-big" id="btnAgain">再玩一次</button>
      <button class="btn-quiet" id="btnBackHome">返回主頁</button>
    </div>
  </section>

  <!-- ========== 題庫（雲端共用） ========== -->
  

  










</div>

<div class="startbar">
  <div>
    <button class="btn-primary" id="btnStart">開始遊戲</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";


/* ================= 狀態 ================= */
const K_CFG="bigtv.cfg.v3";   // 題目不存本機，只存雲端
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let lines = [];                                  // 題目：一行一題
let cfg  = Object.assign({
  teams:2, names:["A 隊","B 隊","C 隊","D 隊","E 隊","F 隊","G 隊","H 隊"],
  sec:60
}, store.get(K_CFG, {}));

cfg.teams = Math.max(2, Math.min(8, Math.round(+cfg.teams || 2)));

let G = null;
let REMOTE = { ok:false };

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 題目一律以 {t:"..."} 存；舊格式（字串 / {t,ban}）都食得住 */
function parseText(raw){
  const seen = new Set();
  return String(raw || "").split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"))
    .filter(l => {
      const k = l.replace(/\s+/g,"").toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    })
    .map(l => l.slice(0,60));
}
function saveCfg(){ store.set(K_CFG, cfg); }

function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("active", v.id===id));
  document.body.dataset.view = id.replace(/^v-/, "");
  window.scrollTo(0,0);
}
let toastT=null;
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"), 1800);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= 後端 ================= */
async function pullText(){
  try{
    const r = await fetch("/api/text", {cache:"no-store"});
    if(!r.ok) throw new Error("bad status");
    const d = await r.json();
    lines = parseText(d.text);
    REMOTE.ok = true;
    renderHome();
  }catch(e){ REMOTE.ok = false; renderHome(); }
}

/* ================= VFX ================= */
function fxOk(){
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-ok");
  const plus = document.createElement("span");
  plus.className = "fx-plus"; plus.textContent = "+1";
  q.appendChild(plus);
  setTimeout(()=>plus.remove(), 900);
}
function fxSkip(){
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-skip");
}
function fxPop(el){
  if(!el) return;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}

/* ================= 主頁 ================= */
function renderHome(){
  $("#nameList").innerHTML = Array.from({length:cfg.teams},(_,i)=>`
    <label class="name-row"><span>${i+1}</span>
      <input data-name="${i}" value="${esc(cfg.names[i]||("隊 "+(i+1)))}" maxlength="12"></label>`).join("");
  $("#teamInput").value = cfg.teams;
  $("#teamMinus").disabled = cfg.teams <= 2;
  $("#teamPlus").disabled  = cfg.teams >= 8;
  $$("#nameList input").forEach(inp=>inp.onchange=()=>{
    cfg.names[+inp.dataset.name] = inp.value.trim() || ("隊 "+(+inp.dataset.name+1));
    inp.value = cfg.names[+inp.dataset.name]; saveCfg();
  });

  $("#secInput").value = cfg.sec;

  $("#qCount").innerHTML = lines.length
    ? `${lines.length}<span class="unit">題</span>`
    : `<span class="unit">未連接：無法讀取題目</span>`;
  $("#btnStart").disabled = !lines.length;
  $("#btnStart").textContent = lines.length ? "開始遊戲" : "題目未連線";
}

/* ================= 題庫管理（離線用） ================= */
/* ================= 遊戲流程 ================= */
function startGame(){
  if(G){ clearInterval(G.timerId); G.timerToken++; }   // 清除上一局殘留的計時器
  const names = Array.from({length:cfg.teams},(_,i)=> cfg.names[i] || ("隊 "+(i+1)));
  const pool = lines.map(t=>({ t }));
  if(!pool.length){ toast("題目尚未載入"); return; }

  G = {
    sec: Math.max(5, Number(cfg.sec)||60),
    teams: names.map(n=>({name:n, score:0, ok:0, skip:0})),
    turn:0,
    pool: shuffle(pool.slice()), used: [], cur:null,
    log: [], paused:false, remaining:0, timerId:null, timerToken:0,
    phase:"ready"
  };
  showView("v-play");
  enterReady();
}

/* 每隊出場前先停頓：不計時、不出題，待隊伍準備完成 */
function enterReady(){
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "ready";
  G.cur = null;
  G.remaining = G.sec;
  G.paused = false;
  setPauseIcon(false);
  $("#rdRound").textContent = `第 ${G.turn+1} 隊，共 ${G.teams.length} 隊`;
  const sn = $("#sideNum"); if(sn) sn.textContent = String(G.turn+1).padStart(2,"0");
  $("#rdTeam").textContent = G.teams[G.turn].name;
  $("#rdScores").innerHTML = G.teams.map((t,i)=>
    `<span class="${i===G.turn?"cur":""}">${esc(t.name)}<b>${t.score}</b></span>`).join("");
  $("#rdCount").textContent = "";
  $("#rdCount").classList.remove("on");
  $("#btnReady").style.display = "";
  $("#readyOverlay").style.display = "flex";
  document.body.classList.add("is-ready");
  renderPlay();
}

function hideReady(){
  $("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
}

/* 按「開始」→ 3、2、1 → 正式出題並開始計時 */
function startRound(){
  if(!G || G.phase !== "ready") return;
  G.phase = "countdown";
  $("#btnReady").style.display = "none";
  const el = $("#rdCount");
  el.classList.add("on");
  const BEAT = 1150;                 // 每個數字停 1.15 秒，畀人有時間準備
  let n = 3;
  el.textContent = n; fxPop(el);
  const tick = setInterval(()=>{
    n--;
    if(n > 0){ el.textContent = n; fxPop(el); }
    else if(n === 0){ el.textContent = "開始"; fxPop(el); }
    else {
      clearInterval(tick);
      el.classList.remove("on");
      hideReady();
      beginRunning();
    }
  }, BEAT);
}

function beginRunning(){
  G.phase = "running";
  G.cur = drawItem();
  G.remaining = G.sec;
  startTimer();
  renderPlay();
}

function drawItem(){
  if(!G.pool.length){ G.pool = shuffle(G.used.slice()); G.used = []; toast("題目已用完，正在重新洗牌"); }
  const it = G.pool.pop();
  G.used.push(it);
  return it;
}

function startTimer(){
  clearInterval(G.timerId);
  if(!G.sec){ renderTimer(); return; }
  const token = ++G.timerToken;
  const id = setInterval(()=>{
    if(token !== G.timerToken){ clearInterval(id); return; }   // 舊局的計時器不得影響新局
    if(G.paused) return;
    G.remaining = Math.max(0, G.remaining - 0.1);
    renderTimer();
    const sec = Math.ceil(G.remaining);
    if(G.remaining<=0){ clearInterval(id); endTurn(); }
  },100);
  G.timerId = id;
}

const RING_LEN = 2 * Math.PI * 16;   // r=16（與邊框之間留出空隙）
function renderTimer(){
  const el=$("#pClock"), ring=$("#btnPause"), prog=$("#ringProg");
  if(!ring) return;
  el.textContent = G.paused ? "▶" : Math.ceil(G.remaining);
  const pct = Math.max(0, Math.min(1, G.remaining / G.sec));
  prog.style.strokeDashoffset = (RING_LEN * (1 - pct)).toFixed(1);
  ring.classList.toggle("warn", G.remaining <= 10 && G.remaining > 3);
  ring.classList.toggle("dead", G.remaining <= 3);
  ring.classList.toggle("paused", !!G.paused);
}

// 題目字自動撐滿字卡：優先單行（避免詞語被切開），字體過小時才容許斷行
function fitWord(text){
  const el=$("#pText"), card=el.parentElement;
  const boxW=card.clientWidth-36, boxH=card.clientHeight-72;
  if(boxW<=40 || boxH<=40) return;
  const fit = (oneLine)=>{
    el.style.whiteSpace = oneLine ? "nowrap" : "normal";
    el.style.wordBreak  = oneLine ? "keep-all" : "break-word";
    let lo=24, hi=Math.min(360, boxH);
    for(let i=0;i<9;i++){
      const mid=(lo+hi)/2;
      el.style.fontSize=mid+"px";
      const okW = oneLine ? el.scrollWidth<=boxW+1 : el.scrollWidth<=boxW+1;
      if(okW && el.scrollHeight<=boxH+1) lo=mid; else hi=mid;
    }
    el.style.fontSize=Math.floor(lo)+"px";
    return lo;
  };
  const one = fit(true);
  if(one < 64) fit(false);          // 一行太細 → 寧願斷行做大
}
addEventListener("resize", ()=>{ if(G && G.phase==="running") fitWord($("#pText").textContent); });

function renderPlay(){
  const it = G.cur || {t:"", deck:""};   // ready 階段未有題目
  $("#pText").textContent = it.t;
  fitWord(it.t);

  renderTimer();
}

function judge(kind){
  if(!G || G.phase !== "running" || !G.cur) return;
  const t = G.teams[G.turn];
  const delta = kind==="ok" ? 1 : 0;
  G.log.push({item:G.cur, kind, team:G.turn, delta});
  t.score += delta;
  if(kind==="ok"){ t.ok++; fxOk(); }
  else { t.skip++; fxSkip(); }
  G.cur = drawItem();
  renderPlay();
}

function undo(){
  if(!G || !G.log.length) return;
  const last = G.log.pop();
  const t = G.teams[last.team];
  t.score -= last.delta;
  if(last.kind==="ok") t.ok--; else t.skip--;
  G.cur = last.item;
  renderPlay();
  toast("已撤銷");
}

function endTurn(){
  if(!G) return;
  if(G.phase === "ready"){ enterReady(); return; }   // 尚未開始即按下，視為重新整理
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "ready";
  G.turn++;
  if(G.turn >= G.teams.length){
    endGame(); return;
  }
  enterReady();
}

function endGame(){
  if(!G) return;
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "done";
  hideReady();
  const sorted = G.teams.map((t,i)=>({...t,i})).sort((a,b)=> b.score-a.score || b.ok-a.ok);
  const total = G.teams.reduce((s,t)=>s+t.score,0);
  const okTotal = G.teams.reduce((s,t)=>s+t.ok,0);
  $("#rSub").textContent = `全場答對 ${okTotal} 題 · 總分 ${total}`;

  const top = sorted[0];
  const winners = sorted.filter(t=>t.score === top.score);
  const tied = winners.length > 1;
  $("#champBox").innerHTML = `
    <div class="champ ${tied ? "tied" : ""}">
      <div class="champ-label">${tied ? "並列第一" : "冠軍"}</div>
      <div class="champ-name">${winners.map(t=>esc(t.name)).join(" · ")}</div>
      <div class="champ-score"><em>總分</em>${top.score}<span>分</span></div>
      <div class="champ-meta">對 ${top.ok} · 跳 ${top.skip}</div>
    </div>`;

  const rest = sorted.slice(winners.length);
  $("#rankList").innerHTML = rest.length ? `
    <div class="rank-h">其餘名次</div>` + rest.map((t,idx)=>`
    <div class="rk">
      <div class="no">${idx+winners.length+1}</div>
      <div class="nm">${esc(t.name)}
        <div class="st">對 ${t.ok} · 跳 ${t.skip}</div>
      </div>
      <div class="pt">${t.score}</div>
    </div>`).join("") : "";
  showView("v-result");
}

/* ================= 事件 ================= */
function setTeams(n){
  cfg.teams = Math.max(2, Math.min(8, Math.round(+n || 2)));
  saveCfg(); renderHome();
}
$("#teamInput").onchange = e=> setTeams(e.target.value);
$("#teamMinus").onclick = ()=> setTeams(cfg.teams - 1);
$("#teamPlus").onclick  = ()=> setTeams(cfg.teams + 1);
$("#secInput").onchange  = e=>{ cfg.sec=Math.max(5,Math.min(600,+e.target.value||60)); saveCfg(); };
$("#btnStart").onclick = startGame;

$$("[data-judge]").forEach(b=>b.onclick=()=>judge(b.dataset.judge));
$("#btnReady").onclick = startRound;
$("#btnExit").onclick = ()=>{
  if(!G) { showView("v-home"); renderHome(); return; }
  if(!confirm("確定退出遊戲？本局成績將不會記錄。")) return;
  clearInterval(G.timerId);
  G.timerToken++;
  G = null;
  document.querySelector("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
  showView("v-home");
  renderHome();
};

function setPauseIcon(p){
  const b = $("#btnPause"); if(!b) return;
  b.setAttribute("aria-label", p ? "繼續" : "暫停");
  b.setAttribute("title", p ? "繼續（Esc）" : "暫停（Esc）");
  b.classList.toggle("paused", !!p);
  const el = $("#pClock");
  if(p){ el.textContent = "▶"; }
  else if(G) renderTimer();
}
$("#btnPause").onclick = ()=>{
  if(!G || G.phase!=="running") return;
  G.paused = !G.paused;
  setPauseIcon(G.paused);
  renderTimer();
};

$("#btnAgain").onclick = startGame;
$("#btnBackHome").onclick = ()=>{ showView("v-home"); renderHome(); };

/* 鍵盤控場 */
document.addEventListener("keydown", e=>{
  if(!$("#v-play").classList.contains("active")) return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if(e.code==="Space" || k==="enter"){
    e.preventDefault();
    if(!G) return;
    if(G.phase === "ready") startRound();
    else if(G.phase === "running") judge("ok");
    return;
  }
  else if(k==="s" || k==="arrowdown"){ e.preventDefault(); judge("skip"); }
  else if(k==="z"){ /* 撤銷已移除 */ }
  else if(k==="escape" || k==="p"){ e.preventDefault(); $("#btnPause").click(); }
});


document.addEventListener("visibilitychange", ()=>{

});

/* ================= 啟動 ================= */
/* 無法連接時每 15 秒自動重試，無需手動操作 */
setInterval(()=>{ if(!REMOTE.ok && !G) pullText(); }, 15000);

/* 返回 App 或切換回前景時自動重新載入題目，無需重新開啟 */
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && !G && document.body.dataset.view === "home") pullText();
});
window.addEventListener("focus", ()=>{
  if(!G && document.body.dataset.view === "home") pullText();
});

document.body.dataset.view = "home";
renderHome();
pullText();
window.__bigtv = { get G(){return G}, get lines(){return lines}, get cfg(){return cfg},
  startGame, startRound, enterReady, judge, undo, endTurn, endGame, renderHome, renderPlay, showView };
</script>
</body>
</html>
