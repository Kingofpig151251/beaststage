<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大電視">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="大電視破冰主持台：一部機控場，一人背向屏幕猜，全隊描述，主持按對或跳過，題庫同排行榜可以自訂。">
<title>大電視 · 破冰主持台</title>
<style>
  /* Hallmark · redesign: app screen · genre: playful · theme: Arcade (ember / grille) · scope: app · v2.0.0
     critique · it is a host console hammered in a dark room: ember carries the live action, acid answers it, press physics on the one control the host hits
     waive type · Bungee / Chivo / Silkscreen are not loaded: the tool has to run offline from one file, so system faces carry the weights and mono carries figures */
  :root{
    /* ground */
    --paper:oklch(14% 0.04 312); --paper-2:oklch(18.5% 0.042 312); --paper-3:oklch(23% 0.045 312);
    /* ink */
    --ink:oklch(95% 0.014 315); --ink-2:oklch(87% 0.018 315); --muted:oklch(71% 0.024 315);
    --rule:oklch(34% 0.05 312); --shade:oklch(8% 0.02 315);
    /* the two players */
    --accent:oklch(66% 0.215 40); --accent-2:oklch(88% 0.195 115); --accent-ink:oklch(14% 0.04 312);
    --focus:oklch(88% 0.195 115);
    /* type */
    --font-display:ui-sans-serif,system-ui,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
    --font-body:ui-sans-serif,system-ui,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    /* geometry */
    --radius:0; --hair:1px; --bar:2px;
    --shadow:4px 4px 0 var(--accent-2);
    --scrim:rgba(0,0,0,.62);
  --scanline:rgba(0,0,0,.22);
    --dur:90ms; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%; overflow-x:clip}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0}
  h1{font-family:var(--font-display); font-weight:900; letter-spacing:-.02em; line-height:1.05; font-size:28px; text-wrap:balance}
  h2{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:10px}
  p{margin:0}
  .wrap{max-width:1080px; margin:0 auto;
    padding:18px max(16px, env(safe-area-inset-left)) 28px max(16px, env(safe-area-inset-right))}
  .view{display:none}
  .view.active{display:block}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px}

  /* ---- surfaces ---- */
  .well{background:var(--paper-2); border:var(--bar) solid var(--rule); border-radius:var(--radius); padding:16px}
  .rule{height:var(--bar); background:var(--rule); border:0; margin:16px 0}

  /* ---- controls: the press surface ---- */
  button{touch-action:manipulation; font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); background:transparent;
    border:var(--bar) solid var(--ink); border-radius:var(--radius); padding:10px 16px; cursor:pointer;
    transition:translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) steps(1)}
  button:active{translate:3px 3px; box-shadow:2px 2px 0 var(--accent-2)}
  button:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
  button:disabled:active{translate:0}
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow)}
  .btn-quiet{border-color:var(--rule); color:var(--ink-2)}
  .btn-big{display:block; width:100%; max-width:420px; margin:0 auto; padding:18px; font-size:15px; letter-spacing:.01em}

  input,textarea{touch-action:manipulation; font-family:inherit; font-size:15px; color:var(--ink); background:var(--paper);
    border:var(--bar) solid var(--rule); border-radius:var(--radius); padding:10px 12px; width:100%; min-height:44px}
  input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-color:var(--ink)}
  input[type="checkbox"]{width:22px; height:22px; min-height:0; accent-color:var(--accent); cursor:pointer}

  /* ---- home ---- */
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .top .sub{color:var(--muted); font-size:12px; margin-top:6px}
  .pill::before{content:""; width:7px; height:7px; background:var(--muted); border-radius:var(--radius)}
  .pill.on{color:var(--accent-2)}
  .pill.on::before{background:var(--accent-2)}
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:stretch}
  .setup .span2{grid-column:1 / -1}
  @media (min-width:1024px){ .setup{grid-template-columns:repeat(2,minmax(0,1fr))} }



  /* ---- home ---- */
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .top .sub{color:var(--muted); font-size:12px; margin-top:6px}
  .pill{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; display:inline-flex; align-items:center; gap:7px}
  .pill::before{content:""; width:7px; height:7px; background:var(--muted); border-radius:var(--radius)}
  .pill.on{color:var(--accent-2)}
  .pill.on::before{background:var(--accent-2)}
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:stretch}
  .setup .span2{grid-column:1 / -1}
  @media (min-width:1024px){ .setup{grid-template-columns:repeat(2,minmax(0,1fr))} }

  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .row > label{font-size:12px; color:var(--muted); min-width:64px}
  .stepper{display:flex; align-items:center}
  .step-btn{width:44px; height:44px; padding:0; display:grid; place-items:center;
    background:transparent; border:var(--bar) solid var(--rule); border-radius:var(--radius); color:var(--ink)}
  .step-btn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round}
  .step-btn:hover{border-color:var(--ink-2); color:var(--ink)}
  .step-btn:active{transform:translateY(1px)}
  .step-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .step-btn:disabled{opacity:.3; cursor:not-allowed; transform:none}
  #teamInput{width:64px; height:44px; font-family:var(--font-mono); font-size:15px; text-align:center;
    border-left-width:0; border-right-width:0}
  .kv{font-size:12px; color:var(--muted)}
  .names{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-top:12px}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:transparent; border:var(--bar) solid var(--rule); border-radius:var(--radius);
    color:var(--muted); padding:8px 12px; font-size:12px; font-weight:700; display:flex; gap:8px; align-items:center}
  .chip i{font-family:var(--font-mono); font-style:normal; font-size:12px; opacity:.7}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .chip.on::before{content:"✓"; font-size:11px; line-height:1}
  .chip.on i{opacity:.85}

  .startbar{display:none; position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-top:var(--bar) solid var(--rule); z-index:20}
  body[data-view="home"] .startbar{display:block}
  body[data-view="home"] .wrap{padding-bottom:132px}
  .startbar > div{max-width:1080px; margin:0 auto;
    padding:12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .startbar button{height:48px; display:inline-flex; align-items:center; justify-content:center}
  .startbar .rail{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
  #btnStart{flex:1 1 240px; max-width:420px}
  @media (max-width:640px){ .startbar .rail{width:100%; margin-left:0} .startbar .rail button{flex:1} #btnStart{max-width:none} }

  /* ---- play ---- */
  .play-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .tag{font-size:12px; font-weight:700; color:var(--muted); border:var(--bar) solid var(--rule);
    border-radius:var(--radius); padding:5px 10px}
  .tag.turn{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .clock{font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:28px; line-height:1; color:var(--accent-2)}
  .clock.warn{color:var(--accent)}
  .clock.dead{color:var(--accent); animation:fxPulse 1s ease-in-out infinite}

  .stage{position:relative; isolation:isolate; background:var(--paper-2); border:var(--bar) solid var(--rule);
    border-radius:var(--radius); padding:clamp(24px,6vw,56px) 20px; min-height:32vh; min-height:32dvh; display:flex;
    flex-direction:column; justify-content:center; align-items:center; gap:14px; text-align:center; overflow:hidden}
  .stage::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:-1;
    background-image:repeating-linear-gradient(to bottom, transparent 0 2px, color-mix(in oklab, var(--shade) 22%, transparent) 2px 3px)}
  @supports not (background: color-mix(in oklab, white 50%, black)){
    .stage::after{background-image:repeating-linear-gradient(to bottom, transparent 0 2px, var(--scanline) 2px 3px)}
  }
  .stage-deck{font-size:12px; font-weight:700; color:var(--muted)}
  .stage-q{font-family:var(--font-display); font-weight:900; font-size:clamp(40px,9vw,92px); line-height:1.08;
    letter-spacing:.01em; word-break:break-word; text-wrap:balance; min-height:1.1em}
  .stage.fx-ok{animation:fxOk .5s var(--ease)}
  .stage.fx-skip{animation:fxShake .34s ease-in-out}
  @keyframes fxOk{0%{box-shadow:inset 0 0 0 3px var(--accent-2)} 100%{box-shadow:inset 0 0 0 3px transparent}}
  @keyframes fxShake{0%,100%{translate:0} 25%{translate:-8px} 70%{translate:8px}}
  @keyframes fxPulse{0%,100%{opacity:1} 50%{opacity:.4}}
  .fx-plus{position:absolute; top:16%; right:12%; font-family:var(--font-mono); font-weight:700;
    font-size:28px; color:var(--accent-2); pointer-events:none; animation:fxPlus .8s var(--ease) forwards}
  @keyframes fxPlus{0%{opacity:0; translate:0 10px} 25%{opacity:1; translate:0 0} 100%{opacity:0; translate:0 -44px}}

  .bar{height:6px; background:var(--paper-3); border-radius:0; overflow:hidden; margin:14px 0}
  .bar > i{display:block; height:100%; width:100%; transform-origin:left center; background:var(--accent-2);
    transition:transform .1s linear}
  .bar.warn > i{background:var(--accent)}
  .bar.dead > i{background:var(--accent); animation:fxPulse 1s ease-in-out infinite}


  .judge{display:grid; grid-template-columns:1.6fr 1fr; gap:12px; margin:14px 0 8px}
  .judge button{font-family:var(--font-display); font-size:clamp(20px,2.6vw,26px); font-weight:900;
    padding:20px 12px; border-radius:var(--radius); border:var(--bar) solid var(--ink); letter-spacing:.02em}
  .judge .j-ok{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow)}
  .judge .j-skip{background:transparent; color:var(--ink-2); border-color:var(--rule)}

  .util{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
  .util button{flex:1; min-width:96px; padding:11px; font-size:12px; border-color:var(--rule); color:var(--ink-2)}
  .kbd{font-family:var(--font-mono); font-size:12px; border:var(--bar) solid var(--rule); border-radius:var(--radius); padding:1px 6px; color:var(--muted)}



  /* ===== 主頁：左名單 / 右設定 ===== */
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:start}
  @media (min-width:1000px){
    .setup{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .setup .teams{position:sticky; top:16px}
  }
  .stack{display:grid; gap:12px; align-content:start}

  /* 名單：一行一隊，號碼 + 名 */
  .names{display:flex; flex-direction:column; gap:6px; margin-top:12px; max-height:48vh; overflow-y:auto}
  .name-row{display:grid; grid-template-columns:24px minmax(0,1fr); gap:8px; align-items:center}
  .name-row span{font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:right}
  .name-row input{padding:10px 12px}

  /* ===== 結果：冠軍台 + 總成績表 ===== */
  .champ{background:var(--accent); color:var(--accent-ink); border:var(--bar) solid var(--accent-ink);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin:16px 0 8px;
    display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:0 16px}
  .champ-label{grid-column:1 / -1}
  .champ-name{grid-column:1}
  .champ-score{grid-column:2; text-align:right}
  .champ-meta{grid-column:1 / -1}
  .champ-label{font-family:var(--font-mono); font-size:12px; opacity:.75}
  .champ-name{font-weight:900; font-size:28px; line-height:1.04; margin:2px 0 0}
  .champ-score{font-family:var(--font-mono); font-size:clamp(32px,5.2vw,50px); line-height:1; font-variant-numeric:tabular-nums}
  .champ-score em{display:block; font-style:normal; font-size:12px; line-height:1.6; opacity:.75; margin-bottom:2px}
  .champ-score span{font-size:.34em; margin-left:6px; opacity:.75}
  .champ-meta{font-size:12px; opacity:.8; margin-top:8px}
  .champ.tied{background:var(--paper-3); color:var(--ink); border-color:var(--rule); box-shadow:none}

  .rank{margin-top:8px}
  #v-result.active{display:flex; flex-direction:column; height:calc(100dvh - 44px); min-height:0}
  #v-result .rank{flex:1 1 auto; min-height:0; overflow-y:auto}
  #v-result .result-actions{flex:0 0 auto}
  .rank-h{font-family:var(--font-mono); font-size:12px; color:var(--muted); padding:10px 4px 6px}
  .rk .pt{color:var(--ink)}
  .rk.first .pt{color:var(--accent)}
  .result-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:12px}
  .result-actions .btn-big{margin:0; flex:1 1 260px; max-width:420px;
    background:transparent; color:var(--accent); border:2px solid var(--accent); box-shadow:none}
  .result-actions .btn-big:hover{background:color-mix(in oklab, var(--accent) 12%, transparent)}
  .result-actions .btn-quiet{flex:0 0 auto; padding:18px 24px}

  /* ===== 主持台：全屏字卡 ===== */
  body[data-view="play"] .wrap{max-width:none; margin:0; padding:0; height:100dvh; overflow:hidden}
  body[data-view="play"] .startbar{display:none}
  .view.active#v-play{display:flex; flex-direction:column; height:100%}
  #v-play{position:relative}

  .flash-top{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 14px; border-bottom:var(--bar) solid var(--rule); flex:0 0 auto}
  .flash-tools{display:flex; gap:6px; align-items:center}
  .tool-sep{width:1px; height:20px; background:var(--rule); margin:0 4px}
  .flash-tools button{padding:8px 12px; font-size:12px}
  .flash-tools .quit{border-style:dashed}
  .icon-btn{width:44px; height:44px; padding:0; display:grid; place-items:center; flex:0 0 auto;
    border:var(--bar) solid var(--rule); border-radius:50%; background:transparent; color:var(--ink-2)}
  .icon-btn svg{width:17px; height:17px; fill:currentColor}
  .icon-btn.stroke svg{fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-2)}
  /* 同退出掣同一家族：42px 空心圓 + 1px 邊；可撳感嚟自 hover / press / focus */
  .ring{position:relative; width:44px; height:44px; display:grid; place-items:center; flex:0 0 auto;
    padding:0; color:inherit; cursor:pointer; border-radius:50%;
    background:transparent; border:var(--bar) solid var(--rule);
    transition:border-color .12s, color .12s, transform .06s}
  .ring:hover{border-color:var(--ink-2); color:var(--ink)}
  .ring:active{transform:translateY(1px)}
  .ring:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .ring.paused{border-color:var(--ink-2); color:var(--ink)}
  .ring svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
  .ring-track{fill:none; stroke:color-mix(in oklab, var(--rule) 55%, transparent); stroke-width:2.4}
  .ring-prog{fill:none; stroke:var(--accent-2); stroke-width:2.4; stroke-linecap:round;
    stroke-dasharray:100.5; stroke-dashoffset:0; transition:stroke-dashoffset .25s linear, stroke .3s}
  .ring b{font-family:var(--font-mono); font-size:14.5px; line-height:1; font-variant-numeric:tabular-nums}
  .ring.warn .ring-prog{stroke:var(--accent)}
  .ring.dead .ring-prog{stroke:var(--accent); animation:none}
  .ring.paused .ring-prog{stroke:var(--muted)}

  .card{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; background:none; border:0; position:relative;
    padding:10px calc(20px + env(safe-area-inset-left)) 10px calc(20px + env(safe-area-inset-right))}
  .card-deck{font-size:12px; letter-spacing:0;
    color:var(--ink-2); border:var(--bar) solid var(--rule); border-radius:var(--radius); padding:3px 10px; flex:0 0 auto}
  .card-word{font-family:var(--font-display); font-weight:900; line-height:1.02; letter-spacing:-.02em;
    text-align:center; text-wrap:balance; word-break:break-word; max-width:100%;
    font-size:clamp(48px,22vh,240px); flex:0 1 auto}

  .flash-hud{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:12px;
    align-items:center; border-top:var(--bar) solid var(--rule);
    padding:12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .flash-hud .undo{justify-self:center; padding:12px 18px; font-size:12px}
  .flash-hud .j-skip{justify-self:start}
  .flash-hud .j-ok{justify-self:end}
  .flash-hud .j-ok{min-height:88px; width:clamp(150px,22vw,240px); padding:0; font-size:28px}
  .flash-hud .j-skip{min-height:76px; width:clamp(112px,16vw,176px); padding:0; font-size:clamp(17px,2.4vh,22px);
    color:var(--ink-2)}
  .flash-hud .j-ok{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); border-color:var(--accent)}
  .flash-hud .j-skip{background:var(--paper-2); color:var(--ink); border-color:var(--rule)}
  .flash-hud{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:12px;
    align-items:center; border-top:var(--bar) solid var(--rule);
    padding:12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .flash-hud .undo{justify-self:center; padding:12px 18px; font-size:12px}
  .flash-hud .j-skip{justify-self:start}
  .flash-hud .j-ok{justify-self:end}
  .flash-hud .j-ok{min-height:88px; width:clamp(150px,22vw,240px); padding:0; font-size:28px}
  .flash-hud .j-skip{min-height:76px; width:clamp(112px,16vw,176px); padding:0; font-size:clamp(17px,2.4vh,22px);
    color:var(--ink-2)}
  .flash-hud .j-ok{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); border-color:var(--accent)}
  .flash-hud .j-skip{background:var(--paper-2); color:var(--ink); border-color:var(--rule)}

  @media (max-width:700px){
    .flash-top{padding:6px 10px}
    .flash-tools button{padding:6px 8px; font-size:12px}
    .flash-hud{grid-template-columns:1fr 1fr; gap:8px}
    .flash-hud .j-ok,.flash-hud .j-skip{min-height:72px; padding:0}
  }

  /* ---- ready ---- */
  body.is-ready{overflow:hidden}
  .ready{position:fixed; inset:0; background:var(--paper); display:flex; align-items:stretch; justify-content:center;
    padding:0; z-index:60}
  .readyCard{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; background:var(--accent); color:var(--accent-ink);
    border:0; border-radius:0; box-shadow:none;
    padding:clamp(24px,6vh,56px) clamp(20px,4vw,48px)}
  .readyRound{font-family:var(--font-mono); font-size:clamp(12px,1.6vh,15px); opacity:.8; letter-spacing:.06em}
  .readyTeam{font-family:var(--font-display); font-weight:900; font-size:clamp(56px,15vh,168px); line-height:1; margin:10px 0 14px}
  .readyHint{font-size:clamp(15px,2.2vh,20px); line-height:1.6; opacity:.88; max-width:34ch}
  .readyCard button{margin-top:clamp(24px,5vh,56px); background:var(--accent-ink); color:var(--accent);
    border-color:var(--accent-ink); font-family:var(--font-display); font-weight:900;
    font-size:clamp(20px,3vh,28px); padding:clamp(16px,2.4vh,24px) clamp(56px,9vw,110px);
    box-shadow:var(--shadow)}
  .readyKbd{margin-top:clamp(12px,2vh,18px); font-size:clamp(12px,1.7vh,15px); opacity:.8}
  .readyScores{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin-top:clamp(16px,3vh,30px)}
  .readyScores span{display:inline-flex; align-items:baseline; gap:9px; padding:8px 15px;
    border:2px solid currentColor; border-radius:var(--radius); opacity:.7;
    font-size:clamp(14px,2vh,18px)}
  .readyScores b{font-family:var(--font-mono); font-size:clamp(17px,2.5vh,23px);
    font-variant-numeric:tabular-nums; line-height:1}
  .readyScores .cur{opacity:1; background:var(--accent-ink); color:var(--accent); border-color:var(--accent-ink)}
  .readyCount{display:none; font-family:var(--font-mono); font-weight:700; font-size:clamp(72px,16vw,132px); line-height:1}
  .readyCount.on{display:block; margin-top:14px}
  .readyCount.pop{animation:fxPop .5s var(--ease)}
  @keyframes fxPop{0%{scale:.55; opacity:0} 45%{scale:1.08; opacity:1} 100%{scale:1}}

  /* ---- result ---- */
  .rank{display:flex; flex-direction:column; gap:0; margin:18px 0; border-top:var(--bar) solid var(--rule)}
  .rk{display:flex; align-items:center; gap:14px; padding:16px 4px; border-bottom:var(--bar) solid var(--rule)}
  .rk .no{font-family:var(--font-mono); font-size:15px; color:var(--muted); width:26px}
  .rk .nm{flex:1; font-size:19px; font-weight:900}
  .rk .st{font-size:12px; color:var(--muted); font-weight:400; margin-top:3px}
  .rk .pt{font-family:var(--font-mono); font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
  .rk.first .no{background:var(--accent); color:var(--accent-ink); text-align:center; border-radius:var(--radius)}
  .rk.first .pt{color:var(--accent)}

  /* ---- leaderboard ---- */

  .toast{position:fixed; right:16px; bottom:16px; background:var(--paper-3); color:var(--ink);
    font-weight:600; font-size:12px; padding:8px 14px; border:var(--bar) solid var(--rule);
    border-radius:var(--radius); opacity:0; pointer-events:none; transition:opacity .2s; z-index:99}
  .toast.on{opacity:1}

  /* 觸控裝置（iPad 直度同橫度都算）：加大觸控目標 */
  @media (min-width:700px){
    .judge button{padding:26px 12px}
    .chip{min-height:46px; padding:11px 14px}
    .decklist button{min-height:42px; padding:10px 12px}
    .it button{min-height:42px}
    .util button{padding:14px 12px}
    input,textarea{font-size:15px}          /* iOS 焦點時唔會自動放大 */
  }
  /* 橫度或矮屏：收緊垂直節奏，確保唔使捲 */
  @media (max-height:900px){
    .stage{min-height:26vh; min-height:26dvh}
    .judge button{padding:18px 12px}
    .judge{margin:12px 0 8px}
    h1{font-size:24px}
    .wrap{padding-top:14px}
  }
  @media (hover:hover) and (pointer:fine){
    .btn-primary:hover{background:color-mix(in oklab, var(--accent) 88%, white)}
    .btn-quiet:hover{border-color:var(--ink); color:var(--ink)}
    .chip:hover{border-color:var(--ink-2); color:var(--ink)}
    .judge .j-skip:hover{color:var(--accent-2); border-color:var(--accent-2)}
    .util button:hover{border-color:var(--ink); color:var(--ink)}
    .it button:hover{color:var(--accent); border-color:var(--rule)}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
    .bar > i{transition:none}
  }
</style>

<body>
<div class="wrap">

  <!-- ========== 主頁 ========== -->
  <section class="view active" id="v-home">
    <header class="top">
      <div>
        <h1>大電視</h1>
        <p class="sub">一人背向屏幕猜，全隊描述。主持按對或跳過，對錯由人拍板。</p>
      </div>
    </header>

    <div class="setup">
      <section class="well teams">
        <h2>隊伍名單</h2>

          <span class="kv">隊伍數</span>
          <div class="stepper">
            <button class="step-btn" id="teamMinus" aria-label="減少一隊">

            </button>
            <input id="teamInput" type="number" inputmode="numeric" min="2" max="8" step="1" value="2" aria-label="隊伍數">
            <button class="step-btn" id="teamPlus" aria-label="增加一隊">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/><path d="M12 6v12"/></svg>

      <div class="stack">

      <section class="well">

  <section class="view" id="v-play">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3.2A1.8 1.8 0 0 1 20 5.8v12.4A1.8 1.8 0 0 1 18.2 20H15"/><path d="M10.5 8.2 6.7 12l3.8 3.8"/><path d="M6.9 12h8.3"/></svg>
      </button>
      <button class="ring" id="btnPause" aria-label="暫停" title="暫停（Esc）">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-track" cx="22" cy="22" r="16"/>
          <circle class="ring-prog" id="ringProg" cx="22" cy="22" r="16"/>

    <main class="card question" id="stage">

    <div class="flash-hud">

    <div class="ready" id="readyOverlay" style="display:none">
      <div class="readyCard">
        <div class="readyRound" id="rdRound"></div>
        <div class="readyTeam" id="rdTeam"></div>
        <div class="readyHint" id="rdHint">派一個人背向屏幕，隊友準備好就撳開始</div>
        <div class="readyScores" id="rdScores"></div>
        <button id="btnReady">開始</button>
        <div class="readyKbd">或者撳 <span class="kbd">Space</span></div>
        <div class="readyCount" id="rdCount"></div>

  <!-- ========== 結果 ========== -->

    <h1>結果</h1>
    <p class="kv" id="rSub" style="margin:6px 0 0"></p>
    <div id="champBox"></div>
    <div class="rank" id="rankList"></div>
    <div class="result-actions">
      <button class="btn-primary btn-big" id="btnAgain">再玩一次</button>
      <button class="btn-quiet" id="btnBackHome">返主頁</button>
    </div>

  <!-- ========== 題庫（雲端共用） ========== -->
  

  










</div>

<div class="startbar">
  <div>
    <button class="btn-primary" id="btnStart">開始遊戲</button>
    <div class="rail">
      <button class="btn-quiet" id="btnBankHome">題庫</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";

const HINT = "由 {who} 派一個人背向屏幕。隊友描述或做動作，唔准講出題目上面任何一隻字。";

/* ================= 狀態 ================= */
const K_CFG="bigtv.cfg.v3";   // 題庫唔再存本機，只存雲端
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let lines = [];                                  // 題目：一行一題
let cfg  = Object.assign({
  teams:2, names:["A 隊","B 隊","C 隊","D 隊","E 隊","F 隊","G 隊","H 隊"],
  sec:60
}, store.get(K_CFG, {}));

cfg.teams = Math.max(2, Math.min(8, Math.round(+cfg.teams || 2)));

let G = null;
let REMOTE = { ok:false };

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 題目一律以 {t:"..."} 存；舊格式（字串 / {t,ban}）都食得住 */
function parseText(raw){
  const seen = new Set();
  return String(raw || "").split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"))
    .filter(l => {
      const k = l.replace(/\s+/g,"").toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    })
    .map(l => l.slice(0,60));
}
function saveCfg(){ store.set(K_CFG, cfg); }

function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("active", v.id===id));
  document.body.dataset.view = id.replace(/^v-/, "");
  window.scrollTo(0,0);
}
let toastT=null;
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"), 1800);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= 後端（有就用，冇就本機） ================= */
async function pullText(){
  try{
    const r = await fetch("/api/text", {cache:"no-store"});
    if(!r.ok) throw new Error("bad status");
    const d = await r.json();
    lines = parseText(d.text);
    REMOTE.ok = true;
    renderHome();
  }catch(e){ REMOTE.ok = false; renderHome(); }
}

/* ================= VFX ================= */
function fxOk(){
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-ok");
  const plus = document.createElement("span");
  plus.className = "fx-plus"; plus.textContent = "+1";
  q.appendChild(plus);
  setTimeout(()=>plus.remove(), 900);
}
function fxSkip(){
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-skip");
}
function fxPop(el){
  if(!el) return;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}

/* ================= 主頁 ================= */
function renderHome(){
  $("#nameList").innerHTML = Array.from({length:cfg.teams},(_,i)=>`
    <label class="name-row"><span>${i+1}</span>
      <input data-name="${i}" value="${esc(cfg.names[i]||("隊 "+(i+1)))}" maxlength="12"></label>`).join("");
  $("#teamInput").value = cfg.teams;
  $("#teamMinus").disabled = cfg.teams <= 2;
  $("#teamPlus").disabled  = cfg.teams >= 8;
  $$("#nameList input").forEach(inp=>inp.onchange=()=>{
    cfg.names[+inp.dataset.name] = inp.value.trim() || ("隊 "+(+inp.dataset.name+1));
    inp.value = cfg.names[+inp.dataset.name]; saveCfg();
  });

  $("#secInput").value = cfg.sec;

  $("#qCount").textContent = lines.length ? `${lines.length} 題` : "未連線：題目讀唔到";
  $("#btnStart").disabled = !lines.length;
  $("#btnStart").textContent = lines.length ? "開始遊戲" : "題目未連線";
}

/* ================= 題庫管理（離線用） ================= */
/* ================= 遊戲流程 ================= */
function startGame(){
  if(G){ clearInterval(G.timerId); G.timerToken++; }   // 清走上一局殘留嘅倒數
  const names = Array.from({length:cfg.teams},(_,i)=> cfg.names[i] || ("隊 "+(i+1)));
  const pool = lines.map(t=>({ t }));
  if(!pool.length){ toast("題目未載入"); return; }

  G = {
    sec: Math.max(5, Number(cfg.sec)||60),
    teams: names.map(n=>({name:n, score:0, ok:0, skip:0})),
    turn:0,
    pool: shuffle(pool.slice()), used: [], cur:null,
    log: [], paused:false, remaining:0, timerId:null, timerToken:0,
    phase:"ready"
  };
  showView("v-play");
  enterReady();
}

/* 每隊出場前停一停：唔計時、唔出題，等佢哋準備 */
function enterReady(){
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "ready";
  G.cur = null;
  G.remaining = G.sec;
  G.paused = false;
  setPauseIcon(false);
  $("#rdRound").textContent = `第 ${G.turn+1} / ${G.teams.length} 隊`;
  $("#rdTeam").textContent = G.teams[G.turn].name;
  $("#rdScores").innerHTML = G.teams.map((t,i)=>
    `<span class="${i===G.turn?"cur":""}">${esc(t.name)}<b>${t.score}</b></span>`).join("");
  $("#rdCount").textContent = "";
  $("#rdCount").classList.remove("on");
  $("#btnReady").style.display = "";
  $("#readyOverlay").style.display = "flex";
  document.body.classList.add("is-ready");
  renderPlay();
}

function hideReady(){
  $("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
}

/* 撳「開始」→ 3、2、1 → 真正出題計時 */
function startRound(){
  if(!G || G.phase !== "ready") return;
  G.phase = "countdown";
  $("#btnReady").style.display = "none";
  const el = $("#rdCount");
  el.classList.add("on");
  const BEAT = 1150;                 // 每個數字停 1.15 秒，畀人有時間準備
  let n = 3;
  el.textContent = n; fxPop(el);
  const tick = setInterval(()=>{
    n--;
    if(n > 0){ el.textContent = n; fxPop(el); }
    else if(n === 0){ el.textContent = "開始"; fxPop(el); }
    else {
      clearInterval(tick);
      el.classList.remove("on");
      hideReady();
      beginRunning();
    }
  }, BEAT);
}

function beginRunning(){
  G.phase = "running";
  G.cur = drawItem();
  G.remaining = G.sec;
  startTimer();
  renderPlay();
}

function drawItem(){
  if(!G.pool.length){ G.pool = shuffle(G.used.slice()); G.used = []; toast("題目用晒，重新洗牌"); }
  const it = G.pool.pop();
  G.used.push(it);
  return it;
}

function startTimer(){
  clearInterval(G.timerId);
  if(!G.sec){ renderTimer(); return; }
  const token = ++G.timerToken;
  const id = setInterval(()=>{
    if(token !== G.timerToken){ clearInterval(id); return; }   // 舊局嘅表，唔准再影響新局
    if(G.paused) return;
    G.remaining = Math.max(0, G.remaining - 0.1);
    renderTimer();
    const sec = Math.ceil(G.remaining);
    if(G.remaining<=0){ clearInterval(id); endTurn(); }
  },100);
  G.timerId = id;
}

const RING_LEN = 2 * Math.PI * 16;   // r=16（留返邊同弧之間嘅空隙）
function renderTimer(){
  const el=$("#pClock"), ring=$("#btnPause"), prog=$("#ringProg");
  if(!ring) return;
  el.textContent = G.paused ? "▶" : Math.ceil(G.remaining);
  const pct = Math.max(0, Math.min(1, G.remaining / G.sec));
  prog.style.strokeDashoffset = (RING_LEN * (1 - pct)).toFixed(1);
  ring.classList.toggle("warn", G.remaining <= 10 && G.remaining > 3);
  ring.classList.toggle("dead", G.remaining <= 3);
  ring.classList.toggle("paused", !!G.paused);
}

// 題目字自動撐滿字卡：優先一行（唔好把「演唱會」劈開），字太細才容許斷行
function fitWord(text){
  const el=$("#pText"), card=el.parentElement;
  const boxW=card.clientWidth-36, boxH=card.clientHeight-72;
  if(boxW<=40 || boxH<=40) return;
  const fit = (oneLine)=>{
    el.style.whiteSpace = oneLine ? "nowrap" : "normal";
    el.style.wordBreak  = oneLine ? "keep-all" : "break-word";
    let lo=24, hi=Math.min(360, boxH);
    for(let i=0;i<9;i++){
      const mid=(lo+hi)/2;
      el.style.fontSize=mid+"px";
      const okW = oneLine ? el.scrollWidth<=boxW+1 : el.scrollWidth<=boxW+1;
      if(okW && el.scrollHeight<=boxH+1) lo=mid; else hi=mid;
    }
    el.style.fontSize=Math.floor(lo)+"px";
    return lo;
  };
  const one = fit(true);
  if(one < 64) fit(false);          // 一行太細 → 寧願斷行做大
}
addEventListener("resize", ()=>{ if(G && G.phase==="running") fitWord($("#pText").textContent); });

function renderPlay(){
  const it = G.cur || {t:"", deck:""};   // ready 階段未有題目
  $("#pText").textContent = it.t;
  fitWord(it.t);

  renderTimer();
}

function judge(kind){
  if(!G || G.phase !== "running" || !G.cur) return;
  const t = G.teams[G.turn];
  const delta = kind==="ok" ? 1 : 0;
  G.log.push({item:G.cur, kind, team:G.turn, delta});
  t.score += delta;
  if(kind==="ok"){ t.ok++; fxOk(); }
  else { t.skip++; fxSkip(); }
  G.cur = drawItem();
  renderPlay();
}

function undo(){
  if(!G || !G.log.length) return;
  const last = G.log.pop();
  const t = G.teams[last.team];
  t.score -= last.delta;
  if(last.kind==="ok") t.ok--; else t.skip--;
  G.cur = last.item;
  renderPlay();
  toast("已撤銷");
}

function endTurn(){
  if(!G) return;
  if(G.phase === "ready"){ enterReady(); return; }   // 未開始就撳，當重整
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "ready";
  G.turn++;
  if(G.turn >= G.teams.length){
    endGame(); return;
  }
  enterReady();
}

function endGame(){
  if(!G) return;
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "done";
  hideReady();
  const sorted = G.teams.map((t,i)=>({...t,i})).sort((a,b)=> b.score-a.score || b.ok-a.ok);
  const total = G.teams.reduce((s,t)=>s+t.score,0);
  const okTotal = G.teams.reduce((s,t)=>s+t.ok,0);
  $("#rSub").textContent = `全場答對 ${okTotal} 題 · 總分 ${total}`;

  const top = sorted[0];
  const winners = sorted.filter(t=>t.score === top.score);
  const tied = winners.length > 1;
  $("#champBox").innerHTML = `
    <div class="champ ${tied ? "tied" : ""}">
      <div class="champ-label">${tied ? "並列第一" : "冠軍"}</div>
      <div class="champ-name">${winners.map(t=>esc(t.name)).join(" · ")}</div>
      <div class="champ-score"><em>總分</em>${top.score}<span>分</span></div>
      <div class="champ-meta">對 ${top.ok} · 跳 ${top.skip}</div>
    </div>`;

  const rest = sorted.slice(winners.length);
  $("#rankList").innerHTML = rest.length ? `
    <div class="rank-h">其餘名次</div>` + rest.map((t,idx)=>`
    <div class="rk">
      <div class="no">${idx+winners.length+1}</div>
      <div class="nm">${esc(t.name)}
        <div class="st">對 ${t.ok} · 跳 ${t.skip}</div>
      </div>
      <div class="pt">${t.score}</div>
    </div>`).join("") : "";
  showView("v-result");
}

/* ================= 事件 ================= */
function setTeams(n){
  cfg.teams = Math.max(2, Math.min(8, Math.round(+n || 2)));
  saveCfg(); renderHome();
}
$("#teamInput").onchange = e=> setTeams(e.target.value);
$("#teamMinus").onclick = ()=> setTeams(cfg.teams - 1);
$("#teamPlus").onclick  = ()=> setTeams(cfg.teams + 1);
$("#secInput").onchange  = e=>{ cfg.sec=Math.max(5,Math.min(600,+e.target.value||60)); saveCfg(); };
$("#btnStart").onclick = startGame;

$$("[data-judge]").forEach(b=>b.onclick=()=>judge(b.dataset.judge));
$("#btnReady").onclick = startRound;
$("#btnExit").onclick = ()=>{
  if(!G) { showView("v-home"); renderHome(); return; }
  if(!confirm("退出遊戲？今場唔會計成績。")) return;
  clearInterval(G.timerId);
  G.timerToken++;
  G = null;
  document.querySelector("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
  showView("v-home");
  renderHome();
};

function setPauseIcon(p){
  const b = $("#btnPause"); if(!b) return;
  b.setAttribute("aria-label", p ? "繼續" : "暫停");
  b.setAttribute("title", p ? "繼續（Esc）" : "暫停（Esc）");
  b.classList.toggle("paused", !!p);
  const el = $("#pClock");
  if(p){ el.textContent = "▶"; }
  else if(G) renderTimer();
}
$("#btnPause").onclick = ()=>{
  if(!G || G.phase!=="running") return;
  G.paused = !G.paused;
  setPauseIcon(G.paused);
  renderTimer();
};

$("#btnAgain").onclick = startGame;
$("#btnBackHome").onclick = ()=>{ showView("v-home"); renderHome(); };

$("#btnBankHome").onclick = ()=>{ window.location.href = "/edit"; };
/* 鍵盤控場 */
document.addEventListener("keydown", e=>{
  if(!$("#v-play").classList.contains("active")) return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if(e.code==="Space" || k==="enter"){
    e.preventDefault();
    if(!G) return;
    if(G.phase === "ready") startRound();
    else if(G.phase === "running") judge("ok");
    return;
  }
  else if(k==="s" || k==="arrowdown"){ e.preventDefault(); judge("skip"); }
  else if(k==="z"){ /* 撤銷已移除 */ }
  else if(k==="escape" || k==="p"){ e.preventDefault(); $("#btnPause").click(); }
});


document.addEventListener("visibilitychange", ()=>{

});

/* ================= 啟動 ================= */
/* 連唔到就自己重試（每 15 秒），唔使撳掣 */
setInterval(()=>{ if(!REMOTE.ok && !G) pullText(); }, 15000);

/* 回到 App（或者切返嚟）就靜靜拉一次題庫，唔使重開 */
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && !G && document.body.dataset.view === "home") pullText();
});
window.addEventListener("focus", ()=>{
  if(!G && document.body.dataset.view === "home") pullText();
});

document.body.dataset.view = "home";
renderHome();
pullText();
window.__bigtv = { get G(){return G}, get lines(){return lines}, get cfg(){return cfg},
  startGame, startRound, enterReady, judge, undo, endTurn, endGame, renderHome, renderPlay, showView };
