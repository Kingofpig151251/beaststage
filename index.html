<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大電視">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="大電視破冰主持台：一部機控場，一人背向屏幕猜，全隊描述，主持按對或跳過，題庫同排行榜可以自訂。">
<title>大電視 · 破冰主持台</title>
<style>
  /* Hallmark · redesign: app screen · genre: playful · theme: Arcade (ember / grille) · scope: app · v2.0.0
     critique · it is a host console hammered in a dark room: ember carries the live action, acid answers it, press physics on the one control the host hits
     waive type · Bungee / Chivo / Silkscreen are not loaded: the tool has to run offline from one file, so system faces carry the weights and mono carries figures */
  :root{
    /* ground */
    --paper:oklch(14% 0.04 312); --paper-2:oklch(18.5% 0.042 312); --paper-3:oklch(23% 0.045 312);
    /* ink */
    --ink:oklch(95% 0.014 315); --ink-2:oklch(87% 0.018 315); --muted:oklch(71% 0.024 315);
    --rule:oklch(34% 0.05 312); --shade:oklch(8% 0.02 315);
    /* the two players */
    --accent:oklch(66% 0.215 40); --accent-2:oklch(88% 0.195 115); --accent-ink:oklch(14% 0.04 312);
    --focus:oklch(88% 0.195 115);
    /* type */
    --font-display:ui-sans-serif,system-ui,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
    --font-body:ui-sans-serif,system-ui,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    /* geometry */
    --radius:4px; --hair:1px; --bar:2px;
    --shadow:6px 6px 0 var(--accent-2);
    --scanline:rgba(0,0,0,.22);
    --dur:90ms; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%; overflow-x:clip}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0}
  h1{font-family:var(--font-display); font-weight:900; letter-spacing:-.02em; line-height:1.05; font-size:clamp(22px,2.6vw,30px); text-wrap:balance}
  h2{font-size:13px; font-weight:700; color:var(--muted); margin-bottom:10px}
  p{margin:0}
  .wrap{max-width:1080px; margin:0 auto;
    padding:18px max(16px, env(safe-area-inset-left)) 28px max(16px, env(safe-area-inset-right))}
  .view{display:none}
  .view.active{display:block}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px}

  /* ---- surfaces ---- */
  .well{background:var(--paper-2); border:var(--bar) solid var(--rule); border-radius:var(--radius); padding:16px}
  .rule{height:var(--bar); background:var(--rule); border:0; margin:16px 0}

  /* ---- controls: the press surface ---- */
  button{touch-action:manipulation; font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); background:transparent;
    border:var(--bar) solid var(--ink); border-radius:var(--radius); padding:10px 16px; cursor:pointer;
    transition:translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) steps(1)}
  button:active{translate:3px 3px; box-shadow:2px 2px 0 var(--accent-2)}
  button:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
  button:disabled:active{translate:0}
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow)}
  .btn-quiet{border-color:var(--rule); color:var(--ink-2)}
  .btn-big{display:block; width:100%; max-width:420px; margin:0 auto; padding:18px; font-size:18px; letter-spacing:.01em}

  input,textarea{touch-action:manipulation; font-family:inherit; font-size:15px; color:var(--ink); background:var(--paper);
    border:var(--bar) solid var(--muted); border-radius:var(--radius); padding:9px 12px; width:100%}
  input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  input[type="checkbox"]{width:auto; accent-color:var(--accent)}

  /* ---- home ---- */
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .top .sub{color:var(--muted); font-size:13.5px; margin-top:6px}
  .pill{font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap; display:inline-flex; align-items:center; gap:7px}
  .pill::before{content:""; width:7px; height:7px; background:var(--muted); border-radius:1px}
  .pill.on{color:var(--accent-2)}
  .pill.on::before{background:var(--accent-2)}
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:stretch}
  .setup .span2{grid-column:1 / -1}
  @media (min-width:1024px){ .setup{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* ---- surfaces ---- */
  .well{background:var(--paper-2); border:var(--bar) solid var(--rule); border-radius:var(--radius); padding:16px}
  .rule{height:var(--bar); background:var(--rule); border:0; margin:16px 0}

  /* ---- controls: the press surface ---- */
  button{touch-action:manipulation; font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); background:transparent;
    border:var(--bar) solid var(--ink); border-radius:var(--radius); padding:10px 16px; cursor:pointer;
    transition:translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) steps(1)}
  button:active{translate:3px 3px; box-shadow:2px 2px 0 var(--accent-2)}
  button:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
  button:disabled:active{translate:0}
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow)}
  .btn-quiet{border-color:var(--rule); color:var(--ink-2)}
  .btn-big{display:block; width:100%; max-width:420px; margin:0 auto; padding:18px; font-size:18px; letter-spacing:.01em}

  input,textarea{touch-action:manipulation; font-family:inherit; font-size:15px; color:var(--ink); background:var(--paper);
    border:var(--bar) solid var(--muted); border-radius:var(--radius); padding:9px 12px; width:100%}
  input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  input[type="checkbox"]{width:auto; accent-color:var(--accent)}

  /* ---- home ---- */
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .top .sub{color:var(--muted); font-size:13.5px; margin-top:6px}
  .pill{font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap; display:inline-flex; align-items:center; gap:7px}
  .pill::before{content:""; width:7px; height:7px; background:var(--muted); border-radius:1px}
  .pill.on{color:var(--accent-2)}
  .pill.on::before{background:var(--accent-2)}
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:stretch}
  .setup .span2{grid-column:1 / -1}
  @media (min-width:1024px){ .setup{grid-template-columns:repeat(2,minmax(0,1fr))} }

  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .row > label{font-size:13.5px; color:var(--muted); min-width:64px}
  .kv{font-size:13px; color:var(--muted)}
  .names{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-top:12px}
  .stepper{display:flex; align-items:center; gap:8px}
  .stepper button{width:36px; height:36px; padding:0; font-size:18px; border-color:var(--rule); color:var(--ink)}
  .stepper b{font-family:var(--font-mono); font-variant-numeric:tabular-nums; min-width:20px; text-align:center; font-size:17px}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:transparent; border:var(--bar) solid var(--rule); border-radius:var(--radius);
    color:var(--muted); padding:8px 12px; font-size:13.5px; font-weight:700; display:flex; gap:8px; align-items:center}
  .chip i{font-family:var(--font-mono); font-style:normal; font-size:12px; opacity:.7}
  .chip.on{border-color:var(--accent); color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent)}
  .chip.on::before{content:"✓"; font-size:11px; line-height:1}
  .chip.on i{opacity:.85}

  .startbar{display:none; position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-top:var(--bar) solid var(--rule); z-index:20}
  body[data-view="home"] .startbar{display:block}
  body[data-view="home"] .wrap{padding-bottom:132px}
  .startbar > div{max-width:1080px; margin:0 auto;
    padding:12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .startbar button{height:48px; display:inline-flex; align-items:center; justify-content:center}
  .startbar .rail{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
  #btnStart{flex:1 1 240px; max-width:420px}
  @media (max-width:640px){ .startbar .rail{width:100%; margin-left:0} .startbar .rail button{flex:1} #btnStart{max-width:none} }

  /* ---- play ---- */
  .play-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .tag{font-size:12.5px; font-weight:700; color:var(--muted); border:var(--bar) solid var(--rule);
    border-radius:var(--radius); padding:5px 10px}
  .tag.turn{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .clock{font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(28px,4vw,40px); line-height:1; color:var(--accent-2)}
  .clock.warn{color:var(--accent)}
  .clock.dead{color:var(--accent); animation:fxPulse 1s ease-in-out infinite}

  .stage{position:relative; isolation:isolate; background:var(--paper-2); border:var(--bar) solid var(--rule);
    border-radius:var(--radius); padding:clamp(24px,6vw,56px) 20px; min-height:32vh; min-height:32dvh; display:flex;
    flex-direction:column; justify-content:center; align-items:center; gap:14px; text-align:center; overflow:hidden}
  .stage::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:-1;
    background-image:repeating-linear-gradient(to bottom, transparent 0 2px, color-mix(in oklab, var(--shade) 22%, transparent) 2px 3px)}
  @supports not (background: color-mix(in oklab, white 50%, black)){
    .stage::after{background-image:repeating-linear-gradient(to bottom, transparent 0 2px, var(--scanline) 2px 3px)}
  }
  .stage-deck{font-size:12px; font-weight:700; color:var(--muted)}
  .stage-q{font-family:var(--font-display); font-weight:900; font-size:clamp(40px,9vw,92px); line-height:1.08;
    letter-spacing:.01em; word-break:break-word; text-wrap:balance; min-height:1.1em}
  .stage-hint{font-size:13.5px; color:var(--muted); max-width:44ch}
  .stage.fx-ok{animation:fxOk .5s var(--ease)}
  .stage.fx-skip{animation:fxShake .34s ease-in-out}
  @keyframes fxOk{0%{box-shadow:inset 0 0 0 3px var(--accent-2)} 100%{box-shadow:inset 0 0 0 3px transparent}}
  @keyframes fxShake{0%,100%{translate:0} 25%{translate:-8px} 70%{translate:8px}}
  @keyframes fxPulse{0%,100%{opacity:1} 50%{opacity:.4}}
  .fx-plus{position:absolute; top:16%; right:12%; font-family:var(--font-mono); font-weight:700;
    font-size:clamp(26px,4vw,44px); color:var(--accent-2); pointer-events:none; animation:fxPlus .8s var(--ease) forwards}
  @keyframes fxPlus{0%{opacity:0; translate:0 10px} 25%{opacity:1; translate:0 0} 100%{opacity:0; translate:0 -44px}}

  .bar{height:6px; background:var(--paper-3); border-radius:0; overflow:hidden; margin:14px 0}
  .bar > i{display:block; height:100%; width:100%; transform-origin:left center; background:var(--accent-2);
    transition:transform .1s linear}
  .bar.warn > i{background:var(--accent)}
  .bar.dead > i{background:var(--accent); animation:fxPulse 1s ease-in-out infinite}


  .judge{display:grid; grid-template-columns:1.6fr 1fr; gap:12px; margin:14px 0 8px}
  .judge button{font-family:var(--font-display); font-size:clamp(20px,2.6vw,26px); font-weight:900;
    padding:20px 12px; border-radius:var(--radius); border:var(--bar) solid var(--ink); letter-spacing:.02em}
  .judge .j-ok{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow)}
  .judge .j-skip{background:transparent; color:var(--ink-2); border-color:var(--rule)}

  .util{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
  .util button{flex:1; min-width:96px; padding:11px; font-size:13.5px; border-color:var(--rule); color:var(--ink-2)}
  .kbd{font-family:var(--font-mono); font-size:11.5px; border:1px solid var(--rule); border-radius:3px; padding:1px 6px; color:var(--muted)}



  /* ===== 主頁：左名單 / 右設定 ===== */
  .setup{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:start}
  @media (min-width:1000px){
    .setup{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .setup .teams{position:sticky; top:16px}
  }
  .stack{display:grid; gap:12px; align-content:start}
  .presets{display:flex; gap:6px}
  .presets button{width:38px; height:38px; padding:0; font-family:var(--font-mono); font-size:13px;
    border-color:var(--rule); color:var(--muted)}
  .presets button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

  /* 名單：一行一隊，號碼 + 名 */
  .names{display:flex; flex-direction:column; gap:6px; margin-top:12px; max-height:48vh; overflow-y:auto}
  .name-row{display:grid; grid-template-columns:24px minmax(0,1fr); gap:8px; align-items:center}
  .name-row span{font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:right}
  .name-row input{padding:10px 12px}

  /* ===== 結果：冠軍台 + 總成績表 ===== */
  .champ{background:var(--accent); color:var(--accent-ink); border:var(--bar) solid var(--accent-ink);
    border-radius:var(--radius); box-shadow:8px 8px 0 var(--accent-2); padding:20px 22px; margin:16px 0 8px;
    display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:0 16px}
  .champ-label{grid-column:1 / -1}
  .champ-name{grid-column:1}
  .champ-score{grid-column:2; text-align:right}
  .champ-meta{grid-column:1 / -1}
  .champ-label{font-family:var(--font-mono); font-size:12px; opacity:.75}
  .champ-name{font-weight:900; font-size:clamp(30px,5.4vw,54px); line-height:1.04; margin:4px 0 2px}
  .champ-score{font-family:var(--font-mono); font-size:clamp(38px,6.4vw,60px); line-height:1; font-variant-numeric:tabular-nums}
  .champ-score em{display:block; font-style:normal; font-size:12px; line-height:1.6; opacity:.75; margin-bottom:2px}
  .champ-score span{font-size:.34em; margin-left:6px; opacity:.75}
  .champ-meta{font-size:13px; opacity:.8; margin-top:8px}
  .champ.tied{background:var(--paper-3); color:var(--ink); border-color:var(--rule); box-shadow:10px 10px 0 var(--rule)}

  .rank{margin-top:12px}
  .rank-h{font-family:var(--font-mono); font-size:11.5px; color:var(--muted); padding:10px 4px 6px}
  .rk .pt{color:var(--ink)}
  .rk.first .pt{color:var(--accent)}
  .result-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px}
  .result-actions .btn-big{margin:0; flex:1 1 260px; max-width:420px}
  .result-actions .btn-quiet{flex:0 0 auto; padding:18px 24px}

  /* ===== 主持台：全屏字卡 ===== */
  body[data-view="play"] .wrap{max-width:none; margin:0; padding:0; height:100dvh; overflow:hidden}
  body[data-view="play"] .startbar{display:none}
  .view.active#v-play{display:flex; flex-direction:column; height:100%}
  #v-play{position:relative}

  .flash-top{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 14px; border-bottom:1px solid var(--rule); flex:0 0 auto; flex-wrap:wrap}
  .flash-tools{display:flex; gap:6px; align-items:center}
  .tool-sep{width:1px; height:20px; background:var(--rule); margin:0 4px}
  .flash-tools button{padding:8px 12px; font-size:13px}
  .flash-tools .quit{border-style:dashed}
  .flash-clock{display:flex; align-items:baseline; gap:4px; font-family:var(--font-mono)}
  .flash-clock b{font-size:clamp(26px,3.6vh,40px); line-height:1; font-variant-numeric:tabular-nums}
  .flash-clock em{font-style:normal; font-size:12px; color:var(--muted)}
  .flash-bar{margin:0; height:4px; border-radius:0}

  .card{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; background:none; border:0; position:relative;
    padding:14px calc(18px + env(safe-area-inset-left)) 40px calc(18px + env(safe-area-inset-right))}
  .card-deck{font-size:12px; letter-spacing:0;
    color:var(--ink-2); border:1px solid var(--rule); border-radius:99px; padding:3px 10px; flex:0 0 auto}
  .card-word{font-family:var(--font-display); font-weight:900; line-height:1.02; letter-spacing:-.02em;
    text-align:center; text-wrap:balance; word-break:break-word; max-width:100%;
    font-size:clamp(48px,22vh,240px); flex:0 1 auto}
  .card-hint{position:absolute; left:50%; transform:translateX(-50%); bottom:10px; width:min(72ch,86%);
    font-size:13.5px; color:var(--ink-2); text-align:center}

  .flash-hud{flex:0 0 auto; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px;
    align-items:stretch; border-top:1px solid var(--rule);
    padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  .flash-hud .j-ok,.flash-hud .j-skip{min-height:84px; padding:0 30px; font-size:clamp(20px,3vh,28px)}
  .flash-hud .j-ok{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); border-color:var(--accent)}
  .flash-hud .j-skip{background:var(--paper-2); color:var(--ink); border-color:var(--rule)}
  .hud-scores{display:flex; gap:6px; align-items:center; justify-content:center; overflow-x:auto;
    min-width:0; scrollbar-width:none}
  .hud-scores::-webkit-scrollbar{display:none}
  .chip-sc{display:grid; gap:0; justify-items:center; padding:6px 12px; min-width:82px;
    border:1px solid var(--rule); border-radius:3px; flex:0 0 auto}
  .chip-sc .n{font-size:12px; color:var(--ink-2); max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip-sc b{font-family:var(--font-mono); font-size:21px; line-height:1.15; font-variant-numeric:tabular-nums}
  .chip-sc.cur{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .chip-sc.cur .n{color:var(--accent-ink); opacity:1}
  .chip-sc.cur b{color:var(--accent-ink)}

  @media (max-width:700px){
    .flash-top{padding:6px 10px}
    .flash-tools button{padding:6px 8px; font-size:12px}
    .flash-hud{grid-template-columns:1fr 1fr; gap:8px}
    .hud-scores{grid-column:1 / -1; order:-1}
    .flash-hud .j-ok,.flash-hud .j-skip{min-height:72px; padding:0}
  }

  /* ---- ready ---- */
  body.is-ready{overflow:hidden}
  .ready{position:fixed; inset:0; background:var(--paper); display:flex; align-items:stretch; justify-content:center;
    padding:0; z-index:60}
  .readyCard{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; background:var(--accent); color:var(--accent-ink);
    border:0; border-radius:0; box-shadow:none;
    padding:clamp(24px,6vh,56px) clamp(20px,4vw,48px)}
  .readyRound{font-family:var(--font-mono); font-size:clamp(12px,1.6vh,15px); opacity:.8; letter-spacing:.06em}
  .readyTeam{font-family:var(--font-display); font-weight:900; font-size:clamp(56px,15vh,168px); line-height:1; margin:10px 0 14px}
  .readyHint{font-size:clamp(15px,2.2vh,20px); line-height:1.6; opacity:.88; max-width:34ch}
  .readyCard button{margin-top:clamp(24px,5vh,56px); background:var(--accent-ink); color:var(--accent);
    border-color:var(--accent-ink); font-family:var(--font-display); font-weight:900;
    font-size:clamp(20px,3vh,28px); padding:clamp(16px,2.4vh,24px) clamp(56px,9vw,110px);
    box-shadow:6px 6px 0 color-mix(in oklab, var(--accent-ink) 55%, transparent)}
  .readyKbd{margin-top:clamp(12px,2vh,18px); font-size:clamp(12px,1.7vh,15px); opacity:.8}
  .readyCount{display:none; font-family:var(--font-mono); font-weight:700; font-size:clamp(72px,16vw,132px); line-height:1}
  .readyCount.on{display:block; margin-top:14px}
  .readyCount.pop{animation:fxPop .5s var(--ease)}
  @keyframes fxPop{0%{scale:.55; opacity:0} 45%{scale:1.08; opacity:1} 100%{scale:1}}

  /* ---- result ---- */
  .rank{display:flex; flex-direction:column; gap:0; margin:18px 0; border-top:var(--bar) solid var(--rule)}
  .rk{display:flex; align-items:center; gap:14px; padding:16px 4px; border-bottom:1px solid var(--rule)}
  .rk .no{font-family:var(--font-mono); font-size:15px; color:var(--muted); width:26px}
  .rk .nm{flex:1; font-size:19px; font-weight:900}
  .rk .st{font-size:12.5px; color:var(--muted); font-weight:400; margin-top:3px}
  .rk .pt{font-family:var(--font-mono); font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
  .rk.first .no{background:var(--accent); color:var(--accent-ink); text-align:center; border-radius:2px}
  .rk.first .pt{color:var(--accent)}

  /* ---- leaderboard ---- */
  .syncbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 18px;
    padding:10px 12px; border:1px solid var(--rule); border-radius:var(--radius); background:var(--paper-2)}
  .syncbar .kv{flex:0 0 auto}
  .syncbar .kv.ok{color:var(--accent-2)}
  .lbrow{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--rule)}
  .lbrow:last-child{border-bottom:0}
  .lbrow .no{width:28px; font-family:var(--font-mono); color:var(--muted); font-size:13px}
  .lbrow .nm{flex:1; font-weight:700}
  .lbrow .nm .st{font-size:12px; color:var(--muted); font-weight:400; margin-top:2px}
  .lbrow .pt{font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--ink)}
  .lbrow:first-child .pt{color:var(--accent)}
  .lbrow:first-child .nm{font-weight:900}

  /* ---- question bank ---- */
  .bankgrid{display:grid; grid-template-columns:240px minmax(0,1fr); gap:12px}
  @media (max-width:760px){ .bankgrid{grid-template-columns:minmax(0,1fr)} }
  .decklist{display:flex; flex-direction:column; gap:6px}
  .decklist button{display:flex; justify-content:space-between; gap:8px; text-align:left; padding:10px 12px;
    border-color:var(--rule); color:var(--ink-2); font-size:13.5px}
  .decklist button i{font-family:var(--font-mono); font-style:normal; font-size:12px; color:var(--muted)}
  .decklist button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:3px 3px 0 var(--accent-2)}
  .decklist button.on i{color:var(--accent-ink); opacity:.8}
  .items{max-height:52vh; overflow:auto; display:flex; flex-direction:column; gap:6px}
  .it{display:grid; grid-template-columns:minmax(0,1fr) 36px; gap:6px; align-items:center}
  .it input{padding:8px 10px; font-size:14px}
  .it button{padding:0; height:34px; border-color:transparent; color:var(--muted)}

  .toast{position:fixed; left:50%; bottom:86px; translate:-50% 0; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:14px; padding:10px 18px; border:var(--bar) solid var(--accent-ink);
    border-radius:var(--radius); box-shadow:4px 4px 0 var(--accent-2); opacity:0; pointer-events:none; transition:opacity .2s; z-index:99}
  .toast.on{opacity:1}

  /* 觸控裝置（iPad 直度同橫度都算）：加大觸控目標 */
  @media (min-width:700px){
    .stepper button{width:44px; height:44px}
    .judge button{padding:26px 12px}
    .chip{min-height:46px; padding:11px 14px}
    .decklist button{min-height:46px; padding:13px 14px}
    .it button{height:44px}
    .util button{padding:14px 12px}
    input,textarea{font-size:16px}          /* iOS 焦點時唔會自動放大 */
  }
  /* 橫度或矮屏：收緊垂直節奏，確保唔使捲 */
  @media (max-height:900px){
    .stage{min-height:26vh; min-height:26dvh}
    .judge button{padding:18px 12px}
    .judge{margin:12px 0 8px}
    h1{font-size:24px}
    .wrap{padding-top:14px}
  }
  @media (hover:hover) and (pointer:fine){
    .btn-primary:hover{background:color-mix(in oklab, var(--accent) 88%, white)}
    .btn-quiet:hover{border-color:var(--ink); color:var(--ink)}
    .chip:hover{border-color:var(--ink-2); color:var(--ink)}
    .judge .j-skip:hover{color:var(--accent-2); border-color:var(--accent-2)}
    .util button:hover{border-color:var(--ink); color:var(--ink)}
    .it button:hover{color:var(--accent); border-color:var(--rule)}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
    .bar > i{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 主頁 ========== -->
  <section class="view active" id="v-home">
    <header class="top">
      <div>
        <h1>大電視</h1>
        <p class="sub">一人背向屏幕猜，全隊描述。主持按對或跳過，對錯由人拍板。</p>
      </div>
      <span class="pill" id="srcPill">題庫來源：本機</span>
    </header>

    <div class="setup">
      <section class="well teams">
        <h2>隊伍名單</h2>
        <div class="row" style="justify-content:space-between">
          <div class="stepper">
            <button id="teamMinus" aria-label="減少隊伍">−</button><b id="teamCount">2</b><button id="teamPlus" aria-label="增加隊伍">＋</button>
          </div>
          <div class="presets">
            <button data-teams="2">2</button><button data-teams="4">4</button>
            <button data-teams="6">6</button><button data-teams="8">8</button>
          </div>
        </div>
        <div class="names" id="nameList"></div>
      </section>

      <div class="stack">
      <section class="well">
        <h2>計時</h2>
        <div class="row" style="margin-bottom:12px">
          <label>每回合</label>
          <input id="secInput" type="number" min="0" max="600" step="5" style="width:88px">
          <span class="kv">秒 · 0 = 不限時</span>
        </div>
        <div class="row">
          <label class="kv"><input type="checkbox" id="vfxChk" style="margin-right:6px">畫面動效</label>
        </div>
        <p class="kv" style="margin-top:8px">動效係答對閃光、跳過震動同倒數彈跳。</p>
      </section>

      <section class="well">
        <h2>題庫</h2>
        <div class="chips" id="deckChips"></div>
        <div class="row" style="margin-top:12px">
          <span class="kv" id="deckCount"></span>
          <button class="btn-quiet" id="btnAll">全選</button>
          <button class="btn-quiet" id="btnNone">全不選</button>
        </div>
      </section>
      </div>
    </div>
  </section>

  <!-- ========== 遊戲 ========== -->
  <section class="view" id="v-play">
    <div class="flash-top">
      <div class="row" style="gap:8px">
        <span class="tag turn" id="pTurn">輪到 A 隊</span>
        <span class="tag" id="pLeft"></span>
      </div>
      <div class="flash-clock"><b class="clock" id="pClock">60</b><em>秒</em></div>
      <div class="flash-tools">
        <button class="btn-quiet" id="btnPause">暫停</button>
        <button class="btn-quiet" id="btnUndo">撤銷</button>
        <button class="btn-quiet" id="btnEndTurn">結束回合</button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button class="btn-quiet quit" id="btnQuit">結束遊戲</button>
      </div>
    </div>

    <div class="bar flash-bar" id="pBar"><i></i></div>

    <main class="card question" id="stage">
      <div class="card-deck" id="pDeck"></div>
      <div class="card-word" id="pText"></div>
      <div class="card-hint" id="pHint"></div>
    </main>

    <div class="flash-hud">
      <button class="j-skip" data-judge="skip">跳過</button>
      <div class="hud-scores" id="pScores" aria-label="賽況"></div>
      <button class="j-ok" data-judge="ok">對</button>
    </div>

    <div class="ready" id="readyOverlay" style="display:none">
      <div class="readyCard">
        <div class="readyRound" id="rdRound"></div>
        <div class="readyTeam" id="rdTeam"></div>
        <div class="readyHint" id="rdHint">派一個人背向屏幕，隊友準備好就撳開始</div>
        <button id="btnReady">開始</button>
        <div class="readyKbd">或者撳 <span class="kbd">Space</span></div>
        <div class="readyCount" id="rdCount"></div>
      </div>
    </div>
  </section>

  <!-- ========== 排行榜 ========== -->
  <section class="view" id="v-lb">
    <h1>排行榜</h1>
    <p class="kv" id="lbSub" style="margin:6px 0 18px">全部場次累計</p>
    <div class="well" style="margin-bottom:12px">
      <h2>累計</h2>
      <div id="lbPlayers"></div>
    </div>
    <div class="well">
      <h2>最近場次</h2>
      <div id="lbRecent"></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button class="btn-quiet" id="btnLbBack">返主頁</button>
    </div>
  </section>

  <!-- ========== 結果 ========== -->
  <section class="view" id="v-result">
    <h1>結果</h1>
    <p class="kv" id="rSub" style="margin:6px 0 0"></p>
    <div id="champBox"></div>
    <div class="rank" id="rankList"></div>
    <div class="result-actions">
      <button class="btn-primary btn-big" id="btnAgain">再玩一次</button>
      <button class="btn-quiet" id="btnLbFromResult">排行榜</button>
      <button class="btn-quiet" id="btnBackHome">返主頁</button>

  <!-- ========== 題庫管理（離線用） ========== -->
  <section class="view" id="v-bank">
    <h1>題庫</h1>
    <p class="kv" style="margin:2px 0 10px">題庫存喺雲端，所有機共用同一份；冇連線就讀唔到。</p>
    <div class="syncbar">
      <button class="btn-quiet" id="btnSyncNow">重新載入</button>
      <span class="kv" id="syncState">載入中…</span>
    </div>
    <div class="bankgrid">
      <div class="well">
        <h2>類別</h2>
        <div class="decklist" id="bankDecks"></div>
        <div class="row" style="margin-top:12px">
          <input id="newDeckName" placeholder="新類別">
          <button class="btn-quiet" id="btnAddDeck">新增</button>
        </div>
      </div>
      <div class="well">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0" id="bankDeckTitle">類別</h2>
          <div class="row" style="gap:8px">
            <button class="btn-quiet" id="btnDelDeck">刪除類別</button>
          </div>
        </div>
        <div class="items" id="bankItems"></div>
        <div style="margin-top:16px">
          <h2>批量新增，每行一題</h2>
          <textarea id="bulkInput" rows="4" placeholder="雞蛋仔&#10;菠蘿包&#10;開會"></textarea>
          <div class="row" style="margin-top:8px">
            <button class="btn-quiet" id="btnBulkAdd" style="flex:1">加入題目</button>

<div class="startbar">
  <div>
    <button class="btn-primary" id="btnStart">開始遊戲</button>
    <div class="rail">
      <button class="btn-quiet" id="btnBankHome">題庫</button>
      <button class="btn-quiet" id="btnLb">排行榜</button>
      <button class="btn-quiet" id="btnFull">全螢幕</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";

const HINT = "由 {who} 派一個人背向屏幕。隊友描述或做動作，唔准講出題目上面任何一隻字。";

/* ================= 狀態 ================= */
const K_CFG="bigtv.cfg.v3";   // 題庫唔再存本機，只存雲端
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let bank = { name:"題庫", decks:[] };   // 開機由雲端載入
let cfg  = Object.assign({
  teams:2, names:["A 隊","B 隊","C 隊","D 隊","E 隊","F 隊","G 隊","H 隊"],
  sec:60, decks: [], vfx:true
}, store.get(K_CFG, {}));

let G = null;
let bankDeck = bank.decks[0] ? bank.decks[0].id : null;
let REMOTE = { ok:false };

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 題目一律以 {t:"..."} 存；舊格式（字串 / {t,ban}）都食得住 */
function normalizeBank(b){
  if(!b || !Array.isArray(b.decks)) return { name:"題庫", decks:[] };
  return {
    name: b.name || "題庫",
    decks: b.decks.map((d,i)=>({
      id: d.id || ("d"+i),
      name: d.name || ("類別 "+(i+1)),
      items: (d.items||[])
        .map(it => (typeof it === "string" ? it : String((it && it.t) || "")))
        .map(t => t.trim()).filter(Boolean)
        .map(t => ({ t }))
    }))
  };
}
function saveBank(){ /* 題庫只存雲端，本機唔留副本 */ }

/* ---- 題庫同步：題庫只存雲端，開放寫入（冇寫入碼） ---- */
function setSyncState(kind){
  const el = $("#syncState"); if(!el) return;
  const map = {syncing:["", "同步中…"], ok:["ok", "已同步"], error:["", "寫入失敗（檢查連線）"],
    offline:["", "未連線"]};
  const [cls, text] = map[kind] || ["", ""];
  el.className = "kv" + (cls ? " " + cls : "");
  el.textContent = text;
}
let pushTimer = null;
function pushBank(delay){
  clearTimeout(pushTimer);
  setSyncState("syncing");
  pushTimer = setTimeout(async ()=>{
    try{
      const r = await fetch("/api/bank", {method:"PUT", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: bank.name, decks: bank.decks})});
      if(!r.ok) throw new Error("put");
      REMOTE.ok = true; updateSrc(); setSyncState("ok");
    }catch(e){ setSyncState("error"); }
  }, delay ?? 400);
}
function saveCfg(){ store.set(K_CFG, cfg); }

function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("active", v.id===id));
  document.body.dataset.view = id.replace(/^v-/, "");
  window.scrollTo(0,0);
}
let toastT=null;
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"), 1800);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= 後端（有就用，冇就本機） ================= */
async function pullRemoteBank(){
  try{
    const r = await fetch("/api/bank", {cache:"no-store"});
    if(!r.ok) throw new Error("bad status");
    const b = await r.json();
    if(!b.decks || !b.decks.length) throw new Error("empty");
    bank = normalizeBank(b);
    saveBank();
    cfg.decks = cfg.decks.filter(id=>bank.decks.some(d=>d.id===id));
    if(!cfg.decks.length) cfg.decks = bank.decks.map(d=>d.id);
    saveCfg();
    REMOTE.ok = true;
    renderHome(); updateSrc();
  }catch(e){ REMOTE.ok = false; updateSrc(); renderHome(); setSyncState("offline"); }
}
function updateSrc(){
  const el = $("#srcPill");
  if(!el) return;
  el.textContent = REMOTE.ok ? "題庫：已連線" : "題庫：未連線";
  el.className = "pill" + (REMOTE.ok ? " on" : "");
}

/* ================= VFX ================= */
function fxOk(){
  if(!cfg.vfx) return;
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-ok");
  const plus = document.createElement("span");
  plus.className = "fx-plus"; plus.textContent = "+1";
  q.appendChild(plus);
  setTimeout(()=>plus.remove(), 900);
}
function fxSkip(){
  if(!cfg.vfx) return;
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-skip");
}
function fxPop(el){
  if(!cfg.vfx || !el) return;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}

/* ================= 主頁 ================= */
function renderHome(){
  $("#teamCount").textContent = cfg.teams;
  $("#nameList").innerHTML = Array.from({length:cfg.teams},(_,i)=>`
    <label class="name-row"><span>${i+1}</span>
      <input data-name="${i}" value="${esc(cfg.names[i]||("隊 "+(i+1)))}" maxlength="12"></label>`).join("");
  $$(".presets button").forEach(b=>b.classList.toggle("on", +b.dataset.teams === cfg.teams));
  $$("#nameList input").forEach(inp=>inp.onchange=()=>{
    cfg.names[+inp.dataset.name] = inp.value.trim() || ("隊 "+(+inp.dataset.name+1));
    inp.value = cfg.names[+inp.dataset.name]; saveCfg();
  });

  $("#secInput").value = cfg.sec;
    $("#vfxChk").checked = !!cfg.vfx;

  $("#deckChips").innerHTML = bank.decks.map(d=>`
    <button class="chip ${cfg.decks.includes(d.id)?"on":""}" data-deck="${esc(d.id)}">
      ${esc(d.name)} <i style="opacity:.55;font-style:normal">${d.items.length}</i>
    </button>`).join("");
  $$("#deckChips .chip").forEach(b=>b.onclick=()=>{
    const id=b.dataset.deck;
    cfg.decks = cfg.decks.includes(id) ? cfg.decks.filter(x=>x!==id) : cfg.decks.concat(id);
    saveCfg(); renderHome();
  });
  const total = bank.decks.filter(d=>cfg.decks.includes(d.id)).reduce((s,d)=>s+d.items.length,0);
  $("#deckCount").textContent = bank.decks.length
    ? `已選 ${cfg.decks.length} 個類別 · 共 ${total} 題`
    : "未連線：題庫讀唔到";
  $("#teamMinus").disabled = cfg.teams <= 1;
  $("#teamPlus").disabled = cfg.teams >= 8;
  $("#btnStart").disabled = !bank.decks.length;
  $("#btnStart").textContent = bank.decks.length ? "開始遊戲" : "題庫未連線";
  $("#btnAll").disabled = !bank.decks.length || cfg.decks.length >= bank.decks.length;
  $("#btnNone").disabled = cfg.decks.length === 0;
}

/* ================= 題庫管理（離線用） ================= */
function renderBank(){
  setSyncState(REMOTE.ok ? "ok" : "offline");
  if(!bank.decks.some(d=>d.id===bankDeck)) bankDeck = bank.decks[0] ? bank.decks[0].id : null;
  $("#bankDecks").innerHTML = bank.decks.map(d=>`
    <button class="${d.id===bankDeck?"on":""}" data-bd="${esc(d.id)}">
      <span>${esc(d.name)}</span><i>${d.items.length}</i>
    </button>`).join("") || `<p class="sub" style="margin:0">未有類別，新增一個先。</p>`;
  $$("#bankDecks button").forEach(b=>b.onclick=()=>{ bankDeck=b.dataset.bd; renderBank(); });

  const deck = bank.decks.find(d=>d.id===bankDeck);
  $("#bankDeckTitle").textContent = deck ? deck.name : "類別";
  $("#bankItems").innerHTML = deck ? deck.items.map((it,i)=>`
    <div class="it">
      <input data-t="${i}" value="${esc(it.t)}" placeholder="題目">
      <button data-del="${i}" title="刪除">✕</button>
    </div>`).join("") : "";
  // 開放寫入：編輯控制一律可用（連唔到線先會寫入失敗）
  ["#newDeckName","#btnAddDeck","#btnDelDeck","#btnBulkAdd","#bulkInput"].forEach(sel=>{
    const el = $(sel); if(el) el.disabled = false;
  });
  if(deck){
    $$("#bankItems input[data-t]").forEach(inp=>inp.onchange=()=>{
      const i=+inp.dataset.t, v=inp.value.trim();
      if(v) deck.items[i].t = v; else inp.value = deck.items[i].t;
      saveBank(); renderHome(); pushBank();
    });
    $$("#bankItems button[data-del]").forEach(b=>b.onclick=()=>{
      deck.items.splice(+b.dataset.del,1); saveBank(); renderBank(); renderHome(); pushBank();
      toast("已刪除");
    });
  }
}

/* ================= 遊戲流程 ================= */
function startGame(){
  if(G){ clearInterval(G.timerId); G.timerToken++; }   // 清走上一局殘留嘅倒數
  const names = Array.from({length:cfg.teams},(_,i)=> cfg.names[i] || ("隊 "+(i+1)));
  const pool = [];
  bank.decks.filter(d=>cfg.decks.includes(d.id)).forEach(d=>{
    d.items.forEach(it=> pool.push({t:it.t, deck:d.name}));
  });
  if(!pool.length){ toast("請先揀最少一個有題目嘅類別"); return; }

  G = {
    sec: Number(cfg.sec)||0,
    teams: names.map(n=>({name:n, score:0, ok:0, skip:0})),
    turn:0,
    pool: shuffle(pool.slice()), used: [], cur:null,
    log: [], paused:false, remaining:0, timerId:null, timerToken:0,
    phase:"ready"
  };
  showView("v-play");
  enterReady();
}

/* 每隊出場前停一停：唔計時、唔出題，等佢哋準備 */
function enterReady(){
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "ready";
  G.cur = null;
  G.remaining = G.sec;
  G.paused = false;
  $("#btnPause").textContent = "暫停";
  $("#rdRound").textContent = `第 ${G.turn+1} / ${G.teams.length} 隊`;
  $("#rdTeam").textContent = G.teams[G.turn].name;
  $("#rdCount").textContent = "";
  $("#rdCount").classList.remove("on");
  $("#btnReady").style.display = "";
  $("#readyOverlay").style.display = "flex";
  document.body.classList.add("is-ready");
  renderPlay();
}

function hideReady(){
  $("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
}

/* 撳「開始」→ 3、2、1 → 真正出題計時 */
function startRound(){
  if(!G || G.phase !== "ready") return;
  G.phase = "countdown";
  $("#btnReady").style.display = "none";
  const el = $("#rdCount");
  el.classList.add("on");
  const BEAT = 1150;                 // 每個數字停 1.15 秒，畀人有時間準備
  let n = 3;
  el.textContent = n; fxPop(el);
  const tick = setInterval(()=>{
    n--;
    if(n > 0){ el.textContent = n; fxPop(el); }
    else if(n === 0){ el.textContent = "開始"; fxPop(el); }
    else {
      clearInterval(tick);
      el.classList.remove("on");
      hideReady();
      beginRunning();
    }
  }, BEAT);
}

function beginRunning(){
  G.phase = "running";
  G.cur = drawItem();
  G.remaining = G.sec;
  startTimer();
  renderPlay();
}

function drawItem(){
  if(!G.pool.length){ G.pool = shuffle(G.used.slice()); G.used = []; toast("題目用晒，重新洗牌"); }
  const it = G.pool.pop();
  G.used.push(it);
  return it;
}

function startTimer(){
  clearInterval(G.timerId);
  if(!G.sec){ renderTimer(); return; }
  const token = ++G.timerToken;
  const id = setInterval(()=>{
    if(token !== G.timerToken){ clearInterval(id); return; }   // 舊局嘅表，唔准再影響新局
    if(G.paused) return;
    G.remaining = Math.max(0, G.remaining - 0.1);
    renderTimer();
    const sec = Math.ceil(G.remaining);
    if(G.remaining<=0){ clearInterval(id); endTurn(); }
  },100);
  G.timerId = id;
}

function renderTimer(){
  const el=$("#pClock"), bar=$("#pBar");
  if(!G.sec){
    el.textContent="∞"; el.className="clock"; bar.className="bar"; $("#pBar > i").style.transform="scaleX(1)";
    return;
  }
  el.textContent = Math.ceil(G.remaining);
  el.className = "clock" + (G.remaining<=5 ? " dead" : G.remaining<=15 ? " warn" : "");
  const pct = Math.max(0, Math.min(1, G.remaining / G.sec));
  $("#pBar > i").style.transform = `scaleX(${pct.toFixed(3)})`;
  bar.className = "bar" + (G.remaining<=5 ? " dead" : G.remaining<=15 ? " warn" : "");
}

// 題目字自動撐滿字卡：優先一行（唔好把「演唱會」劈開），字太細才容許斷行
function fitWord(text){
  const el=$("#pText"), card=el.parentElement;
  const boxW=card.clientWidth-36, boxH=card.clientHeight-72;
  if(boxW<=40 || boxH<=40) return;
  const fit = (oneLine)=>{
    el.style.whiteSpace = oneLine ? "nowrap" : "normal";
    el.style.wordBreak  = oneLine ? "keep-all" : "break-word";
    let lo=24, hi=Math.min(360, boxH);
    for(let i=0;i<9;i++){
      const mid=(lo+hi)/2;
      el.style.fontSize=mid+"px";
      const okW = oneLine ? el.scrollWidth<=boxW+1 : el.scrollWidth<=boxW+1;
      if(okW && el.scrollHeight<=boxH+1) lo=mid; else hi=mid;
    }
    el.style.fontSize=Math.floor(lo)+"px";
    return lo;
  };
  const one = fit(true);
  if(one < 64) fit(false);          // 一行太細 → 寧願斷行做大
}
addEventListener("resize", ()=>{ if(G && G.phase==="running") fitWord($("#pText").textContent); });

function renderPlay(){
  $("#pTurn").textContent = "輪到 " + G.teams[G.turn].name;
  $("#pLeft").textContent = `剩 ${G.pool.length} 題`;

  const it = G.cur || {t:"", deck:""};   // ready 階段未有題目
  $("#pText").textContent = it.t;
  $("#pDeck").textContent = it.deck || "";
  $("#pHint").textContent = HINT.replace("{who}", G.teams[G.turn].name);
  fitWord(it.t);

  // 賽況 HUD：按分數排，當前隊填 ember
  const ranked = G.teams.map((t,i)=>({t,i})).sort((a,b)=> b.t.score-a.t.score || a.i-b.i);
  $("#pScores").innerHTML = ranked.map(({t,i},k)=>`
    <div class="chip-sc ${i===G.turn?"cur":""}">
      <span class="n">${esc(t.name)}</span>
      <b>${t.score}</b>
    </div>`).join("");

  renderTimer();
}

function judge(kind){
  if(!G || G.phase !== "running" || !G.cur) return;
  const t = G.teams[G.turn];
  const delta = kind==="ok" ? 1 : 0;
  G.log.push({item:G.cur, kind, team:G.turn, delta});
  t.score += delta;
  if(kind==="ok"){ t.ok++; fxOk(); }
  else { t.skip++; fxSkip(); }
  G.cur = drawItem();
  renderPlay();
}

function undo(){
  if(!G || !G.log.length) return;
  const last = G.log.pop();
  const t = G.teams[last.team];
  t.score -= last.delta;
  if(last.kind==="ok") t.ok--; else t.skip--;
  G.cur = last.item;
  renderPlay();
  toast("已撤銷");
}

function endTurn(){
  if(!G) return;
  if(G.phase === "ready"){ enterReady(); return; }   // 未開始就撳，當重整
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "ready";
  G.turn++;
  if(G.turn >= G.teams.length){
    endGame(); return;
  }
  enterReady();
}

function endGame(){
  if(!G) return;
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "done";
  hideReady();
  const sorted = G.teams.map((t,i)=>({...t,i})).sort((a,b)=> b.score-a.score || b.ok-a.ok);
  const total = G.teams.reduce((s,t)=>s+t.score,0);
  const okTotal = G.teams.reduce((s,t)=>s+t.ok,0);
  $("#rSub").textContent = `全場答對 ${okTotal} 題 · 總分 ${total}`;

  const top = sorted[0];
  const winners = sorted.filter(t=>t.score === top.score);
  const tied = winners.length > 1;
  $("#champBox").innerHTML = `
    <div class="champ ${tied ? "tied" : ""}">
      <div class="champ-label">${tied ? "並列第一" : "冠軍"}</div>
      <div class="champ-name">${winners.map(t=>esc(t.name)).join(" · ")}</div>
      <div class="champ-score"><em>總分</em>${top.score}<span>分</span></div>
      <div class="champ-meta">對 ${top.ok} · 跳 ${top.skip}</div>
    </div>`;

  const rest = sorted.slice(winners.length);
  $("#rankList").innerHTML = rest.length ? `
    <div class="rank-h">其餘名次</div>` + rest.map((t,idx)=>`
    <div class="rk">
      <div class="no">${idx+winners.length+1}</div>
      <div class="nm">${esc(t.name)}
        <div class="st">對 ${t.ok} · 跳 ${t.skip}</div>
      </div>
      <div class="pt">${t.score}</div>
    </div>`).join("") : "";
  showView("v-result");
  if(REMOTE.ok){
    fetch("/api/sessions", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        mode:"大電視", rounds:1, questions:G.log.length,
        teams: G.teams.map(t=>({name:t.name, score:t.score, ok:t.ok, skip:t.skip}))
      })
    }).catch(()=>{ toast("成績上傳失敗（server 斷線？）"); });
  }
}

/* ================= 排行榜 ================= */
async function openLb(){
  showView("v-lb");
  $("#lbPlayers").innerHTML = `<p class="sub">載入中…</p>`;
  $("#lbRecent").innerHTML = "";
  try{
    const r = await fetch("/api/leaderboard?limit=20", {cache:"no-store"});
    if(!r.ok) throw new Error("bad status");
    const d = await r.json();
    $("#lbSub").textContent = `共 ${d.sessions_total} 場`;
    $("#lbPlayers").innerHTML = (d.players||[]).map((pl,i)=>`
      <div class="lbrow">
        <div class="no">${i+1}</div>
        <div class="nm">${esc(pl.name)}<div class="st">${pl.games} 場 · 最佳 ${pl.best} 分 · 對 ${pl.ok} · 跳 ${pl.skips}</div></div>
        <div class="pt">${pl.total}</div>
      </div>`).join("") || `<p class="sub">未有紀錄</p>`;
    $("#lbRecent").innerHTML = (d.recent||[]).map(s=>`
      <div class="lbrow">
        <div class="nm">${esc((s.finished_at||"").replace("T"," ").slice(0,16))}
          <span class="st"> · ${s.players} 隊</span>
          <div class="st">冠軍 ${esc(s.winner||"未有")}（${s.winner_score??0} 分）</div>
        </div>
      </div>`).join("") || `<p class="sub">未有場次</p>`;
  }catch(e){
    $("#lbSub").textContent = "未連線";
    $("#lbPlayers").innerHTML = `<p class="sub">未有 server 連線，排行榜只喺連後端時可用。<br>用 <code>python3 server.py</code> 開後端，或者部署去 NAS。</p>`;
  }
}

};

$("#btnStart").onclick = startGame;
if(!document.documentElement.requestFullscreen){ $("#btnFull").style.display = "none"; }

$$("[data-judge]").forEach(b=>b.onclick=()=>judge(b.dataset.judge));

$("#btnUndo").onclick = undo;

$("#btnBankHome").onclick = ()=>{ showView("v-bank"); renderBank(); };

$("#btnBankBack").onclick = ()=>{ showView("v-home"); renderHome(); };

  setSyncState("syncing");
  await pullRemoteBank();
  if(REMOTE.ok){ renderBank(); setSyncState("ok"); toast("已重新載入題庫"); }
  else setSyncState("offline");
};

$("#btnAddDeck").onclick = ()=>{
  const n = $("#newDeckName").value.trim(); if(!n) return;
  const id = "u"+Date.now().toString(36);
  bank.decks.push({id, name:n, items:[]});
  bankDeck = id; cfg.decks.push(id);
  $("#newDeckName").value=""; saveBank(); saveCfg(); renderBank(); renderHome(); pushBank(); toast("已新增類別");
};
$("#btnDelDeck").onclick = ()=>{
  const deck = bank.decks.find(d=>d.id===bankDeck); if(!deck) return;
  if(!confirm(`刪除類別「${deck.name}」同裡面 ${deck.items.length} 題？`)) return;
  bank.decks = bank.decks.filter(d=>d.id!==bankDeck);
  cfg.decks = cfg.decks.filter(id=>id!==bankDeck);
  saveBank(); saveCfg(); renderBank(); renderHome(); pushBank(); toast("已刪除類別");
};
$("#btnBulkAdd").onclick = ()=>{
  const deck = bank.decks.find(d=>d.id===bankDeck); if(!deck){ toast("先揀或新增一個類別"); return; }
  const lines = $("#bulkInput").value.split("\n").map(s=>s.trim()).filter(Boolean);
  let n=0;
  lines.forEach(line=>{
    const title = line.split("|")[0].trim();     // 舊格式「題目|禁字」都食得住
    if(!title || deck.items.some(x=>x.t===title)) return;
    deck.items.push({t:title}); n++;
  });
  $("#bulkInput").value="";
  saveBank(); renderBank(); renderHome();
  if(n) pushBank();
  toast(n? `已加入 ${n} 題` : "冇新題目加入");
};
$("#btnBankBack").onclick = ()=>{ showView("v-home"); renderHome(); };
/* 鍵盤控場 */
document.addEventListener("keydown", e=>{
  if(!$("#v-play").classList.contains("active")) return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if(e.code==="Space" || k==="enter"){
    e.preventDefault();
    if(!G) return;
    if(G.phase === "ready") startRound();
    else if(G.phase === "running") judge("ok");
    return;
  }
  else if(k==="s" || k==="arrowdown"){ e.preventDefault(); judge("skip"); }
  else if(k==="z"){ undo(); }
  else if(k==="escape" || k==="p"){ e.preventDefault(); $("#btnPause").click(); }
});

window.__bigtv = { get G(){return G}, get bank(){return bank}, get cfg(){return cfg},
  startGame, startRound, enterReady, judge, undo, endTurn, endGame, renderHome, renderPlay, renderBank, showView };
