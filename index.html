<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大電視">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="author" content="Leung Tung Lam">
<meta name="copyright" content="© 2026 Leung Tung Lam. MIT License.">
<meta name="description" content="大電視：派對猜詞遊戲。一部 iPad 控場，一人背向屏幕猜詞、全隊負責描述，主持按「對」或「跳過」判定。">
<title>大電視</title>
<style>
  /* Hallmark · redesign: Apple (iPadOS dark) · scope: app · v3.0.0
     critique · host console as a system app: black ground, one blue action, content over chrome
     waive type · SF Pro is not embeddable: system-ui resolves to SF on iPadOS, PingFang carries CJK */

  :root{
    color-scheme:light;
    /* ground */
    --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#E9E9EE; --fill:rgba(118,118,128,.12);
    --fill-2:rgba(118,118,128,.20); --fill-3:rgba(118,118,128,.10); --spot:rgba(0,113,227,.10); --sheet-veil:rgba(0,0,0,.28); --vs-shadow:rgba(0,0,0,.18);
    /* ink */
    --ink:#000000; --ink-2:rgba(60,60,67,.72); --ink-3:rgba(60,60,67,.40);
    --sep:rgba(60,60,67,.18);
    /* system colours */
    --blue:#0071E3; --blue-press:#005FBF;
    --blue-fill:var(--blue); --blue-fill-press:var(--blue-press); --green:#34C759; --red:#FF3B30; --amber:#FF9F0A;
    --on-accent:#FFFFFF; --focus-ring:rgba(0,113,227,.85);
    --bar-bg:rgba(255,255,255,.84); --flash-ok:rgba(52,199,89,.16); --toast-bg:rgba(28,28,30,.92);
    --toast-ink:#FFFFFF; --flash-bad:rgba(255,59,48,.15);
    /* stage */
    --dim:rgba(0,0,0,.62); --vignette:rgba(0,0,0,.45); --beam-hi:rgba(255,255,255,.92); --beam-mid:rgba(255,255,255,.30);
    /* geometry */
    --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:8px; --pill:999px;
    --hair:1px;
    /* motion */
    --dur:.28s; --ease:cubic-bezier(.32,.72,0,1);
    /* legacy aliases（舊規則仍然引用） */
    --paper:var(--bg); --paper-2:var(--surface); --paper-3:var(--surface-2);
    --muted:var(--ink-2); --rule:var(--sep); --accent:var(--blue); --accent-2:var(--green);
    --accent-ink:#FFFFFF; --focus:var(--blue); --bar:1px; --radius:var(--r-lg);
    --shadow:none; --shade:#000;
    --font-display:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Display","PingFang HK","Noto Sans HK",sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","PingFang HK","Noto Sans HK",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
    --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%; background:var(--bg); overflow-x:clip}
  body{color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}

  /* ---------- layout ---------- */
  .wrap{max-width:1024px; margin:0 auto;
    padding:22px max(20px,env(safe-area-inset-right)) 28px max(20px,env(safe-area-inset-left))}

  .view{display:none}
  .view.active{display:block}

  h1{margin:0; font-family:var(--font-display); font-weight:700; font-size:34px;
    letter-spacing:-.02em; line-height:1.12; text-wrap:balance}
  h2{margin:0; font-size:22px; font-weight:600; color:var(--ink); letter-spacing:-.01em}
  .kv{font-size:15px; color:var(--ink-2)}

  /* ---------- 主頁（入口） ---------- */
  #v-home{display:none}
  #v-home.active{display:flex; flex-direction:column; min-height:calc(100dvh - 50px)}
  #v-home.active{position:relative; overflow:hidden}
  #v-home.active::before{content:""; position:absolute; width:min(120vh,900px); aspect-ratio:1;
    border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, var(--spot) 0%, transparent 62%);
    animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.92); opacity:.75} 50%{transform:scale(1.06); opacity:1}}
  .landing{position:relative; z-index:1; flex:1; display:grid; grid-template-rows:1fr auto;
    justify-items:center; align-items:center; text-align:center}
  .landing-main{display:flex; flex-direction:column; align-items:center}
  .landing-title{margin:14px 0 0; font-family:var(--font-display); font-weight:700;
    font-size:clamp(76px,16vh,168px); letter-spacing:-.045em; line-height:.98;
    animation:rise .62s .06s var(--ease) both}
  .landing-go{margin-top:36px; min-width:260px; min-height:60px; font-size:21px; border-radius:var(--pill);
    animation:rise .62s .18s var(--ease) both}
  .landing-foot{display:flex; align-items:center; justify-content:center; gap:8px;
    padding:0 0 4px; animation:rise .62s .3s var(--ease) both}
  .landing-credit{font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .brand-links{display:inline-flex; align-items:center; gap:4px; padding-left:10px; margin-left:2px;
    border-left:var(--hair) solid var(--sep)}
  .brand{display:grid; place-items:center; width:38px; height:38px; border-radius:10px;
    background:var(--surface); text-decoration:none; color:var(--ink-2);
    box-shadow:0 0 0 1px color-mix(in oklab, var(--sep) 85%, transparent);
    transition:box-shadow var(--dur), color var(--dur)}
  .brand:hover{color:var(--ink);
    box-shadow:0 0 0 1px color-mix(in oklab, var(--sep) 130%, transparent)}
  .brand svg{display:block; width:18px; height:18px}
  .brand img{display:block; width:29px; height:29px; border-radius:7px}
  .landing-link{display:inline-flex; align-items:center; justify-content:center; margin-top:20px;
    min-height:48px; padding:0 26px; border-radius:var(--pill); background:var(--fill);
    color:var(--ink); font-size:17px; font-weight:600; text-decoration:none;
    animation:rise .62s .22s var(--ease) both}
  .landing-link:active{background:var(--fill-2)}
  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  body.is-entering .landing{opacity:0; transform:scale(1.06);
    transition:opacity .28s var(--ease), transform .42s var(--ease)}

  /* ---------- 設定（逐步） ---------- */
  #v-setup{display:none}
  #v-setup.active{display:flex; flex-direction:column; min-height:calc(100dvh - 50px)}
  .setup-top{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:12px;
    margin-inline:calc(50% - 50vw);
    padding:0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left))}
  .dots{display:flex; justify-content:center; gap:8px}
  .dots i{width:9px; height:9px; border-radius:50%; background:var(--sep);
    transition:background-color .3s var(--ease), transform .3s var(--ease)}
  .dots i.on{background:var(--blue)}
  .dots i.cur{transform:scale(1.6)}

  .stage{position:relative; flex:1; min-height:0; margin:8px 0}
  .js .sstep{opacity:0; transform:translateX(56px); pointer-events:none}
  .sstep{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:22px; text-align:center;
    transition:opacity .42s var(--ease), transform .42s var(--ease)}
  .js .sstep.on{opacity:1; transform:none; pointer-events:auto}
  .js .sstep.back{transform:translateX(-56px)}
  .sstep.on > *{animation:rise .5s var(--ease) both}
  .sstep.on > *:nth-child(1){animation-delay:.04s}
  .sstep.on > *:nth-child(2){animation-delay:.10s}
  .sstep.on > *:nth-child(3){animation-delay:.16s}
  .sstep.on > *:nth-child(4){animation-delay:.22s}

  .sstep-title{margin:0; font-family:var(--font-display); font-size:clamp(32px,4.6vh,44px);
    font-weight:700; letter-spacing:-.02em}
  .sstep-hint{font-size:15px; color:var(--ink-2)}

  .bignum{display:flex; align-items:baseline; gap:clamp(16px,3.4vw,40px)}
  .bignum input{width:2ch; min-height:0; padding:0; background:transparent; border:0; text-align:center;
    font-family:var(--font-display); font-size:clamp(84px,17vh,180px); font-weight:700;
    letter-spacing:-.04em; line-height:1; -moz-appearance:textfield; font-variant-numeric:tabular-nums}
  .bignum input::-webkit-outer-spin-button,.bignum input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .bignum-sec{justify-content:center; padding-left:clamp(24px,3vw,40px)}
  .bignum-sec input{width:3ch}
  .bignum-unit{font-family:var(--font-display); font-size:clamp(24px,3.4vh,34px); font-weight:600; color:var(--ink-2); margin-left:-6px}
  .pop{animation:pop .34s var(--ease)}
  @keyframes pop{0%{transform:scale(1)} 38%{transform:scale(1.07)} 100%{transform:scale(1)}}


  .namegrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px 16px;
    width:min(760px,100%)}
  .name-row{display:grid; grid-template-columns:56px minmax(0,1fr); gap:12px; align-items:center}
  .animal-btn{position:relative; width:56px; height:56px; padding:0; border-radius:50%;
    display:grid; place-items:center; line-height:1;
    background:color-mix(in oklab, var(--tc) 16%, transparent);
    box-shadow:inset 0 0 0 2px color-mix(in oklab, var(--tc) 62%, transparent)}
  .animal-mark{display:block; font-size:26px; color:var(--tc)}
  .animal-mark svg{display:block; width:1em; height:1em}
  .animal-edit{position:absolute; right:-2px; bottom:-2px; width:20px; height:20px; padding:4px;
    border-radius:50%; background:var(--tc); fill:none; stroke:var(--on-accent); stroke-width:2.4;
    stroke-linejoin:round}
  .animal-btn:active{background:color-mix(in oklab, var(--tc) 28%, transparent)}

  /* 選隊色面板 */
  .sheet-wrap{position:fixed; inset:0; z-index:70; display:none; place-items:end center;
    background:var(--sheet-veil); padding:0 16px calc(16px + env(safe-area-inset-bottom))}
  .sheet-wrap.on{display:grid}
  .sheet-card{width:min(560px,100%); background:var(--surface); border-radius:var(--r-xl);
    padding:20px; display:flex; flex-direction:column; gap:16px}
  .sheet-title{font-size:17px; font-weight:600; color:var(--ink-2)}
  .animal-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
  .animal-opt{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 6px; border-radius:var(--r-md);
    background:color-mix(in oklab, var(--tc) 12%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--tc) 34%, transparent)}
  .animal-opt.on{box-shadow:inset 0 0 0 2.5px var(--tc)}
  .animal-opt.on::after{content:"✓"; position:absolute; top:6px; right:9px; font-size:13px;
    font-weight:700; color:var(--tc)}
  .animal-opt.taken{background:var(--fill); cursor:not-allowed;
    box-shadow:inset 0 0 0 1px var(--sep)}
  .animal-opt.taken .opt-mark,.animal-opt.taken .opt-name{opacity:.42}
  .animal-opt .opt-taken{font-size:11px; font-weight:600; color:var(--ink-2); line-height:1.2}
  .animal-opt .opt-mark{font-size:26px; line-height:1; color:var(--tc)}
  .animal-opt .opt-mark svg{display:block; width:1em; height:1em}
  .animal-opt .opt-name{font-size:13px; font-weight:600; color:var(--ink)}
  .sheet-cancel{min-height:48px; border-radius:var(--r-md); background:var(--fill); color:var(--ink);
    font-size:17px; font-weight:600}

  .bigcount .unit{font-size:clamp(22px,3.2vh,32px); font-weight:600; color:var(--ink-2); margin-left:10px}

  .setup-foot{display:flex; flex-direction:column; align-items:center; gap:12px; padding:12px 0 8px}
  .setup-foot .btn-primary{min-width:260px; min-height:56px; font-size:19px; border-radius:var(--pill)}

  /* 開始遊戲：舞台幕 */
  .launch{position:fixed; inset:0; z-index:80; pointer-events:none; overflow:hidden}
  .curtain{position:absolute; left:0; right:0; height:50.4%;
    transition:transform .46s cubic-bezier(.62,0,.38,1)}
  .curtain.top{top:0; background:var(--blue-fill)}
  .curtain.bot{bottom:0; background:var(--blue-fill)}
  .js .curtain.top{transform:translateY(-100%)}
  .js .curtain.bot{transform:translateY(100%)}
  .js .launch.closed{pointer-events:auto}
  .js .launch.closed .curtain.top,
  .js .launch.closed .curtain.bot,
  .js .gate.closed .curtain.top,
  .js .gate.closed .curtain.bot{transform:none}

  .vs{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    gap:clamp(10px,1.6vw,26px); padding:0 clamp(24px,4vw,64px); color:var(--on-accent);
    pointer-events:none; transition:opacity .26s var(--ease), transform .44s var(--ease)}
  .js .vs{opacity:0; transform:scale(.97)}
  .js .launch.show .vs{opacity:1; transform:none}
  .js .launch.hide .vs{opacity:0; transform:scale(1.02); transition-duration:.2s}

  .vs-team{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center;
    gap:clamp(8px,1.4vh,16px); text-align:center}
  .vs-mark{font-size:var(--mark,72px); line-height:1; display:block; filter:drop-shadow(0 2px 6px var(--vs-shadow))}
  .vs-label{font-family:var(--font-display); font-weight:700; font-size:var(--label,40px);
    letter-spacing:-.02em; line-height:1.15;
    overflow-wrap:anywhere; text-wrap:balance}
  .vs-mark svg{display:block; width:1em; height:1em}
  .vs-team::after{content:""; display:block; width:28px; height:3px; border-radius:2px;
    background:var(--tc,var(--on-accent)); opacity:.9}

  body.is-launch .stage{opacity:0; transform:translateY(-28px) scale(.97);
    transition:opacity .38s var(--ease), transform .48s var(--ease)}
  body.is-launch .setup-foot{opacity:0; transform:translateY(18px); transition:opacity .3s, transform .38s var(--ease)}
  body.is-launch .setup-top{opacity:0; transition:opacity .24s}

  /* stepper：圓掣（第一步／舊版） */
  .round-btn{width:clamp(56px,7vh,72px); height:clamp(56px,7vh,72px); border-radius:50%;
    background:var(--fill); color:var(--ink); font-size:clamp(24px,3.2vh,32px); font-weight:400;
    display:grid; place-items:center; line-height:1}
  .round-btn:active{background:var(--fill-2)}
  .round-btn:disabled{background:var(--fill-3); color:var(--ink-3); cursor:not-allowed; transform:none}

  /* 秒數 chips（第三步） */
  .chips{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
  .chips button{min-height:48px; padding:0 26px; border-radius:var(--pill); background:var(--fill);
    color:var(--ink); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
  .chips button[aria-pressed="true"]{background:var(--blue); color:var(--on-accent)}

  /* inputs */
  input,textarea,select{font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--fill); border:0; border-radius:var(--r-md); padding:11px 14px; min-height:48px; width:100%}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
    outline:2px solid var(--focus-ring); outline-offset:3px}


  .qcount .unit{font-size:15px; font-weight:500; color:var(--ink-2); letter-spacing:0}
  .qedit:active{background:var(--fill-2)}

  /* ---------- buttons ---------- */
  button{font-family:inherit; font-size:17px; font-weight:500; color:var(--ink); background:transparent;
    border:0; border-radius:var(--r-md); padding:12px 18px; min-height:44px; cursor:pointer;
    transition:background-color var(--dur) var(--ease), transform var(--dur) var(--ease), opacity var(--dur)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.35; cursor:not-allowed; transform:none}
  .btn-primary{background:var(--blue-fill); color:var(--on-accent); font-weight:600}
  .btn-primary:active{background:var(--blue-fill-press)}
  .btn-quiet:active{background:var(--fill-2)}
  .btn-big{width:100%; padding:17px 18px; font-size:19px; font-weight:600}


  /* ---------- play ---------- */
  body[data-view="play"]{background:var(--surface)}
  #v-play{position:relative; height:100dvh; overflow:hidden; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 0 0}
  body[data-view="play"]{overflow:hidden}
  body[data-view="play"] .wrap{padding:0; max-width:none}
  #v-play.active{display:flex}

  .flash-top{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left))}
  .icon-btn{width:44px; height:44px; padding:0; display:grid; place-items:center; border-radius:50%;
    background:var(--fill); color:var(--ink)}
  .icon-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .icon-btn:active{background:var(--fill-2)}

  .turn-chip{display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 16px 0 10px;
    border-radius:var(--pill); background:color-mix(in oklab, var(--tc,var(--ink-2)) 14%, transparent);
    color:var(--ink); max-width:46vw}
  .turn-mark{display:grid; place-items:center; font-size:22px; color:var(--tc); flex:0 0 auto}
  .turn-mark svg{display:block; width:1em; height:1em}
  .turn-name{font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .icon-btn .i-back{display:none}
  .icon-btn[data-mode="back"] .i-exit{display:none}
  .icon-btn[data-mode="back"] .i-back{display:block}

  .ring{position:relative; width:64px; height:64px; padding:0; display:grid; place-items:center;
    border:0; border-radius:50%; background:transparent; color:var(--ink)}
  .ring svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
  .ring-track{fill:none; stroke:var(--fill-2); stroke-width:3}
  .ring-prog{fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:100.5; stroke-dashoffset:0; transition:stroke-dashoffset .25s linear}
  .ring.warn .ring-prog{stroke:var(--amber)}
  .ring.dead .ring-prog{stroke:var(--red)}
  .ring.paused .ring-prog{stroke:var(--ink-3)}
  .clock{font-family:var(--font-display); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;
    letter-spacing:-.01em}
  .clock.warn{color:var(--amber)}
  .clock.dead{color:var(--red)}

  #stage{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;
    padding:0 max(40px,env(safe-area-inset-right)) 0 max(40px,env(safe-area-inset-left))}
  .card-word{font-family:var(--font-display); font-weight:700; letter-spacing:-.03em; line-height:1.02;
    text-align:center; text-wrap:balance; word-break:break-word; max-width:100%;
    font-size:clamp(64px,21vh,200px); animation:wordIn var(--dur) var(--ease)}
  @keyframes wordIn{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}
  .question.fx-ok{animation:fxOk .32s var(--ease)}
  .question.fx-skip{animation:fxSkip .28s var(--ease)}
  .question.fx-bad{animation:fxBad .46s var(--ease)}
  @keyframes fxOk{0%{background:transparent} 40%{background:var(--flash-ok)} 100%{background:transparent}}
  @keyframes fxSkip{0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
  @keyframes fxBad{
    0%{background:transparent; transform:translateX(0)}
    18%{background:var(--flash-bad); transform:translateX(-9px)}
    46%{background:var(--flash-bad); transform:translateX(9px)}
    72%{background:color-mix(in oklab, var(--flash-bad) 55%, transparent); transform:translateX(-4px)}
    100%{background:transparent; transform:translateX(0)}
  }
  .fx-score{position:absolute; left:50%; top:12%; transform:translateX(-50%);
    font-family:var(--font-display); font-size:clamp(76px,13vh,132px); font-weight:700;
    letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums;
    pointer-events:none; animation:fxScore .85s var(--ease) forwards}
  .fx-score.plus{color:var(--green)}
  .fx-score.minus{color:var(--red)}
  @keyframes fxScore{
    0%{opacity:0; translate:0 12px; scale:.86}
    22%{opacity:1; translate:0 0; scale:1.06}
    36%{scale:1}
    100%{opacity:0; translate:0 -64px; scale:1}
  }

  .flash-hud{display:grid; grid-template-columns:1fr auto 1fr; gap:clamp(8px,1.6vw,16px); align-items:center;
    padding:12px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  .flash-hud .key{display:inline-flex; align-items:center; justify-content:center; gap:12px;
    width:clamp(104px,22vw,180px); height:clamp(62px,9.2vh,80px); border-radius:var(--r-lg);
    font-size:clamp(18px,2.4vh,21px); font-weight:600;
    transition:transform var(--dur) var(--ease), background-color var(--dur), color var(--dur)}
  .flash-hud .key::before,
  .flash-hud .key::after{display:inline-grid; place-items:center; min-width:30px; height:30px;
    padding:0 8px; border-radius:8px; font-family:var(--font-mono); font-size:16px; line-height:1;
    background:color-mix(in oklab, currentColor 14%, transparent); opacity:.9}
  .flash-hud .key-foul::before{content:"←"}
  .flash-hud .key-pass::before{content:"↓"}
  .flash-hud .key-ok::after{content:"→"}
  .flash-hud .key-foul{justify-self:start; background:var(--fill); color:var(--ink)}
  .flash-hud .key-foul:active{background:var(--fill-2)}
  .flash-hud .key-pass{justify-self:center; background:var(--fill); color:var(--ink)}
  .flash-hud .key-pass:active{background:var(--fill-2)}
  .flash-hud.bad-foul .key-foul,
  .flash-hud.bad-pass .key-pass{background:color-mix(in oklab, var(--red) 13%, var(--fill)); color:var(--red)}
  .flash-hud.bad-foul .key-foul:active,
  .flash-hud.bad-pass .key-pass:active{background:color-mix(in oklab, var(--red) 22%, var(--fill))}
  .flash-hud.bad-foul .key-foul::before,
  .flash-hud.bad-pass .key-pass::before{background:color-mix(in oklab, var(--red) 18%, transparent)}
  .flash-hud.no-skip .key-pass{display:none}
  .flash-hud.no-skip{grid-template-columns:1fr 1fr}
  .flash-hud .key-ok{justify-self:end; background:var(--blue-fill); color:var(--on-accent)}
  .flash-hud .key-ok:active{background:var(--blue-fill-press)}
  .flash-hud .key-ok::after{background:color-mix(in oklab, var(--on-accent) 24%, transparent)}


  /* ---------- ready ---------- */
  .ready{position:fixed; inset:0; z-index:60; display:none; background:var(--surface)}
  .ready[style*="flex"]{display:flex}
  .readyCard{width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:clamp(24px,6vh,56px) clamp(20px,4vw,48px); gap:6px}
  .readyRound{font-size:15px; color:var(--ink-2); letter-spacing:.02em}
  .readyMark{font-size:clamp(54px,10vh,104px); line-height:1; color:var(--tc); margin-bottom:6px}
  .readyMark svg{display:block; width:1em; height:1em; margin:0 auto}
  .readyTeam{font-family:var(--font-display); font-weight:700; font-size:clamp(52px,13vh,140px);
    letter-spacing:-.03em; line-height:1.02; margin:10px 0 16px}
  .readyScores{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:clamp(20px,3.4vh,32px)}
  .readyScores .score-tile{display:flex; flex-direction:column; align-items:center; gap:2px;
    min-width:96px; padding:10px 14px; border-radius:var(--r-md);
    background:var(--fill); box-shadow:inset 0 0 0 1px var(--sep)}
  .readyScores .score-tile.cur{background:color-mix(in oklab, var(--tc) 18%, var(--surface));
    box-shadow:inset 0 0 0 2.5px var(--tc)}
  .readyScores .pill-mark{display:block; width:22px; height:22px; font-size:22px; color:var(--tc)}
  .readyScores .pill-mark svg{display:block; width:1em; height:1em}
  .readyScores .score-name{font-size:13px; font-weight:600; color:var(--ink);
    max-width:12ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .readyScores b{font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums}
  .readyCard button{margin-top:clamp(24px,4vh,36px); min-height:56px; padding:0 40px;
    background:var(--blue-fill); color:var(--on-accent); font-size:19px; font-weight:600; border-radius:var(--r-lg)}
  #btnReady::after{content:"→"; display:inline-grid; place-items:center; min-width:30px; height:30px;
    margin-left:12px; padding:0 8px; border-radius:8px;
    background:color-mix(in oklab, currentColor 14%, transparent); color:inherit;
    font-family:var(--font-mono); font-size:17px; line-height:1; vertical-align:2px; opacity:.85}
  /* ---------- 倒數（獨立過場動畫） ---------- */
  .countdown{position:fixed; inset:0; z-index:70; display:none; place-items:center;
    background:var(--surface); overflow:hidden}
  .countdown.on{display:grid}
  .countdown::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(58% 58% at 50% 50%,
      color-mix(in oklab, var(--tc, var(--blue)) 15%, transparent), transparent 72%)}
  .cd-inner{position:relative; display:grid; place-items:center; gap:clamp(10px,1.8vh,18px)}
  .cd-dial{position:relative; display:grid; place-items:center;
    width:clamp(216px,33vh,312px); height:clamp(216px,33vh,312px)}
  .cd-dial svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
  .cd-track{fill:none; stroke-width:4; stroke:color-mix(in oklab, var(--tc, var(--blue)) 16%, transparent)}
  .cd-prog{fill:none; stroke-width:4; stroke-linecap:round; stroke:var(--tc, var(--blue));
    stroke-dasharray:339.3; stroke-dashoffset:0; transition:stroke-dashoffset 1s linear}
  .cd-num{font-family:var(--font-display); font-weight:700; color:var(--ink);
    font-size:clamp(92px,19vh,184px); line-height:1; letter-spacing:-.04em;
    font-variant-numeric:tabular-nums}
  .cd-num.word{font-size:clamp(38px,8vh,72px); letter-spacing:.02em; text-align:center}
  .cd-num.beat{animation:cdBeat .55s var(--ease)}
  @keyframes cdBeat{0%{transform:scale(1.24); opacity:.3} 100%{transform:scale(1); opacity:1}}
  .cd-team{display:flex; align-items:center; gap:12px; font-weight:600;
    font-family:var(--font-display); letter-spacing:-.01em;
    font-size:clamp(22px,3.2vh,32px); color:var(--tc, var(--blue))}
  .cd-team .cd-mark{font-size:1.15em; line-height:1}
  .cd-team .cd-mark svg{display:block; width:1em; height:1em}

  /* ---------- 落閘（重用開場幕布） ---------- */
  .gate{position:fixed; inset:0; z-index:75; display:none; overflow:hidden; pointer-events:none}
  .gate.on{display:block}
  .gate-body{position:absolute; inset:0; display:grid; place-items:center;
    color:var(--on-accent); opacity:0; transition:opacity .22s var(--ease)}
  .js .gate-body{opacity:0}
  .gate.text .gate-body{opacity:1}
  .gate.settle{pointer-events:auto}
  .gate.opening .gate-body{opacity:0; transition:none}
  .js .gate.opening .te-card{opacity:0; transform:translateY(-12%) scale(.985);
    transition:opacity .16s var(--ease), transform .3s var(--ease)}   /* 跟住開幕一齊滑走 */
  .gate-hit{position:absolute; text-align:center; font-family:var(--font-display);
    font-weight:700; font-size:clamp(44px,8.4vh,88px); letter-spacing:-.02em;
    transition:opacity .26s var(--ease), transform .3s var(--ease)}
  .js .gate.settle .gate-hit{opacity:0; transform:scale(1.05)}

  .te-card{display:grid; justify-items:center; gap:clamp(6px,1.2vh,12px); text-align:center;
    padding:clamp(20px,4vh,40px) clamp(24px,4vw,56px); color:var(--on-accent);
    transition:opacity .3s var(--ease), transform .34s var(--ease)}
  .js .te-card{opacity:0; transform:scale(.97)}
  .gate.settle .te-card{opacity:1; transform:none}
  @keyframes teCard{from{transform:scale(.965)} to{transform:scale(1)}}
  .te-mark{font-size:clamp(60px,10.4vh,96px); line-height:1; color:var(--on-accent)}
  .te-mark svg{display:block; width:1em; height:1em}
  .te-name{font-family:var(--font-display); font-weight:700; font-size:clamp(38px,7.6vh,68px);
    letter-spacing:-.03em; line-height:1.06; color:var(--on-accent)}
  .te-stats{display:flex; gap:20px; font-size:clamp(15px,2vh,18px);
    color:color-mix(in oklab, var(--on-accent) 74%, transparent);
    font-variant-numeric:tabular-nums; letter-spacing:.01em}
  .te-stats b{color:var(--on-accent); font-weight:600}
  .te-score{font-family:var(--font-display); font-weight:700; color:var(--on-accent);
    font-size:clamp(60px,12vh,112px); line-height:1; letter-spacing:-.04em;
    margin-top:clamp(2px,.4vh,4px); font-variant-numeric:tabular-nums}
  .te-score em{font-style:normal; font-size:.32em; font-weight:600;
    color:color-mix(in oklab, var(--on-accent) 74%, transparent);
    margin-left:10px; letter-spacing:0}
  .te-score.zero{color:color-mix(in oklab, var(--on-accent) 46%, transparent)}
  .te-next{margin-top:clamp(22px,3.6vh,36px); min-height:56px; padding:0 34px;
    display:inline-flex; align-items:center; gap:12px;
    background:var(--on-accent); color:var(--blue); font-size:19px; font-weight:600;
    border-radius:var(--r-lg)}
  .te-next:active{background:color-mix(in oklab, var(--on-accent) 84%, var(--blue))}
  .te-next::after{content:"→"; display:inline-grid; place-items:center; min-width:30px; height:30px;
    padding:0 8px; border-radius:8px; font-family:var(--font-mono); font-size:16px; line-height:1;
    background:color-mix(in oklab, var(--blue) 16%, transparent); opacity:1}

  /* ---------- result：逐格揭榜 ---------- */
  #v-result{position:relative; overflow:hidden}
  #v-result.active{display:flex; flex-direction:column; justify-content:center;
    min-height:calc(100dvh - 56px)}
  .res-head{position:relative; z-index:3; text-align:center;
    margin:0 0 clamp(16px,2.6vh,28px)}
  #v-result h1{margin:0; font-size:clamp(30px,4.8vh,44px)}
  #rSub{margin:8px 0 0; font-size:15px}

  .confetti{position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; display:none}
  .confetti.on{display:block}
  .confetti i{position:absolute; top:-24px; width:8px; height:13px; border-radius:2px;
    animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite}

  .rank{position:relative; z-index:2; display:flex; flex-direction:column; gap:2px}
  .rk{position:relative; padding:10px 14px; border-radius:14px;
    transition:opacity .26s var(--ease), transform .34s var(--ease),
               background .34s var(--ease), padding .34s var(--ease), border-radius .34s var(--ease)}
  .js .rk{opacity:0; transform:translateY(16px) scale(.985)}
  .js .rk.in{opacity:1; transform:none}
  .rk.charging{opacity:1; transform:none}

  /* 卡片反轉：正面問號、背面冠軍 */
  .flip{position:relative; transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.3,.82,.2,1)}
  .face{backface-visibility:hidden; -webkit-backface-visibility:hidden}
  .face.back{display:grid; grid-template-columns:26px 44px minmax(0,1fr) auto;
    align-items:center; gap:12px}
  .face.front{position:absolute; inset:0; display:none}
  .rk.is-champ{perspective:1200px}
  .rk.is-champ .face.back{transform:rotateY(180deg)}
  .rk.charging .face.front{display:block}
  .rk.charging .face.back{opacity:0}
  .rk.flipped .flip{transform:rotateY(180deg)}

  .front-card{position:absolute; inset:0; border-radius:22px; background:var(--surface);
    box-shadow:inset 0 0 0 1px var(--sep), 0 10px 24px var(--vs-shadow);
    display:grid; place-items:center; overflow:hidden;
    animation:shiver .12s steps(2,end) infinite; --amp:1}
  .front-card::after{content:"?"; font-size:clamp(28px,4.6vh,38px); font-weight:700; color:var(--ink-2);
    animation:qBreathe 1.4s ease-in-out infinite}
  .front-card::before{content:""; position:absolute; inset:0; border-radius:22px;
    box-shadow:0 0 0 1px color-mix(in oklab, var(--blue) 35%, transparent);
    animation:ringPulse 1.6s ease-out infinite}

  .rk .no{font-size:15px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .rk-tile{width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
    background:color-mix(in oklab, var(--tc) 14%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--tc) 34%, transparent); flex:0 0 auto}
  .rk-tile .rk-mark{display:block; font-size:24px; line-height:1; color:var(--tc)}
  .rk-mark svg{display:block; width:1em; height:1em}
  .rk .nm{font-size:17px; font-weight:500; line-height:1.2}
  .rk .st{font-size:14px; color:var(--ink-2); margin-top:2px}
  .rk .pt{font-family:var(--font-display); font-size:22px; font-weight:600;
    font-variant-numeric:tabular-nums; transition:font-size .34s var(--ease), color .34s var(--ease)}
  .rk .crown{display:none}

  /* 冠軍卡：內容居中、皇冠做成角標 */
  .rk.is-champ{background:var(--surface); margin:20px auto 8px; width:min(560px, 82%);
    padding:26px 26px 18px;
    border-radius:22px; box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--tc) 20%, transparent)}
  .rk.is-champ .face.back{display:flex; align-items:center; justify-content:space-between;
    gap:clamp(14px,3vw,30px)}
  .rk.is-champ .no{display:none}
  .rk.is-champ::before{content:""; position:absolute; inset:-28px -12px; border-radius:34px; z-index:-1;
    background:radial-gradient(58% 70% at 50% 50%, color-mix(in oklab, var(--tc) 30%, transparent), transparent 72%);
    filter:blur(16px); animation:champGlow 2.8s ease-in-out infinite}
  .rk.is-champ .crown{position:absolute; top:-13px; left:50%; transform:translateX(-50%); display:inline-flex;
    align-items:center; gap:6px; padding:5px 13px 5px 11px; border-radius:var(--pill);
    background:var(--tc); font-size:13px; font-weight:600; color:var(--on-accent);
    box-shadow:0 3px 12px color-mix(in oklab, var(--tc) 45%, transparent)}
  .rk.is-champ .crown svg{width:15px; height:15px; fill:currentColor;
    animation:crownBob 2.6s ease-in-out infinite}
  .rk.is-champ .rk-tile{border-radius:16px}
  .rk.is-champ .rk-tile .rk-mark{font-size:34px; animation:sway 2.8s ease-in-out infinite}
  .rk.is-champ .nm{font-family:var(--font-display); font-size:clamp(24px,4.4vh,34px);
    font-weight:700; letter-spacing:-.02em; text-align:left; max-width:min(46vw,420px)}
  .rk.is-champ .st{font-size:15px}
  .rk.is-champ .pt{font-size:clamp(32px,5.4vh,46px); color:var(--tc)}
  .rank.compact .rk.is-champ{padding:10px 14px}
  .rank.compact .rk.is-champ .st{display:none}
  .rank.compact .rk.is-champ .nm{font-size:clamp(20px,3.4vh,26px)}
  .rank.compact .rk.is-champ .pt{font-size:clamp(24px,4vh,32px)}

  .rk.is-champ.charging{background:transparent; box-shadow:none}
  .rk.is-champ.charging::before{display:none}

  @keyframes crownBob{0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-2px) rotate(2deg)}}
  @keyframes ringPulse{0%{opacity:.85; transform:scale(1)} 70%,100%{opacity:0; transform:scale(1.3)}}
  @keyframes qBreathe{0%,100%{opacity:.4; transform:scale(.92)} 50%{opacity:.95; transform:scale(1.08)}}
  @keyframes shiver{
    0%{transform:translate(0,0) rotate(0)}
    20%{transform:translate(calc(-2px * var(--amp)),calc(1px * var(--amp))) rotate(-.5deg)}
    40%{transform:translate(calc(2px * var(--amp)),calc(-1px * var(--amp))) rotate(.5deg)}
    60%{transform:translate(calc(-1px * var(--amp)),calc(-2px * var(--amp))) rotate(-.4deg)}
    80%{transform:translate(calc(1px * var(--amp)),calc(2px * var(--amp))) rotate(.4deg)}
    100%{transform:translate(0,0) rotate(0)}
  }

  .rules{display:flex; flex-direction:column; gap:2px; margin-top:8px}
  .rule{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px;
    padding:14px 4px; border-bottom:var(--hair) solid var(--sep)}
  .rule:last-child{border-bottom:0}
  .rule.off{opacity:.38}
  .rule-txt b{display:block; font-size:17px; font-weight:600}
  .rule-txt span{display:block; font-size:14px; color:var(--ink-2); margin-top:2px}
  .switch{position:relative; width:42px; height:24px; min-height:0; padding:0; border-radius:var(--pill);
    border:0; background:var(--fill-2); cursor:pointer; transition:background-color .22s var(--ease)}
  .switch::before{content:""; position:absolute; inset:-10px -6px; border-radius:var(--pill)}
  .switch i{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--surface); box-shadow:0 1px 2px var(--vs-shadow);
    transition:transform .22s var(--ease)}
  .switch[aria-checked="true"]{background:var(--blue)}
  .switch[aria-checked="true"] i{transform:translateX(18px)}
  .switch:disabled{cursor:default}

  .result-actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;
    opacity:0; pointer-events:none; transition:opacity .45s var(--ease)}
  .result-actions.on{opacity:1; pointer-events:auto}
  .result-actions .btn-big{flex:1 1 100%; max-width:none; min-height:52px; padding:0 22px; font-size:17px}

  @keyframes fall{from{transform:translate3d(0,0,0) rotate(0)}
    to{transform:translate3d(var(--dx,0px),108vh,0) rotate(var(--rot,540deg))}}
  @keyframes champGlow{0%,100%{opacity:.5; transform:scale(.97)} 50%{opacity:1; transform:scale(1.04)}}
  @keyframes sway{0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)}}

/* ---------- toast ---------- */
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:90;
    transform:translate(-50%,10px); opacity:0; pointer-events:none;
    background:var(--toast-bg);
    color:var(--toast-ink); font-size:15px; padding:12px 18px; border-radius:var(--pill);
    transition:opacity var(--dur), transform var(--dur)}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  /* ---------- iPad / 分段 ---------- */
  @media (max-height:900px){
    #v-home .top{margin-bottom:16px}
    h1{font-size:30px}
  }
  @media (max-width:700px){
    .setup{gap:12px}
    .result-actions .btn-big{flex:1 1 100%}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
  }
</style>
</head>

  <section class="view" id="v-setup">
    <div class="setup-top">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>
      </button>

    <div class="stage" id="stepStage">
      <section class="sstep" data-step="0">
        <h2 class="sstep-title">有多少隊參賽？</h2>
        <div class="bignum">
          <button class="round-btn" id="teamMinus" aria-label="減少一隊">−</button>
          <input id="teamInput" type="number" inputmode="numeric" min="2" max="8" step="1" value="2" aria-label="隊伍數量">

        </div>
        <div class="sstep-hint">最少 2 隊，最多 8 隊</div>

      <section class="sstep" data-step="1">
        <h2 class="sstep-title">為每一隊命名</h2>
        <div class="namegrid" id="nameList"></div>
      </section>

      <section class="sstep" data-step="2">
        <h2 class="sstep-title">每回合時間</h2>
        <div class="bignum bignum-sec">
          <input id="secInput" type="number" min="5" max="600" step="5" aria-label="每回合秒數">
          <span class="bignum-unit">秒</span>
        </div>
        <div class="chips" id="secChips">
          <button type="button" data-sec="30">30</button>
          <button type="button" data-sec="60">60</button>
          <button type="button" data-sec="90">90</button>
          <button type="button" data-sec="120">120</button>

      </section>

      <section class="sstep" data-step="3">

        <div class="rules">
          <div class="rule" id="ruleSkip">

            <button class="switch" id="swSkip" role="switch" aria-checked="true" aria-label="可以跳過"><i></i></button>
          </div>
          <div class="rule" id="ruleSkipPen">
            <div class="rule-txt"><b>跳過扣 1 分</b><span>每跳過一題，該隊扣一分</span></div>
            <button class="switch" id="swSkipPen" role="switch" aria-checked="false" aria-label="跳過扣分"><i></i></button>
          </div>
          <div class="rule" id="ruleFoulPen">
            <div class="rule-txt"><b>犯規扣 1 分</b><span>每犯規一次，該隊扣一分</span></div>
            <button class="switch" id="swFoulPen" role="switch" aria-checked="false" aria-label="犯規扣分"><i></i></button>
          </div>
        </div>
      </section>

    </div>

/* 隊伍動物：名稱、圖示、顏色三者綁定；改動物＝改色，但唔會覆蓋自己改過嘅隊名 */
const ANIMALS = [
  { id:"turtle", name:"烏龜隊", color:"#34C759" },
  { id:"fox", name:"狐狸隊", color:"#FF9500" },
  { id:"whale", name:"鯨魚隊", color:"#0071E3" },
  { id:"octopus", name:"章魚隊", color:"#AF52DE" },
  { id:"bee", name:"蜜蜂隊", color:"#F5A300" },
  { id:"flamingo", name:"火烈鳥隊", color:"#FF2D55" },
  { id:"dolphin", name:"海豚隊", color:"#30B0C7" },
  { id:"bear", name:"棕熊隊", color:"#A2845E" }
];
const animalById = id => ANIMALS.find(a=>a.id===id) || ANIMALS[0];
const animalAt = i => animalById((cfg.animals && cfg.animals[i]) || ANIMALS[i % ANIMALS.length].id);
const teamName = i => (cfg.custom && cfg.custom[i] && cfg.names[i])
  ? cfg.names[i] : animalAt(i).name;

let cfg  = Object.assign({
  teams:2,
  names:ANIMALS.slice(0,8).map(a=>a.name),
  animals:ANIMALS.map(a=>a.id),
  sec:60,
  allowSkip:true,      // 可否跳過
  skipPenalty:false,   // 跳過扣 1 分
  foulPenalty:false    // 犯規扣 1 分
}, store.get(K_CFG, {}));
cfg.allowSkip = cfg.allowSkip !== false;
cfg.skipPenalty = !!cfg.skipPenalty;
cfg.foulPenalty = !!cfg.foulPenalty;

cfg.teams = Math.max(2, Math.min(8, Math.round(+cfg.teams || 2)));
if(!Array.isArray(cfg.names)) cfg.names = ANIMALS.slice(0,8).map(a=>a.name);
if(!Array.isArray(cfg.animals)) cfg.animals = [];
if(!Array.isArray(cfg.custom)) cfg.custom = [];
ANIMALS.forEach((a,i)=>{ if(!cfg.animals[i]) cfg.animals[i] = a.id; });

/* 動物不可重複：只計現役隊伍；未上場嘅槽位自動補位 */
function ensureUniqueAnimals(){
  const used = new Set();
  for(let i=0;i<cfg.teams;i++){
    let id = cfg.animals[i];
    if(!id || used.has(id)) id = ANIMALS.find(a=>!used.has(a.id)).id;
    cfg.animals[i] = id; used.add(id);
  }
  for(let i=cfg.teams;i<ANIMALS.length;i++){
    if(!cfg.animals[i] || used.has(cfg.animals[i])) cfg.animals[i] = ANIMALS.find(a=>!used.has(a.id)).id;
    used.add(cfg.animals[i]);
  }
}
ensureUniqueAnimals();

let G = null;
let REMOTE = { ok:false };

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 題目一律以 {t:"..."} 存；舊格式（字串 / {t,ban}）都食得住 */
function parseText(raw){
  const seen = new Set();
  return String(raw || "").split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"))
    .filter(l => {
      const k = l.replace(/\s+/g,"").toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    })
    .map(l => l.slice(0,60));
}
function saveCfg(){ store.set(K_CFG, cfg); }

function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("active", v.id===id));
  document.body.dataset.view = id.replace(/^v-/, "");
  window.scrollTo(0,0);
}
let toastT=null;
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"), 1800);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= 後端 ================= */
async function pullText(){
  try{
    const r = await fetch("/api/text", {cache:"no-store"});
    if(!r.ok) throw new Error("bad status");
    const d = await r.json();
    lines = parseText(d.text);
    REMOTE.ok = true;
    renderHome();
  }catch(e){ REMOTE.ok = false; renderHome(); }
}

/* ================= VFX ================= */
function fxOk(){
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip"); void q.offsetWidth; q.classList.add("fx-ok");
}

/* +1 / −1 分數浮字 */
function fxScore(delta){
  const q = document.querySelector(".question"); if(!q) return;
  const el = document.createElement("span");
  el.className = "fx-score " + (delta < 0 ? "minus" : "plus");
  el.textContent = (delta < 0 ? "−" : "+") + Math.abs(delta);
  q.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}
function fxMiss(bad){
  const q = document.querySelector(".question");
  q.classList.remove("fx-ok","fx-skip","fx-bad"); void q.offsetWidth;
  q.classList.add(bad ? "fx-bad" : "fx-skip");
}

/* 音效：WebAudio 直接合成，唔使音檔 */
let AC = null;
function audioCtx(){
  const C = window.AudioContext || window.webkitAudioContext;
  if(!C) return null;
  if(!AC) AC = new C();
  if(AC.state === "suspended") AC.resume();
  return AC;
}
/* 音檔：判定用真音源（門鐘／子彈），其餘場合仍用合成音 */
const SFX_SRC = { ding: "/sfx/dingdong.mp3", whoosh: "/sfx/whoosh.mp3",
                   countdown: "/sfx/countdown.mp3", whistle: "/sfx/whistle.mp3",
                   settle: "/sfx/settle.mp3", champion: "/sfx/champion.mp3",
                   tick: "/sfx/tick.mp3", drums: "/sfx/drums.mp3", snare: "/sfx/snare.mp3" };
const SFX = {};
let SFX_LOADING = false;
async function loadSfx(){
  const c = audioCtx(); if(!c || SFX_LOADING) return;
  SFX_LOADING = true;
  await Promise.all(Object.entries(SFX_SRC).map(async ([k, url])=>{
    try{
      const r = await fetch(url, {cache:"force-cache"});
      SFX[k] = await c.decodeAudioData(await r.arrayBuffer());
    }catch(e){ /* 音檔拿不到就靜靜留空，唔影響流程 */ }
  }));
}
function sfx(name, vol=0.85){
  const c = audioCtx(), buf = SFX[name];
  if(!c || !buf) return false;
  const src = c.createBufferSource(), g = c.createGain();
  src.buffer = buf; g.gain.value = vol;
  src.connect(g).connect(c.destination);
  src.start();
  return true;
}

/* 冠軍頁背景音樂：無縫 loop，離開結果頁／重開一局即停
   loop = true 之外再加一層保險：ended 即重新接上，
   並喺頁面返前景／context 被暫停時自動 resume，避免個別瀏覽器中斷 */
let BGM = null, BGM_WANT = null;
function bgm(name, vol=0.42){
  stopBgm();
  if(!SFX[name]) return;
  BGM_WANT = { name, vol };
  startBgm();
}
function startBgm(){
  if(!BGM_WANT) return;
  const c = audioCtx(), buf = SFX[BGM_WANT.name];
  if(!c || !buf) return;
  const src = c.createBufferSource(), g = c.createGain();
  src.buffer = buf; src.loop = true;
  src.loopStart = 0; src.loopEnd = buf.duration;
  g.gain.value = BGM_WANT.vol;
  src.connect(g).connect(c.destination);
  src.onended = ()=>{ if(BGM_WANT){ BGM = null; setTimeout(startBgm, 0); } };
  src.start();
  BGM = src;
}
function stopBgm(){
  const want = BGM_WANT; BGM_WANT = null;
  if(BGM){ try{ BGM.onended = null; BGM.stop(); }catch(e){} BGM = null; }
  return want;
}
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden || !BGM_WANT) return;
  const c = audioCtx();
  if(c && c.state === "suspended") c.resume();
  if(!BGM) startBgm();
});
document.addEventListener("pointerdown", loadSfx, {once:true});
document.addEventListener("keydown", loadSfx, {once:true});

/* 按「準備好」→ 獨立倒數過場（3、2、1、開始）→ 出題兼起錶 */
const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const CD_CIRC = 339.3;                 // 2πr，r = 54

function startRound(){
  if(!G || G.phase !== "ready") return;
  G.phase = "countdown";
  $("#btnReady").style.display = "none";
  const t = G.teams[G.turn];
  const box = $("#countdown"), num = $("#cdNum"), prog = $("#cdProg"), team = $("#cdTeam");
  box.style.setProperty("--tc", t.color);
  team.innerHTML = `<span class="cd-mark">${ICONS[t.id] || ""}</span><span>${esc(t.name)}</span>`;
  box.classList.add("on");
  const BEAT = REDUCE ? 700 : 1000;
  const paint = v => {
    num.textContent = v;
    num.classList.toggle("word", typeof v === "string");   // 文字（開始）用細字級，避免撐出圓圈
    num.classList.remove("beat"); void num.offsetWidth; num.classList.add("beat");
    prog.style.transition = "none";
    prog.style.strokeDashoffset = "0";
    void prog.getBoundingClientRect();          // 強制 reflow，令下面嘅 transition 真正生效
    prog.style.transition = `stroke-dashoffset ${BEAT}ms linear`;
    prog.style.strokeDashoffset = String(CD_CIRC);
  };
  let n = 3;
  paint(n);
  sfx("countdown", 0.9);        // 真實錄音：0／1／2 秒三響，3 秒 GO，同畫面每拍 1 秒對齊
  const tick = setInterval(()=>{
    n--;
    if(n > 0){ paint(n); }
    else if(n === 0){ paint("開始"); }
    else {
      clearInterval(tick);
      box.classList.remove("on");
      hideReady();
      beginRunning();
    }
  }, BEAT);
}

function beginRunning(){
  G.phase = "running";
  const t0 = G.teams[G.turn];
  G.base = { ok: t0.ok, skip: t0.skip, foul: t0.foul||0, score: t0.score };   // 回合起點，用嚟算本回合成績
  G.cur = drawItem();
  G.remaining = G.sec;
  startTimer();
  renderPlay();
}

function drawItem(){
  if(!G.pool.length){ G.pool = shuffle(G.used.slice()); G.used = []; toast("題目已用完，正在重新洗牌"); }
  const it = G.pool.pop();
  G.used.push(it);
  return it;
}

function startTimer(){
  clearInterval(G.timerId);
  if(!G.sec){ renderTimer(); return; }
  const token = ++G.timerToken;
  const id = setInterval(()=>{
    if(token !== G.timerToken){ clearInterval(id); return; }   // 舊局的計時器不得影響新局
    if(G.paused) return;
    G.remaining = Math.max(0, G.remaining - 0.1);
    renderTimer();
    const sec = Math.ceil(G.remaining);
    if(G.remaining<=0){ clearInterval(id); endTurn(); }
  },100);
  G.timerId = id;
}

const RING_LEN = 2 * Math.PI * 16;   // r=16（與邊框之間留出空隙）
function renderTimer(){
  const el=$("#pClock"), ring=$("#btnPause"), prog=$("#ringProg");
  if(!ring) return;
  el.textContent = G.paused ? "▶" : Math.ceil(G.remaining);
  const pct = Math.max(0, Math.min(1, G.remaining / G.sec));
  prog.style.strokeDashoffset = (RING_LEN * (1 - pct)).toFixed(1);
  ring.classList.toggle("warn", G.remaining <= 10 && G.remaining > 3);
  ring.classList.toggle("dead", G.remaining <= 3);
  ring.classList.toggle("paused", !!G.paused);
}

// 題目字自動撐滿字卡：優先單行（避免詞語被切開），字體過小時才容許斷行
function fitWord(text){
  const el=$("#pText"), card=el.parentElement;
  const boxW=card.clientWidth-36, boxH=card.clientHeight-72;
  if(boxW<=40 || boxH<=40) return;
  const fit = (oneLine)=>{
    el.style.whiteSpace = oneLine ? "nowrap" : "normal";
    el.style.wordBreak  = oneLine ? "keep-all" : "break-word";
    let lo=24, hi=Math.min(360, boxH);
    for(let i=0;i<9;i++){
      const mid=(lo+hi)/2;
      el.style.fontSize=mid+"px";
      const okW = oneLine ? el.scrollWidth<=boxW+1 : el.scrollWidth<=boxW+1;
      if(okW && el.scrollHeight<=boxH+1) lo=mid; else hi=mid;
    }
    el.style.fontSize=Math.floor(lo)+"px";
    return lo;
  };
  const one = fit(true);
  if(one < 64) fit(false);          // 一行太細 → 寧願斷行做大
}
addEventListener("resize", ()=>{ if(G && G.phase==="running") fitWord($("#pText").textContent); });

function renderPlay(){
  syncExitLabel();
  const chip = $("#turnChip");
  if(chip && G){
    const t = G.teams[G.turn];
    chip.style.setProperty("--tc", t.color);
    $("#turnMark").innerHTML = ICONS[t.id] || "";
    $("#turnName").textContent = t.name;
  }
  const it = G.cur || {t:"", deck:""};   // ready 階段未有題目
  $("#pText").textContent = it.t;
  fitWord(it.t);

  renderTimer();
}

function fmtScore(v){ return (v < 0 ? "−" : "+") + Math.abs(v); }

/* 統計文字：對 N · 跳過 M · 犯規 K（跳過關閉時不顯示） */
function statLine(t, bold){
  const b = v => bold ? `<b>${v}</b>` : `${v}`;
  const parts = [`對 ${b(t.ok)}`];
  if(!G || G.allowSkip) parts.push(`跳過 ${b(t.skip || 0)}`);
  parts.push(`犯規 ${b(t.foul || 0)}`);
  return parts.join(" · ");
}

function judge(kind){
  if(!G || G.phase !== "running" || !G.cur) return;
  if(kind === "skip" && !G.allowSkip) return;
  const t = G.teams[G.turn];
  let delta = 0;
  if(kind === "ok"){ t.ok++; delta = 1; fxOk(); sfx("ding"); }
  else if(kind === "skip"){ t.skip++; if(G.skipPenalty) delta = -1; fxMiss(G.skipPenalty); sfx("whoosh", 0.75); }
  else { t.foul++; if(G.foulPenalty) delta = -1; fxMiss(G.foulPenalty); sfx("snare", 0.45); }
  if(delta) fxScore(delta);
  t.score += delta;
  G.judged++;
  G.cur = drawItem();
  renderPlay();
}

let TE_FINISH = null, TE_TIMER = 0, TE_IV = 0;

function resetTurnTimers(){
  clearTimeout(TE_TIMER); clearInterval(TE_IV);
  TE_FINISH = null;
}

/* 硬重置：退出遊戲／返回設定時用，連幕都收走 */
function clearTurnEnd(){
  resetTurnTimers();
  const cd = $("#countdown"); if(cd) cd.classList.remove("on");
  const gate = $("#gate"); if(gate) gate.classList.remove("on","closed","text","settle","opening");
}

/* 落閘：重用開場幕布夾埋 → 「時間到！」 → 幕內結算 → 撳繼續才開幕 */
function slamGate(then){
  const gate = $("#gate");
  gate.classList.remove("closed","text","settle");
  gate.classList.add("on");
  void gate.offsetWidth;                        // 先讓 display 生效，過場才播得出
  gate.classList.add("closed");
  sfx("whistle", 0.85);                         // 球證哨：落閘即吹
  const HIT  = REDUCE ? 80  : 560;              // 幕合埋（0.46s）之後見字
  const CARD = REDUCE ? 300 : 1250;             // 停一停，轉結算卡
  setTimeout(()=>{ gate.classList.add("text"); }, HIT);
  setTimeout(()=>{ then(); gate.classList.add("settle"); }, CARD);
}

function showTurnEnd(team, stats, done){
  clearTimeout(TE_TIMER); clearInterval(TE_IV);
  TE_FINISH = done;
  const mark = $("#teMark"), name = $("#teName"), st = $("#teStats"), sc = $("#teScore");
  mark.innerHTML = ICONS[team.id] || "";
  name.textContent = team.name;
  st.innerHTML = statLine(stats, true);
  sc.classList.toggle("zero", stats.score === 0);
  const target = stats.score;
  if(target > 0 && !REDUCE){
    let v = 0;
    sc.innerHTML = `+0<em>分</em>`;
    const step = Math.max(1, Math.round(target / 5));
    TE_IV = setInterval(()=>{
      v = Math.min(target, v + step);
      sc.innerHTML = `+${v}<em>分</em>`;
      if(v >= target){ clearInterval(TE_IV); TE_IV = 0; }
    }, 95);
  } else {
    sc.innerHTML = `${fmtScore(target)}<em>分</em>`;
  }
  sfx("settle", 0.8);
}

function closeTurnEnd(){
  if(!TE_FINISH) return;
  const done = TE_FINISH;
  TE_FINISH = null;
  clearTimeout(TE_TIMER); clearInterval(TE_IV);
  const gate = $("#gate");
  gate.classList.add("opening");            // 結算內容即時收走，唔會留住半空
  gate.classList.remove("settle","text");
  void gate.offsetWidth;
  done();                                   // 喺後面砌好下一隊／結果頁
  gate.classList.remove("closed");           // 同一 frame 開幕，卡同時滑走
  setTimeout(()=>{ gate.classList.remove("on","opening"); }, REDUCE ? 40 : 500);
}

$("#teNext").onclick = ()=> closeTurnEnd();

function endTurn(){
  if(!G) return;
  if(G.phase === "ready"){ enterReady(); return; }   // 尚未開始即按下，視為重新整理
  if(G.phase === "interstitial") return;
  clearInterval(G.timerId);
  G.timerToken++;
  const team = G.teams[G.turn];
  const base = G.base || { ok:0, skip:0, foul:0, score:0 };
  const stats = { ok: team.ok - base.ok, skip: team.skip - base.skip,
                  foul: (team.foul||0) - (base.foul||0), score: team.score - base.score };
  G.phase = "interstitial";
  slamGate(()=>{
    showTurnEnd(team, stats, ()=>{
      G.turn++;
      if(G.turn >= G.teams.length){ endGame(); return; }
      enterReady();
    });
  });
}

function endGame(){
  if(!G) return;
  resetTurnTimers();
  clearInterval(G.timerId);
  G.timerToken++;
  G.phase = "done";
  hideReady();
  const sorted = G.teams.map((t,i)=>({...t,i})).sort((a,b)=> b.score-a.score || b.ok-a.ok);
  const total = G.teams.reduce((s,t)=>s+t.score,0);
  const okTotal = G.teams.reduce((s,t)=>s+t.ok,0);
  $("#rSub").textContent = `全場答對 ${okTotal} 題 · 總分 ${total}`;

  const topScore = sorted[0].score;
  const tied = sorted.filter(t=>t.score === topScore).length > 1;
  let rank = 0, prev = null;
  const ranked = sorted.map((t,i)=>{
    if(t.score !== prev){ rank = i + 1; prev = t.score; }
    return { ...t, rank };
  });

  const CROWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.4a1 1 0 0 1 1.6-.8L8.3 10.6 11.2 5a1 1 0 0 1 1.6 0l2.9 5.6 3.7-3a1 1 0 0 1 1.6.8v8.1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const champs = ranked.filter(t=>t.rank === 1).length;
  $("#rankList").classList.toggle("compact", champs >= 4);
  $("#rankList").innerHTML = ranked.map(t=>`
    <div class="rk" data-champ="${t.rank === 1 ? 1 : 0}" style="--tc:${t.color}">
      <div class="flip">
        <div class="face front"><div class="front-card"></div></div>
        <div class="face back">
          <div class="no">${t.rank}</div>
          <div class="rk-tile"><span class="rk-mark">${ICONS[t.id] || ""}</span></div>
          <div class="nm"><span class="crown">${CROWN}${tied && t.score === topScore ? "並列第一" : "冠軍"}</span>${esc(t.name)}
            <div class="st">${statLine(t, false)}</div>
          </div>
          <div class="pt" data-score="${t.score}">${t.score}</div>
        </div>
      </div>
    </div>`).join("");

  $("#confetti").innerHTML = "";
  $("#confetti").classList.remove("on");
  const acts = $("#v-result .result-actions");
  if(acts) acts.classList.remove("on");
  showView("v-result");
  startReveal(ranked);
}

/* ---------- 逐格揭榜 + 舞台聚光燈 ---------- */
let RES = null, DRUM = null;

function startReveal(ranked){
  const rows = [...document.querySelectorAll("#rankList .rk")];
  if(!rows.length) return;
  const champs = rows.filter(r=>r.dataset.champ === "1");
  RES = { rows, ranked, champs, timers: [], done: false };
  if(REDUCE){ finishReveal(); return; }
  champs.forEach(r=>{ r.querySelector(".pt").textContent = "0"; });

  const rest = rows.filter(r=>r.dataset.champ !== "1");
  const STEP = 700;
  let t = 420;                                   // 等幕布拉開
  for(let i = rest.length - 1; i >= 0; i--){     // 由最後一名開始，由下而上
    const row = rest[i];
    RES.timers.push(setTimeout(()=>{ row.classList.add("in"); sfx("tick", 0.5); }, t));
    t += STEP;
  }
  RES.timers.push(setTimeout(chargeBuild, t + 260));   // 留一拍，然後燈光亂掃
}

/* 冠軍：白卡「?」震動蓄力（鼓聲 build-up）→ 反轉成冠軍卡 */
const BUILD_MS = 2200, FLIP_MS = 620;

function chargeBuild(){
  if(!RES || RES.done) return;
  RES.champs.forEach(r=>r.classList.add("is-champ", "charging"));
  drumRoll(BUILD_MS / 1000);
  const cards = RES.champs.map(r=>r.querySelector(".front-card")).filter(Boolean);
  const ramps = [[0, 1, ".12s"], [700, 1.7, ".09s"], [1400, 2.4, ".07s"]];
  ramps.forEach(([ms, amp, dur])=>{
    RES.timers.push(setTimeout(()=>{
      cards.forEach(c=>{
        c.style.setProperty("--amp", amp);
        c.style.animationDuration = dur;
      });
    }, ms));
  });
  RES.timers.push(setTimeout(()=>{
    stopDrum();
    sfx("snare", 0.9);
    flipChamps();
  }, BUILD_MS));
}

/* 反轉揭曉 */
function flipChamps(){
  if(!RES || RES.done) return;
  RES.champs.forEach((row,i)=>{
    RES.timers.push(setTimeout(()=>{
      row.classList.add("flipped");
      sfx("whoosh", 0.45);
      RES.timers.push(setTimeout(()=>{
        row.classList.remove("charging");
        row.classList.add("in");
        const p = row.querySelector(".pt");
        if(p) countUp(p, +p.dataset.score);
        sfx("tick", 0.62);
      }, FLIP_MS - 60));
    }, i * 130));
  });
  burstConfetti();
  bgm("champion", 0.42);
  RES.timers.push(setTimeout(finishReveal, RES.champs.length * 130 + FLIP_MS + 900));
}

function finishReveal(){
  if(!RES || RES.done) return;
  RES.done = true;
  RES.timers.forEach(clearTimeout); RES.timers = [];
  stopDrum();
  RES.champs.forEach(row=>{
    row.classList.add("is-champ", "flipped", "in");
    row.classList.remove("charging");
    const p = row.querySelector(".pt");
    if(p) p.textContent = p.dataset.score;
  });
  RES.rows.forEach(r=>r.classList.add("in"));
  burstConfetti();
  bgm("champion", 0.42);
  const acts = $("#v-result .result-actions");
  if(acts) acts.classList.add("on");
}

function clearReveal(){
  stopDrum();
  if(!RES) return;
  RES.timers.forEach(clearTimeout);
  RES = null;
  const acts = $("#v-result .result-actions");
  if(acts) acts.classList.remove("on");
  const box = $("#confetti");
  if(box){ box.classList.remove("on"); box.innerHTML = ""; }
}

/* 密集鼓聲：越掃越急 */
function drumRoll(dur, from=0.86, to=1.30, vol=0.5){
  const c = audioCtx(), buf = SFX.drums;
  if(!c || !buf) return;
  stopDrum();
  const src = c.createBufferSource(), g = c.createGain();
  src.buffer = buf; src.loop = true;
  src.playbackRate.setValueAtTime(from, c.currentTime);
  src.playbackRate.linearRampToValueAtTime(to, c.currentTime + dur);
  g.gain.value = vol;
  src.connect(g).connect(c.destination);
  src.start();
  DRUM = src;
}
function stopDrum(){
  if(!DRUM) return;
  try{ DRUM.stop(); }catch(e){}
  DRUM = null;
}

function countUp(el, to, ms=800){
  if(REDUCE || !to){ el.textContent = to; return; }
  const t0 = performance.now();
  const step = now=>{
    const k = Math.min((now - t0) / ms, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function burstConfetti(){
  if(REDUCE || !RES) return;
  const box = $("#confetti"); if(!box) return;
  const colors = [...new Set(RES.ranked.map(t=>t.color))];
  box.innerHTML = Array.from({length:54}, (_,i)=>{
    const c = colors[i % colors.length];
    const left = Math.round(Math.random() * 94) + 2;
    const dx = Math.round((Math.random() - .5) * 120);
    const dur = (3 + Math.random() * 3).toFixed(2);
    const delay = (Math.random() * 3).toFixed(2);
    const rot = Math.round(360 + Math.random() * 720);
    const w = 6 + Math.round(Math.random() * 5);
    const hh = 10 + Math.round(Math.random() * 8);
    return `<i style="left:${left}%;width:${w}px;height:${hh}px;background:${c};--dx:${dx}px;--rot:${rot}deg;`
         + `animation-duration:${dur}s;animation-delay:-${delay}s"></i>`;
  }).join("");
  box.classList.add("on");
}

/* ================= 事件 ================= */
function setTeams(n){
  cfg.teams = Math.max(2, Math.min(8, Math.round(+n || 2)));
  ensureUniqueAnimals();
  saveCfg(); renderHome();
  const el = $("#teamInput");
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}
$("#teamInput").onchange = e=> setTeams(e.target.value);
$("#teamMinus").onclick = ()=> setTeams(cfg.teams - 1);
$("#teamPlus").onclick  = ()=> setTeams(cfg.teams + 1);
$("#secInput").onchange  = e=>{ cfg.sec=Math.max(5,Math.min(600,+e.target.value||60)); saveCfg(); renderSetup(); };
$$("#secChips button").forEach(b=>b.onclick = ()=>{
  cfg.sec = +b.dataset.sec; saveCfg(); renderSetup();
  const el = $("#secInput"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
});

$("#animalCancel").onclick = closeAnimals;
$("#animalSheet").onclick = e=>{ if(e.target.id === "animalSheet") closeAnimals(); };
$("#launch").onclick = ()=>{ if(SETUP.busy) skipLaunch(); };
$("#btnEnter").onclick = startSetup;
$("#btnStepBack").onclick = ()=>{
  if(SETUP.i === 0){ showView("v-home"); renderHome(); }
  else goStep(SETUP.i - 1, -1);
};
$("#btnNext").onclick = ()=>{ if(SETUP.i < 3) goStep(SETUP.i + 1, 1); else launchGame(); };

$$("[data-judge]").forEach(b=>b.onclick=()=>judge(b.dataset.judge));
$("#btnReady").onclick = startRound;

/* 規則開關 */
function syncRules(){
  $("#swSkip").setAttribute("aria-checked", String(cfg.allowSkip));
  $("#swSkipPen").setAttribute("aria-checked", String(cfg.skipPenalty));
  $("#swFoulPen").setAttribute("aria-checked", String(cfg.foulPenalty));
  const row = $("#ruleSkipPen");
  row.classList.toggle("off", !cfg.allowSkip);
  $("#swSkipPen").disabled = !cfg.allowSkip;
}
$("#swSkip").onclick = ()=>{
  cfg.allowSkip = !cfg.allowSkip;
  if(!cfg.allowSkip) cfg.skipPenalty = false;
  saveCfg(); syncRules();
};
$("#swSkipPen").onclick = ()=>{ if(!cfg.allowSkip) return; cfg.skipPenalty = !cfg.skipPenalty; saveCfg(); syncRules(); };
$("#swFoulPen").onclick = ()=>{ cfg.foulPenalty = !cfg.foulPenalty; saveCfg(); syncRules(); };
syncRules();
function isPristine(){
  return !!G && G.phase === "ready" && G.turn === 0 && !G.judged
    && G.teams.every(t=>t.score === 0 && !t.ok && !t.skip);
}
function backToSetup(){
  clearTurnEnd();
  clearInterval(G.timerId);
  G.timerToken++;
  G = null;
  $("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
  showView("v-setup");
  goStep(2, -1);
}

$("#btnExit").onclick = ()=>{
  stopBgm();
  if(!G) { showView("v-home"); renderHome(); return; }
  if(isPristine()){ backToSetup(); return; }   // 未開始過 → 上一步回設定
  if(!confirm("確定退出遊戲？本局成績將不會記錄。")) return;
  clearTurnEnd();
  clearInterval(G.timerId);
  G.timerToken++;
  G = null;
  document.querySelector("#readyOverlay").style.display = "none";
  document.body.classList.remove("is-ready");
  showView("v-home");
  renderHome();
};

function setPauseIcon(p){
  const b = $("#btnPause"); if(!b) return;
  b.setAttribute("aria-label", p ? "繼續" : "暫停");
  b.setAttribute("title", p ? "繼續（Esc）" : "暫停（Esc）");
  b.classList.toggle("paused", !!p);
  const el = $("#pClock");
  if(p){ el.textContent = "▶"; }
  else if(G) renderTimer();
}
$("#btnPause").onclick = ()=>{
  if(!G || G.phase!=="running") return;
  G.paused = !G.paused;
  setPauseIcon(G.paused);
  renderTimer();
};

$("#btnBackHome").onclick = ()=>{ stopBgm(); clearReveal(); showView("v-home"); renderHome(); };

/* 結果頁：右方向鍵＝跳到冠軍／返回主頁；點畫面亦可快轉 */
document.addEventListener("keydown", e=>{
  if(!$("#v-result").classList.contains("active")) return;
  if(e.key !== "ArrowRight") return;
  e.preventDefault();
  if(RES && !RES.done) finishReveal();
  else $("#btnBackHome").click();
});
$("#v-result").addEventListener("click", e=>{
  if(e.target.closest("button")) return;
  if(RES && !RES.done) finishReveal();
});

/* 鍵盤：設定流程 */
document.addEventListener("keydown", e=>{
  if(!$("#v-setup").classList.contains("active")) return;
  if(e.target.tagName === "INPUT" && e.key !== "Enter") return;
  if(e.key === "Enter"){
    e.preventDefault();
    if(SETUP.i < 3) goStep(SETUP.i + 1, 1); else launchGame();
  }else if(e.key === "Escape"){
    e.preventDefault(); $("#btnStepBack").click();
  }
});

/* 鍵盤控場 */
document.addEventListener("keydown", e=>{
  if(!$("#v-play").classList.contains("active")) return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(!G) return;
  if(e.key === "ArrowRight"){
    e.preventDefault();
    if(G.phase === "ready") startRound();
    else if(G.phase === "running") judge("ok");
    else if(G.phase === "interstitial") closeTurnEnd();     // 結算卡：繼續
  }else if(e.key === "ArrowLeft"){
    e.preventDefault();
    if(G.phase === "running") judge("foul");
  }else if(e.key === "ArrowDown"){
    e.preventDefault();
    if(G.phase === "running") judge("skip");
  }else if(e.key === "Escape"){
    e.preventDefault(); $("#btnPause").click();
  }
});


/* ================= 啟動 ================= */
/* 無法連接時每 15 秒自動重試，無需手動操作 */
setInterval(()=>{ if(!REMOTE.ok && !G) pullText(); }, 15000);

/* 返回 App 或切換回前景時自動重新載入題目，無需重新開啟 */
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && !G && document.body.dataset.view === "home") pullText();
});
window.addEventListener("focus", ()=>{
  if(!G && document.body.dataset.view === "home") pullText();
});

document.body.dataset.view = "home";
renderHome();
pullText();
window.__bigtv = { get G(){return G}, get lines(){return lines}, get cfg(){return cfg},
  startGame, startRound, enterReady, judge, endTurn, endGame, renderHome, renderPlay, showView };
</script>
